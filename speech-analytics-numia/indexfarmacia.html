function Waveform({ progress, onSeek }) {
  const bars = React.useMemo(() => Array.from({ length: 90 }, (_, i) => 0.25 + Math.abs(Math.sin(i * 0.55)) * 0.6 + (i % 7 === 0 ? 0.15 : 0)), []);
  return (
    <div className="waveform" onClick={e => {
      const r = e.currentTarget.getBoundingClientRect();
      onSeek((e.clientX - r.left) / r.width);
    }}>
      <svg viewBox="0 0 90 40" preserveAspectRatio="none" style={{ width: "100%", height: "100%", display: "block" }}>
        {bars.map((b, i) => (
          <rect key={i} x={i + 0.15} width="0.7" y={(1 - b) * 20} height={b * 40} rx="0.35"
            fill={i / 90 <= progress ? "var(--purple)" : "#DDD6EC"}></rect>
        ))}
      </svg>
    </div>
  );
}

  );
}

function Detail({ onBack, row, drawer, onGoProfile }) {
  const r = row || INTERACCIONES[0];
  const caso = r.canal === "Centro de contacto" ? CASO_RECLAMO
    : (r.canal === "WhatsApp" || r.canal === "Domicilio") ? CASO_SEGUIMIENTO
    : CASO_VENTA;
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0.28);
  const [q, setQ] = useState("");
  const [matchIdx, setMatchIdx] = useState(0);
  const [selDetection, setSelDetection] = useState(null);
  const [modal, setModal] = useState(false);
  const [toast, setToast] = useState(null);
  const [note, setNote] = useState("");
  const panelRef = useRef(null);
  const txRef = useRef(null);

  const [min, seg] = r.dur.split(":").map(Number);
  const DUR = min * 60 + seg;
  const fmt = s => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");

  useEffect(() => { setProgress(0.28); setPlaying(false); setQ(""); setSelDetection(null); }, [r.id]);
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setProgress(p => (p >= 1 ? (setPlaying(false), 1) : p + 0.002)), 100);
    return () => clearInterval(id);
  }, [playing]);
  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(id);
  }, [toast]);

  const seekTo = ts => {
    if (!ts) return;
    const [m, s] = ts.split(":").map(Number);
    setProgress(Math.min(1, (m * 60 + s) / DUR));
    setPlaying(true);
  };
  const scrollPanelTo = id => {
    const el = document.getElementById(id);
    if (el && panelRef.current) {
      const top = el.offsetTop - panelRef.current.offsetTop;
      panelRef.current.scrollTo({ top: Math.max(0, top - 8), behavior: "smooth" });
    }
  };

  const matches = [];
  if (q.length >= 2) {
    caso.transcript.forEach((b, bi) => b.parts.forEach((p, pi) => {
      let idx = p.x.toLowerCase().indexOf(q.toLowerCase());
      while (idx !== -1) { matches.push({ bi, pi, idx }); idx = p.x.toLowerCase().indexOf(q.toLowerCase(), idx + 1); }
    }));
  }
  const curMatch = matches.length ? matches[((matchIdx % matches.length) + matches.length) % matches.length] : null;
  useEffect(() => {
    if (!curMatch || !txRef.current) return;
    const el = txRef.current.querySelector(".hl-search.current");
    if (el) txRef.current.scrollTo({ top: el.offsetTop - txRef.current.offsetTop - 80, behavior: "smooth" });
  }, [q, matchIdx]);

  const renderPart = (p, bi, pi) => {
    let content = p.x;
    if (q.length >= 2) {
      const pieces = [];
      let last = 0;
      const lower = p.x.toLowerCase(), ql = q.toLowerCase();
      let idx = lower.indexOf(ql);
      while (idx !== -1) {
        if (idx > last) pieces.push(p.x.slice(last, idx));
        const isCur = curMatch && curMatch.bi === bi && curMatch.pi === pi && curMatch.idx === idx;
        pieces.push(<mark key={idx} className={"hl-search" + (isCur ? " current" : "")}>{p.x.slice(idx, idx + q.length)}</mark>);
        last = idx + q.length;
        idx = lower.indexOf(ql, last);
      }
      if (last < p.x.length) pieces.push(p.x.slice(last));
      content = pieces;
    }
    if (p.hl) {
      const cfg = HL_TYPES[p.hl];
      const dim = selDetection && selDetection !== p.hl;
      return (
        <span key={pi} className={"hl hl-" + p.hl} tabIndex={0} role="button"
          aria-label={cfg.label + ": " + p.x} style={dim ? { opacity: 0.4 } : null}
          onClick={() => scrollPanelTo("card-detecciones")}
          onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); scrollPanelTo("card-detecciones"); } }}>
          <Ph name={cfg.icon} fill className="hl-ic" />
          {content}
          <span className="hl-label">{cfg.label}</span>
        </span>
      );
    }
    return <span key={pi}>{content}</span>;
  };

  const cumplidos = caso.protocol.filter(p => p.ok).length;

        <div className="drawer-head">
          <span style={{ fontSize: 13, color: "var(--ink-3)" }}>Interacciones · {r.sede}</span>

        </div>

        <div className="breadcrumb">
          <a href="#" onClick={e => { e.preventDefault(); onBack(); }}>Interacciones</a>

          <span>{r.sede}</span>
          <Ph name="caret-right" style={{ fontSize: 11 }} />
          <span style={{ color: "var(--ink)", fontWeight: 600 }}>{r.id}</span>
        </div>
      )}

        <h1>Interacción {r.id}</h1>
        <span className="meta-chip"><Ph name="calendar-blank" />{r.fecha}</span>
        <span className="meta-chip"><Ph name="clock" />{r.dur}</span>
        <span className="meta-chip"><Ph name="buildings" />{r.sede}</span>
        <span className="meta-chip"><Ph name="map-pin" />{r.puesto}</span>
        <span className={"chip-canal " + canalCls(r.canal)}>{r.canal}</span>
        <span className="meta-chip"><Ph name="shield-check" />{r.producto}</span>
        <span className="meta-chip"><Ph name="chats-circle" />{r.motivo}</span>
        <span className="meta-chip"><span className="avatar sm">{r.ini}</span>{r.exec}</span>
        <SentPill kind={r.sent} />
      </div>

      <div className={"detail-layout" + (drawer ? " in-drawer" : "")}>
        <section className="card transcript-card">
          <div className="player">
            <div className="player-top">
              <button className="play-btn" onClick={() => setPlaying(!playing)} aria-label={playing ? "Pausar" : "Reproducir"}>
                <Ph name={playing ? "pause" : "play"} fill />
              </button>
              <Waveform progress={progress} onSeek={p => setProgress(p)} />
              <span className="player-time">{fmt(progress * DUR)} / {r.dur}</span>
            </div>
          </div>
          <div className="tx-search">
            <div className="search-bar">
              <Ph name="magnifying-glass" />
              <input placeholder="Buscar en la transcripción…" value={q} onChange={e => { setQ(e.target.value); setMatchIdx(0); }} />
            </div>
            {q.length >= 2 ? (
              <React.Fragment>
                <span className="match-count">
                  {matches.length ? (((matchIdx % matches.length) + matches.length) % matches.length) + 1 + " de " + matches.length : "0 resultados"}
                </span>
                <button className="tx-nav-btn" onClick={() => setMatchIdx(i => i - 1)} disabled={!matches.length}>↑</button>
                <button className="tx-nav-btn" onClick={() => setMatchIdx(i => i + 1)} disabled={!matches.length}>↓</button>
              </React.Fragment>
            ) : null}
          </div>
          <div className="tx-body" ref={txRef}>
            {caso.transcript.map((b, bi) => (
              <div key={bi} className={"bubble-row " + b.who}>

                    {b.who === "exec" ? r.exec.split(" ")[0] + " (asesor)" : "Cliente"}

                  </div>

          </div>
        </section>

                      <span className="ra-n">{i + 1}</span>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>{a.t}</div>
                        <p style={{ fontSize: 13, color: "var(--ink-2)", lineHeight: 1.6, marginTop: 4 }}>{a.d}</p>
                        <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                          <span className="pill sm neu"><Ph name="user" />{a.dueno}</span>
                          <span className={"pill sm " + (a.impacto === "Alto" ? "crit" : "warn")}>impacto {a.impacto.toLowerCase()}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="card-sub" style={{ borderTop: "1px solid var(--border)", paddingTop: 14 }}>
                Nota metodológica: los indicadores se calculan sobre las conversaciones con audio interpretable (2,864 de 3,180 capturadas).
                El CSAT es una estimación a partir del tono y el contenido y no reemplaza la encuesta de servicio.
                Este informe es una herramienta de coaching y de decisión comercial; no constituye evaluación formal de desempeño.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Panel de demo (estados del tablero) ── */
function DemoPanel({ t, setTweak, onClose }) {
  return (
    <div className="demo-panel" role="dialog" aria-label="Opciones de demostración">
      <h4>Modo demostración</h4>
      <div className="dp-sub">Estados del tablero para mostrar en la presentación.</div>
      <div className="dp-row">
        <span>Estado del tablero</span>
        <select value={t.estado} onChange={e => setTweak("estado", e.target.value)}>
          {["normal", "día 1", "configuración pendiente", "bloqueado"].map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      <div className="dp-row">
        <span>Ranking público de asesores</span>
        <button className={"switch" + (t.rankingPublico ? " on" : "")} aria-pressed={t.rankingPublico}
          onClick={() => setTweak("rankingPublico", !t.rankingPublico)} aria-label="Ranking público de asesores"></button>
      </div>
      <div className="dp-row">
        <span>Vista nube de palabras</span>
        <button className={"switch" + (t.nubePalabras ? " on" : "")} aria-pressed={t.nubePalabras}
          onClick={() => setTweak("nubePalabras", !t.nubePalabras)} aria-label="Vista nube de palabras"></button>
      </div>
      <div className="dp-row">
        <span>Lista de interacciones vacía</span>
        <button className={"switch" + (t.listaVacia ? " on" : "")} aria-pressed={t.listaVacia}
          onClick={() => setTweak("listaVacia", !t.listaVacia)} aria-label="Lista de interacciones vacía"></button>
      </div>
      <div className="dp-row">
        <span>Datos insuficientes (asesores)</span>
        <button className={"switch" + (t.datosInsuficientes ? " on" : "")} aria-pressed={t.datosInsuficientes}
          onClick={() => setTweak("datosInsuficientes", !t.datosInsuficientes)} aria-label="Datos insuficientes"></button>
      </div>
      <button className="btn-secondary" style={{ width: "100%", marginTop: 12 }} onClick={onClose}>Cerrar</button>
    </div>
  );
}

/* ══════════════════════ APLICACIÓN ══════════════════════ */
function App() {
  const [tweaks, setTweaks] = useState({
    estado: "normal", rankingPublico: true, nubePalabras: false, listaVacia: false, datosInsuficientes: false,
  });
  const setTweak = (k, v) => setTweaks(s => ({ ...s, [k]: v }));
  const [demoOpen, setDemoOpen] = useState(false);
  const [tab, setTab] = useState("Resumen");
  const [detailRow, setDetailRow] = useState(null);
  const [topic, setTopic] = useState(null);
  const [model, setModel] = useState(null);
  const [informeOpen, setInformeOpen] = useState(false);
  const [exportFmt, setExportFmt] = useState(null);
  const [drillQuery, setDrillQuery] = useState("");
  const [filters, setFilters] = useState(EMPTY_FILTERS);

  const drill = q => { setDrillQuery(typeof q === "string" ? q : ""); setTopic(null); setModel(null); setTab("Interacciones"); };
  const closeAll = () => { setDetailRow(null); setTopic(null); setModel(null); };

  useEffect(() => {
    const open = detailRow || topic || model;
    if (!open) return;
    const onKey = e => { if (e.key === "Escape") closeAll(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [detailRow, topic, model]);

  const variant = tweaks.estado === "bloqueado" ? "locked"
    : tweaks.estado === "día 1" ? "day1"
    : tweaks.estado === "configuración pendiente" ? "setup"
    : "normal";

  return (
    <React.Fragment>
      <a className="skip-link" href="#contenido">Saltar al contenido</a>
      <Sidebar />
      {informeOpen ? <InformeModal onClose={() => setInformeOpen(false)} /> : null}
      {exportFmt ? <ExportPreviewModal tab={tab} format={exportFmt} onClose={() => setExportFmt(null)} /> : null}

      <main className="main" id="contenido">
        <div className="topbar">
          <div>
            <h1 className="page-title">Speech Analytics</h1>
            <div className="page-sub">Sucursales, centro de contacto, WhatsApp y domicilio · {PERIODO.label} ({PERIODO.rango})</div>
          </div>
          <span className="tenant-chip" style={{ marginLeft: 8 }}>
            <span className="tc-dot"><BrandMark size={13} /></span>Cadena de Farmacias
          </span>
          <div style={{ display: "flex", gap: 8, marginLeft: "auto", alignItems: "center", flexWrap: "wrap" }}>
            <button className="chip" onClick={() => setDemoOpen(!demoOpen)} aria-pressed={demoOpen}>
              <Ph name="sliders-horizontal" />Demo
            </button>
            <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }} onClick={() => setInformeOpen(true)}>
              <Ph name="sparkle" fill />Generar informe
            </button>
            <ExportMenu onExport={setExportFmt} />
          </div>
        </div>

        <Tabs tab={tab} onTab={setTab} />
        <FilterRow filters={filters} onChange={setFilters} hideAsesores={tab === "Sucursales"} />
        <ActiveFiltersBar filters={filters} onChange={setFilters} />

        {tab === "Resumen" ? (
          <Dashboard variant={variant}
            rankingPublico={tweaks.rankingPublico}
            nubePalabras={tweaks.nubePalabras}
            onOpenProfile={() => setTab("Asesores")}
            onGoTemas={() => drill("")}
            onDrillTopic={setTopic}
            onOpenModel={setModel}
            onDrill={drill} />
        ) : null}
        {tab === "Ventas" ? <Ventas onDrill={drill} onOpenModel={setModel} /> : null}
        {tab === "Servicio" ? <Reclamaciones onDrill={drill} /> : null}
        {tab === "Interacciones" ? (
          <Interactions onOpenDetail={setDetailRow} forceEmpty={tweaks.listaVacia}
            initialQuery={drillQuery} onExport={setExportFmt} />
        ) : null}
        {tab === "Asesores" ? (
          <Asesores datosInsuficientes={tweaks.datosInsuficientes} onGoInteractions={drill} />
        ) : null}
        {tab === "Sucursales" ? <Oficinas onGoInteractions={drill} /> : null}
      </main>

      {topic ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setTopic(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de tema">
            <TopicDetail topic={topic} onClose={() => setTopic(null)}
              onOpenDetail={() => { setTopic(null); setDetailRow(INTERACCIONES[0]); }}
              onGoInteractions={() => drill(topic.q != null ? topic.q : topic.name)} />
          </aside>
        </div>
      ) : null}

      {model ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setModel(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de producto">
            <ProductoDetail model={model} onClose={() => setModel(null)} onGoInteractions={() => drill(model.name)} />
          </aside>
        </div>
      ) : null}

      {detailRow ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setDetailRow(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de interacción">
            <Detail row={detailRow} drawer onBack={() => setDetailRow(null)}
              onGoProfile={() => { setDetailRow(null); setTab("Asesores"); }} />
          </aside>
        </div>
      ) : null}

      {demoOpen ? <DemoPanel t={tweaks} setTweak={setTweak} onClose={() => setDemoOpen(false)} /> : null}
      <AiFab />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
