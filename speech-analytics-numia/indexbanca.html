    RB_MEAS.forEach(m => { if (m.t === "tasa") r.flags[m.k] = rnd() < m.p * (m.neg ? 2 - skill : skill); });
    r.flags.conflictivo = rnd() < 0.006;
    out.push(r);
  }
  return out;
})();

/* ══════════ Cálculo ══════════ */
const rbNum = (v, dec) => v.toLocaleString("es-AR", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });

function rbValue(m, rows, base) {
  const den = base === "interpretables" ? rows.filter(r => r.interpretable) : rows;
  if (!rows.length) return null;
  if (m.t === "conteo") return m.flag ? rows.filter(r => r.flags[m.flag]).length : rows.length;
  if (m.t === "tasa") return den.length ? (den.filter(r => r.flags[m.k]).length / den.length) * 100 : null;
  if (m.t === "promedio") return den.length ? den.reduce((a, r) => a + r[m.field], 0) / den.length : null;
  return den.length; // distribución / ranking se resuelven por dimensión
}
function rbFmt(m, v) {
  if (v == null) return "—";
  if (m.t === "conteo" || m.t === "distribucion" || m.t === "ranking") return rbNum(v, 0);
  if (m.t === "tasa") return rbNum(v, 1) + "%";
  return rbNum(v, m.dec) + (m.unit || "");
}

/* ══════════ Helpers de vista ══════════ */
const RB_TYPE_ICON = { conteo: "hash", tasa: "percent", promedio: "chart-line-up", distribucion: "chart-donut", ranking: "list-numbers" };
const RB_TYPE_LABEL = { conteo: "conteo", tasa: "tasa %", promedio: "promedio", distribucion: "distribución", ranking: "ranking" };
const RB_VIZ = [
  { k: "pivot", n: "Tabla", icon: "table", help: "Filas y columnas con los valores exactos." },
  { k: "barra", n: "Barra", icon: "chart-bar-horizontal", help: "Compara magnitudes entre grupos." },
  { k: "linea", n: "Línea", icon: "chart-line", help: "Evolución en el tiempo." },
  { k: "kpi", n: "KPI", icon: "square", help: "Un solo número grande." },
];
const RB_PALETTE = ["var(--purple)", "#0072B2", "#56B4E9", "#E69F00", "#CC79A7"];

const rbFilter = gf => RB_ROWS.filter(r =>
  (!gf.sucs || !gf.sucs.length || gf.sucs.indexOf(r.suc) >= 0) &&
  (!gf.agentes || !gf.agentes.length || gf.agentes.indexOf(r.agente) >= 0) &&
  (gf.canal === "Todos" || r.canal === gf.canal));

function rbValidViz(cfg) {
  const v = ["pivot"];
  if (cfg.rowDims.length === 1) v.push("barra");
  if (cfg.rowDims.length === 1 && ["periodo", "mes"].indexOf(cfg.rowDims[0].k) >= 0 && cfg.meas.length === 1) v.push("linea");
  if (!cfg.rowDims.length && cfg.meas.length === 1) v.push("kpi");
  return v;
}
function rbRecommended(cfg) {
  if (!cfg.rowDims.length && cfg.meas.length === 1) return "kpi";
  if (cfg.rowDims.length === 1 && ["periodo", "mes"].indexOf(cfg.rowDims[0].k) >= 0 && cfg.meas.length === 1) return "linea";
  if (cfg.rowDims.length === 1 && cfg.meas.length === 1) return "barra";
  return "pivot";
}
const rbEffViz = cfg => {
  const valid = rbValidViz(cfg);
  return cfg.viz && valid.indexOf(cfg.viz) >= 0 ? cfg.viz : rbRecommended(cfg);
};
const rbInvalid = cfg => cfg.meas.length > 1 && cfg.colDims.length > 0;
const rbNaMeas = (cfg, gf) => cfg.meas.filter(k => RB_M[k].soloCaja && gf.canal === "SAC").map(k => RB_M[k]);

function rbPivot(rows, cfg, base) {
  if (!rows.length || !cfg.meas.length) return null;
  const rd = cfg.rowDims.map(d => d.k);
  const limit = (vals, topN) => topN === "Todos" ? vals : vals.slice(0, parseInt(String(topN).replace("Top ", ""), 10));
  const combos = [];
  const walk = (i, acc) => {
    if (i === rd.length) { combos.push(acc); return; }
    const d = cfg.rowDims[i];
    const counts = {}, score = {};
    const M0 = RB_M[cfg.meas[0]];
    RB_DIM[d.k].vals.forEach(v => {
      const sub = rows.filter(r => r[d.k] === v && acc.every((a, j) => r[rd[j]] === a));
      counts[v] = sub.length;
      score[v] = sub.length ? (rbValue(M0, sub, base) || 0) : -Infinity;
    });
    limit(RB_DIM[d.k].vals.slice().filter(v => counts[v] > 0).sort((a, b) => score[b] - score[a]), d.topN).forEach(v => walk(i + 1, [...acc, v]));
  };
  if (rd.length) walk(0, []); else combos.push([]);
  const cd = cfg.colDims[0];
  const colVals = cd ? limit(RB_DIM[cd.k].vals.filter(v => rows.some(r => r[cd.k] === v)), cd.topN) : [null];
  const body = combos.map(c => {
    const subset = rows.filter(r => c.every((v, j) => r[rd[j]] === v));
    return {
      combo: c, subset,
      cells: colVals.map(cv => cfg.meas.map(k => rbValue(RB_M[k], cv == null ? subset : subset.filter(r => r[cd.k] === cv), base))),
    };
  }).filter(b => b.subset.length > 0);
  return { colVals, body, cd };
}

/* ══════════ Estados ══════════ */
function RbSkeleton() {

      ))}
    </div>
  );
}
function RbMsg({ icon, title, body, tone, action }) {
  const c = tone === "warn" ? "var(--amber)" : tone === "error" ? "var(--red)" : "var(--purple)";

}

/* ══════════ Render de una visualización ══════════ */
function RbView({ cfg, gf: gfIn, base, height }) {
  const gf = useMemoR(() => (cfg.canal ? { ...gfIn, canal: cfg.canal } : gfIn), [gfIn, cfg.canal]);
  const rows = useMemoR(() => rbFilter(gf), [gf]);
  useEffectR(() => { window.__rbOpenGallery = () => setGallery(true); return () => { delete window.__rbOpenGallery; }; }, []);
  const pivot = useMemoR(() => rbPivot(rows, cfg, base), [rows, cfg, base]);
  const na = rbNaMeas(cfg, gf);
  const naAll = na.length === cfg.meas.length && cfg.meas.length > 0;
  if (!cfg.meas.length) return <RbMsg icon="ruler" title="Seleccione una métrica" body="Indique qué desea medir —por ejemplo, el porcentaje de atenciones resueltas— y el gráfico se calcula solo." />;
  if (rbInvalid(cfg)) return <RbMsg tone="error" icon="warning-circle" title="Esta combinación no se puede mostrar" body="No se pueden ver varias métricas y un segundo corte al mismo tiempo: la tabla quedaría con dos ejes de números. Deje una sola métrica o quite el cruce." />;
  if (!rows.length) return <RbMsg tone="warn" icon="database" title="No hay atenciones con estos filtros" body="La combinación de agencia, usuario y tipo de atención no registró atenciones en el período. Amplíe el rango de fechas o quite un filtro." />;
  if (naAll) return <RbMsg tone="warn" icon="info" title="Las métricas elegidas no aplican a SAC" body="Las fricciones de caja (sistema caído, falta de sencillo o de cambio) solo se detectan en atenciones de ventanilla. Modifique el filtro de canal o seleccione otra métrica." />;
  const viz = rbEffViz(cfg);
  const M0 = RB_M[cfg.meas[0]];

  if (viz === "kpi") {
    return (
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", padding: "26px 4px" }}>
        {cfg.meas.map(k => {
          const M = RB_M[k], no = M.soloCaja && gf.canal === "SAC";
          return (
            <div key={k} style={{ flex: "1 1 200px" }}>
              <div style={{ fontSize: 12.5, color: "var(--ink-3)", marginBottom: 8 }}>{M.n}</div>
              <div style={{ fontSize: 40, fontWeight: 600, letterSpacing: "-0.02em", color: no ? "var(--ink-3)" : M.alerta ? "var(--red)" : "var(--ink)", fontVariantNumeric: "tabular-nums" }}>
                {no ? "N/A" : rbFmt(M, rbValue(M, rows, base))}
              </div>
              <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 6 }}>{rbNum(rows.length, 0)} atenciones</div>
            </div>
          );
        })}
      </div>
    );
  }
  if (viz === "linea") {
    const pts = pivot.body.map(b => ({ x: b.combo.join(" "), v: b.cells[0][0] || 0 }));
    const mx = Math.max.apply(null, pts.map(p => p.v)) * 1.15 || 1;
    const W = 760, H = height || 250, x0 = 46, x1 = 744, y0 = H - 40, yT = 14;
    const X = i => x0 + (i * (x1 - x0)) / Math.max(1, pts.length - 1);
    const Y = v => y0 - (v / mx) * (y0 - yT);
    return (
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto", display: "block" }}>
        {[0, 0.25, 0.5, 0.75, 1].map(f => (
          <g key={f}>
            <line x1={x0} y1={Y(mx * f)} x2={x1} y2={Y(mx * f)} stroke="rgba(26,26,46,0.07)"></line>
            <text x={x0 - 10} y={Y(mx * f) + 4} textAnchor="end" style={{ fontSize: 11, fill: "var(--ink-3)" }}>{rbNum(mx * f, 0)}</text>
          </g>
        ))}
        <path d={pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(p.v).toFixed(1)).join(" ")} fill="none" stroke="var(--purple)" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"></path>
        {pts.map((p, i) => <circle key={p.x} cx={X(i)} cy={Y(p.v)} r="3.5" fill="var(--purple)" stroke="#fff" strokeWidth="1.5"><title>{p.x}: {rbFmt(M0, p.v)}</title></circle>)}
        {pts.map((p, i) => <text key={"l" + p.x} x={X(i)} y={y0 + 22} textAnchor="middle" style={{ fontSize: 11, fill: "var(--ink-3)" }}>{p.x}</text>)}
      </svg>
    );
  }
  if (viz === "barra") {
    const stacked = cfg.colDims.length && cfg.apilar;
    const maxV = Math.max.apply(null, pivot.body.map(b => stacked ? b.cells.reduce((a, c) => a + (c[0] || 0), 0) : (b.cells[0][0] || 0))) || 1;
    return (
      <div>
        {pivot.body.map(b => {
          const tot = b.cells.reduce((a, c) => a + (c[0] || 0), 0);
          return (
            <div key={b.combo.join("|")} style={{ display: "grid", gridTemplateColumns: "minmax(110px,200px) 1fr 76px", alignItems: "center", gap: 12, padding: "5px 0" }}>
              <span style={{ fontSize: 12.5, color: "var(--ink-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.combo.join(" · ") || "Total"}</span>
              <div style={{ display: "flex", height: 18, borderRadius: 4, overflow: "hidden", background: "var(--bg)" }}>
                {stacked ? b.cells.map((c, i) => (
                  <div key={i} title={pivot.colVals[i] + ": " + rbFmt(M0, c[0])} style={{ width: ((c[0] || 0) / maxV * 100) + "%", background: RB_PALETTE[i % RB_PALETTE.length] }}></div>
                )) : (
                  <div style={{ width: Math.max(1, (b.cells[0][0] || 0) / maxV * 100) + "%", background: "var(--purple)", borderRadius: 4, transition: "width .28s cubic-bezier(0.4,0,0.2,1)" }}></div>
                )}
              </div>
              <span style={{ fontSize: 12.5, fontWeight: 600, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{rbFmt(M0, stacked ? tot : b.cells[0][0])}</span>
            </div>
          );
        })}
        {stacked ? (
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 12, paddingTop: 10, borderTop: "1px solid var(--border)" }}>
            {pivot.colVals.map((v, i) => (
              <span key={v} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--ink-2)" }}>
                <span style={{ width: 9, height: 9, borderRadius: 2, background: RB_PALETTE[i % RB_PALETTE.length] }}></span>{v}
              </span>
            ))}
          </div>
        ) : null}
      </div>
    );
  }
  return (
    <div style={{ overflowX: "auto" }}>
      <table className="data" style={{ width: "100%", fontSize: 12.5, borderCollapse: "collapse" }}>
        <thead>
          {pivot.cd ? (
            <tr>
              {cfg.rowDims.map(d => <th key={d.k} rowSpan="2" style={{ whiteSpace: "nowrap", verticalAlign: "bottom" }}>{RB_DIM[d.k].n}</th>)}
              {pivot.colVals.map(cv => <th key={cv} colSpan={cfg.meas.length} style={{ textAlign: "center", whiteSpace: "nowrap", borderLeft: "1px solid var(--border)" }}>{cv}</th>)}
            </tr>
          ) : null}
          <tr>
            {!pivot.cd ? cfg.rowDims.map(d => <th key={d.k} style={{ whiteSpace: "nowrap" }}>{RB_DIM[d.k].n}</th>) : null}
            {pivot.colVals.map(cv => cfg.meas.map(k => (
              <th key={String(cv) + k} style={{ textAlign: "right", whiteSpace: "nowrap" }}>{RB_M[k].n}</th>
            )))}
          </tr>
        </thead>
        <tbody>
          {pivot.body.map(b => (
            <tr key={b.combo.join("|")}>
              {b.combo.map((v, i) => <td key={i} style={{ fontWeight: i === 0 ? 500 : 400, whiteSpace: "nowrap" }}>{v}</td>)}
              {b.cells.map((cell, ci) => cell.map((v, mi) => {
                const M = RB_M[cfg.meas[mi]], no = M.soloCaja && gf.canal === "SAC";
                return <td key={ci + "-" + mi} style={{ textAlign: "right", fontVariantNumeric: "tabular-nums", color: no ? "var(--ink-3)" : M.alerta && v > 0 ? "var(--red)" : "var(--ink-2)", borderLeft: ci > 0 && mi === 0 ? "1px solid var(--border)" : "none" }}>{no ? "N/A" : rbFmt(M, v)}</td>;
              }))}
            </tr>
          ))}
          <tr style={{ borderTop: "2px solid var(--border)", fontWeight: 600 }}>
            {cfg.rowDims.map((d, i) => <td key={d.k}>{i === 0 ? "Total" : ""}</td>)}
            {pivot.colVals.map((cv, ci) => cfg.meas.map((k, mi) => {
              const M = RB_M[k], no = M.soloCaja && gf.canal === "SAC";
              const sub = cv == null ? rows : rows.filter(r => r[pivot.cd.k] === cv);
              return <td key={ci + "-" + mi} style={{ textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{no ? "N/A" : rbFmt(M, rbValue(M, sub, base))}</td>;
            }))}
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* ══════════ Chart builder (patrón Intercom) ══════════ */
function RbChartBuilder({ initial, gf, base, onBase, onCancel, onSave }) {
  const [cfg, setCfg] = useStateR(initial);
  const [loading, setLoading] = useStateR(false);
  const key = JSON.stringify([cfg.meas, cfg.rowDims, cfg.colDims, cfg.apilar, base]);
  useEffectR(() => { setLoading(true); const t = setTimeout(() => setLoading(false), 300); return () => clearTimeout(t); }, [key]);
  useEffectR(() => {
    const onKey = e => { if (e.key === "Escape") onCancel(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, []);
  const set = p => setCfg(c => ({ ...c, ...p }));
  const valid = rbValidViz(cfg), rec = rbRecommended(cfg), eff = rbEffViz(cfg);
  const rowDim = cfg.rowDims[0] ? cfg.rowDims[0].k : null;
  const colDim = cfg.colDims[0] ? cfg.colDims[0].k : null;
  const colBlocked = cfg.meas.length > 1;
  const invalid = rbInvalid(cfg);
  const autoName = cfg.meas.length ? RB_M[cfg.meas[0]].n + (rowDim ? " por " + RB_DIM[rowDim].n.toLowerCase() : "") : "";

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 220, background: "rgba(10,12,17,0.5)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }} onClick={onCancel}>
      <div onClick={e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Constructor de gráfico"
        style={{ width: "100%", height: "100%", maxWidth: 1340, background: "#fff", borderRadius: 14, boxShadow: "0 28px 70px rgba(10,12,17,0.32)", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {/* header */}
        <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 22px 14px" }}>
          <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 8 }}>
            <input value={cfg.name} onChange={e => set({ name: e.target.value })} placeholder="Escriba un nombre para este gráfico"
              style={{ width: 340, maxWidth: "100%", border: "none", borderBottom: "1px dashed transparent", padding: "2px 0", fontFamily: "inherit", fontSize: 19, fontWeight: 600, color: "var(--ink)", background: "transparent" }}
              onFocus={e => { e.target.style.borderBottomColor = "var(--border)"; }} onBlur={e => { e.target.style.borderBottomColor = "transparent"; }} />
            <i className="ph ph-pencil-simple" aria-hidden="true" style={{ fontSize: 15, color: "var(--ink-3)", flexShrink: 0 }}></i>
          </div>
          <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
            <button className="btn-secondary" onClick={onCancel}>Cancelar</button>
            <button className="btn-primary" disabled={!cfg.meas.length || invalid}
              style={{ opacity: (!cfg.meas.length || invalid) ? 0.5 : 1, cursor: (!cfg.meas.length || invalid) ? "not-allowed" : "pointer" }}
              onClick={() => onSave({ ...cfg, name: cfg.name || autoName, viz: eff })}>
              {initial.saved ? "Guardar cambios" : "Agregar gráfico"}
            </button>
          </div>
        </div>

        <div style={{ flex: 1, minHeight: 0, display: "grid", gridTemplateColumns: "minmax(0,1fr) 380px", borderTop: "1px solid var(--border)" }}>
          {/* izquierda: tipos + preview */}
          <div style={{ overflowY: "auto", padding: "16px 22px 26px" }}>
            <section className="card" style={{ minHeight: 330 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                <span style={{ fontSize: 14.5, fontWeight: 600 }}>{cfg.name || autoName || "Gráfico sin título"}</span>
              </div>
              {loading ? <RbSkeleton /> : <RbView cfg={cfg} gf={gf} base={base} />}

          </div>

          <div style={{ borderLeft: "1px solid var(--border)", overflowY: "auto", padding: "14px 20px 30px" }}>
            <React.Fragment>
                <RbSection title={<React.Fragment>Tipo de visualización <InfoDot text="Cómo se dibuja el resultado. Tabla para leer los valores exactos, barra para comparar agencias o usuarios, línea para ver la evolución en el tiempo y KPI para un único número. Solo se habilitan las opciones que sirven para lo que eligió; el punto marca la sugerida." /></React.Fragment>}>
                  <div style={{ display: "inline-flex", gap: 2, background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 10, padding: 3 }}>
                    {RB_VIZ.map(v => {
                      const ok = valid.indexOf(v.k) >= 0, on = eff === v.k;

                        <button key={v.k} disabled={!ok} onClick={() => set({ viz: v.k })}

                  <RbDimSelect value={rowDim} exclude={colDim ? [colDim] : []} placeholder="Sin agrupación (total general)"
                    onChange={v => set({ rowDims: v ? [{ k: v, topN: cfg.rowDims[0] ? cfg.rowDims[0].topN : "Todos" }] : [] })} />

                  <RbDimSelect value={colDim} disabled={colBlocked} exclude={rowDim ? [rowDim] : []} placeholder="Sin cruce"

                  {colBlocked ? (

                      <i className="ph ph-info" style={{ fontSize: 14, flexShrink: 0, marginTop: 1 }}></i>
                      <span>Deje una sola métrica para habilitar el cruce por columnas.</span>
                    </div>
                  ) : null}
                  {colDim && eff === "barra" ? (
                    <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: "var(--ink-2)", cursor: "pointer", marginTop: 10 }}>
                      <input type="checkbox" checked={!!cfg.apilar} onChange={e => set({ apilar: e.target.checked })} />
                      Apilar las barras
                    </label>
                  ) : null}
                </RbSection>
              <RbSection title={<React.Fragment>Canal de atención <InfoDot text="Por defecto el gráfico usa el canal elegido en los filtros del reporte. Puede fijarlo a Caja o SAC si este gráfico en particular solo aplica a uno de los dos." /></React.Fragment>}>
                <RbSegmented value={cfg.canal || "reporte"} onChange={v => set({ canal: v === "reporte" ? null : v })}
                  options={[{ k: "reporte", n: "Según el reporte" }, { k: "Todos", n: "Caja y SAC" }, { k: "Caja", n: "Caja" }, { k: "SAC", n: "SAC" }]} />
              </RbSection>

              <RbSection title={<React.Fragment>Base de cálculo <InfoDot text="Sobre qué universo se calculan los porcentajes. Algunas atenciones no se pueden analizar porque el audio quedó inaudible o demasiado corto. “Todas” las cuenta e incluirlas baja los porcentajes; “Solo interpretables” mide únicamente las conversaciones que el análisis sí pudo escuchar. Se aplica a todo el reporte." /></React.Fragment>}>
                <RbSegmented value={base} onChange={onBase} options={[{ k: "todas", n: "Todas" }, { k: "interpretables", n: "Solo interpretables" }]} />
              </RbSection>
            </React.Fragment>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [snapshot, setSnapshot] = useStateR([]);
  const [gallery, setGallery] = useStateR(false);
  const [builder, setBuilder] = useStateR(null);
  const [base, setBase] = useStateR("todas");
  const canal = (filters && filters.canal) || "Todos";
  const gf = useMemoR(() => ({
    sucs: (filters && filters.sucursales) || [], agentes: (filters && filters.ejecutivos) || [],
    canal, fecha: (filters && filters.periodo) || "Últimos 30 días",
  }), [filters, canal]);
  const [toast, setToast] = useStateR(null);
  useEffectR(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);

  const rows = useMemoR(() => rbFilter(gf), [gf]);

function StatDonut({ title, sub, span, centerNum, centerLabel, segs, onDrill }) {
  const C = 2 * Math.PI * 62;
  let acc = 0;

  return (
    <section className={"card span-" + (span || 6)} data-screen-label={title}>

          {segs.map((d, i) => {
            const frac = d.n / sum; const dash = frac * C; const off = -acc; acc += dash;

function ExportPreviewModal({ tab, format, onClose }) {
  const sheets = EXPORT_SHEETS(tab);
  const fmtLabel = format === "csv" ? "CSV (.csv)" : "Excel (.xlsx)";
  React.useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, []);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(10,12,17,0.4)", backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)", display: "flex", alignItems: "center", justifyContent: "center" }} onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label="Vista previa de exportación" onClick={e => e.stopPropagation()}
        style={{ width: "82%", height: "88%", maxWidth: 1200, minWidth: 720, background: "#fff", borderRadius: 12, boxShadow: "0 24px 64px rgba(10,12,17,0.3)", overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 20px", borderBottom: "1px solid var(--border)", flexShrink: 0 }}>
          <span style={{ width: 34, height: 34, borderRadius: 9, background: "var(--green-bg)", color: "var(--green)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>
            <i className={"ph-fill " + (format === "csv" ? "ph-file-csv" : "ph-file-xls")}></i>
          </span>
          <div>
            <div style={{ fontSize: 15, fontWeight: 600 }}>Vista previa de exportación — {tab}</div>
            <div style={{ fontSize: 12.5, color: "var(--ink-3)" }}>{fmtLabel} · {sheets.length} {sheets.length === 1 ? "hoja" : "hojas"} · Banca · red de agencias</div>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6 }} onClick={onClose}>
              <i className="ph ph-download-simple"></i>Descargar {format === "csv" ? "CSV" : "Excel"}
            </button>
            <button className="btn-secondary" aria-label="Cerrar" onClick={onClose} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <i className="ph ph-x"></i>Cerrar
            </button>
          </div>
        </div>
        <div style={{ flex: 1, minHeight: 0, overflow: "auto", padding: "22px 24px 32px", background: "var(--bg, #F7F7F9)" }}>
          {sheets.map(sh => (
            <div key={sh.title} style={{ marginBottom: 26 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 8 }}>
                <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "#fff", background: "var(--green)", padding: "3px 9px", borderRadius: 5 }}>Hoja</span>
                <span style={{ fontSize: 15, fontWeight: 600 }}>{sh.title}</span>
                {sh.note ? <span style={{ fontSize: 12, color: "var(--ink-3)" }}>{sh.note}</span> : null}
              </div>
              <div style={{ overflowX: "auto", border: "1px solid var(--border)", borderRadius: 8, background: "#fff" }}>
                <table className="data export-preview" style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr>
                      <th style={{ width: 34, textAlign: "center", color: "var(--ink-3)", background: "#F0F0F3", fontWeight: 600 }}></th>
                      {sh.cols.map((c, i) => (
                        <th key={i} style={{ textAlign: "left", padding: "8px 12px", background: "#F0F0F3", fontWeight: 600, whiteSpace: "nowrap", borderLeft: "1px solid var(--border)" }}>{c}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {sh.rows.length === 0 ? (
                      <tr><td colSpan={sh.cols.length + 1} style={{ padding: "16px 12px", color: "var(--ink-3)", textAlign: "center" }}>Sin datos en el período.</td></tr>
                    ) : sh.rows.map((r, ri) => (
                      <tr key={ri}>
                        <td style={{ width: 34, textAlign: "center", color: "var(--ink-3)", background: "#FAFAFB", fontVariantNumeric: "tabular-nums", borderTop: "1px solid var(--border)" }}>{ri + 1}</td>
                        {r.map((cell, ci) => (
                          <td key={ci} style={{ padding: "7px 12px", whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums", borderTop: "1px solid var(--border)", borderLeft: "1px solid var(--border)", color: ci === 0 ? "var(--ink)" : "var(--ink-2)", fontWeight: ci === 0 ? 500 : 400 }}>{cell}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Panel de demostración: estados del tablero para la presentación ── */
function DemoPanel({ t, setTweak, onClose }) {
  const toggles = [
    ["rankingPublico", "Ranking público de ejecutivos"],
    ["nubePalabras", "Vista nube de palabras"],
    ["listaVacia", "Lista de interacciones vacía"],
    ["datosInsuficientes", "Datos insuficientes (perfil)"],
  ];
  return (
    <div className="demo-panel" role="dialog" aria-label="Opciones de demostración">
      <h4>Modo demostración</h4>
      <div className="dp-sub">Estados del tablero para mostrar en la presentación.</div>
      <div className="dp-row">
        <span>Estado del tablero</span>
        <select value={t.estado} onChange={e => setTweak("estado", e.target.value)}>
          {["normal", "día 1", "config. pendiente", "bloqueado"].map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      {toggles.map(([k, label]) => (
        <div className="dp-row" key={k}>
          <span>{label}</span>
          <button className={"switch" + (t[k] ? " on" : "")} aria-pressed={t[k]}
            onClick={() => setTweak(k, !t[k])} aria-label={label}></button>
        </div>
      ))}
      <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 10 }}>
        <button className="btn-secondary" onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}

/* ── Aplicación principal — navegación y estados ── */
const ESTADOS_DEFAULTS = {
  estado: "normal",
  listaVacia: false,
  rankingPublico: true,
  datosInsuficientes: false,
  nubePalabras: false,
};

function App() {
  const [t, setT] = React.useState(ESTADOS_DEFAULTS);
  const setTweak = (k, v) => setT(s => ({ ...s, [k]: v }));
  const [demoOpen, setDemoOpen] = React.useState(false);
  const [tab, setTab] = React.useState("Resumen");
  const [drawer, setDrawer] = React.useState(false);
  const [topic, setTopic] = React.useState(null);
  const [informeOpen, setInformeOpen] = React.useState(false);
  const [exportFmt, setExportFmt] = React.useState(null);
  const [drillQuery, setDrillQuery] = React.useState("");
  const drill = q => { setDrillQuery(q || ""); setTab("Interacciones"); };
  const [filters, setFilters] = React.useState({ periodo: null, sucursales: [], ejecutivos: [], interpretable: null, keyword: null });
  const [consentFilter, setConsentFilter] = React.useState(null);
  const openConsentimiento = estado => { setConsentFilter(estado || "Todas"); setTab("Consentimiento"); };

  const openDetail = () => setDrawer(true);
  const closeDrawer = () => setDrawer(false);

  React.useEffect(() => {
    if (!drawer && !topic) return;
    const onKey = e => { if (e.key === "Escape") { setDrawer(false); setTopic(null); } };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [drawer, topic]);

  const variant = t.estado === "bloqueado" ? "locked"
    : t.estado === "día 1" ? "day1"
    : t.estado === "config. pendiente" ? "setup"
    : "normal";

  return (
    <React.Fragment>
      <a className="skip-link" href="#contenido">Saltar al contenido</a>
      <Sidebar />
      {informeOpen ? <InformeModal onClose={() => setInformeOpen(false)} /> : null}
      {exportFmt ? <ExportPreviewModal tab={tab} format={exportFmt} onClose={() => setExportFmt(null)} /> : null}
      <main className="main" id="contenido">
        <div className="topbar">
          <div>
            <h1 className="page-title">Speech Analytics</h1>
            <div className="page-sub">Agencias, caja y plataforma · {PERIODO_INFORME}</div>
          </div>
          <span className="tenant-chip" style={{ marginLeft: 8 }}>
            <span className="tc-dot"><BrandMark size={13} /></span>Banca
          </span>
          <div style={{ display: "flex", gap: 8, marginLeft: "auto", alignItems: "center", flexWrap: "wrap" }}>
            <button className="chip" onClick={() => setDemoOpen(!demoOpen)} aria-pressed={demoOpen}>
              <Ph name="sliders-horizontal" />Demo
            </button>
            <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }} onClick={() => setInformeOpen(true)}>
              <i className="ph-fill ph-sparkle" aria-hidden="true"></i>Generar informe
            </button>
            <ExportMenu onExport={setExportFmt} />
          </div>
        </div>
        <Tabs tab={tab} onTab={setTab} />
        {/* Filtros globales: debajo de las tabs, visibles en cada tab */}
        <FilterRow filters={filters} onChange={setFilters} hideEjecutivos={tab === "Agencias" || tab === "Consentimiento"} />
        <ActiveFiltersBar filters={filters} onChange={setFilters} />
        {tab === "Resumen" ? (
          <Dashboard variant={variant}
            rankingPublico={t.rankingPublico}
            nubePalabras={t.nubePalabras}
            onGoTemas={() => setTab("Interacciones")}
            onDrillTopic={setTopic}
            onOpenProfile={() => setTab("Performance de usuarios")}
            onDrillToInteractions={() => setTab("Interacciones")}
            activeKeyword={filters.keyword}
            onFilterKeyword={kw => setFilters(f => ({ ...f, keyword: f.keyword === kw ? null : kw }))}
            onOpenConsentimiento={openConsentimiento} />
        ) : null}
        {tab === "Comercial" ? <Comercial onDrill={drill} /> : null}
        {tab === "Caja" ? <Caja onDrill={drill} /> : null}
        {tab === "Interacciones" ? (
          <Interactions onOpenDetail={openDetail} forceEmpty={t.listaVacia} initialQuery={drillQuery} />
        ) : null}
        {tab === "Consentimiento" ? (
          <Consentimiento initialEstado={consentFilter} />
        ) : null}
        {tab === "Performance de usuarios" ? (
          <Profile onOpenDetail={openDetail} datosInsuficientes={t.datosInsuficientes}
            onGoInteractions={() => setTab("Interacciones")} />
        ) : null}
        {tab === "Agencias" ? <Agencias /> : null}
        {tab === "Reportes" ? <Reportes filters={filters} /> : null}
      </main>


      {topic ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setTopic(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de tema">
            <TopicDetail topic={topic} onClose={() => setTopic(null)}
              onOpenDetail={() => { setTopic(null); setDrawer(true); }} />
          </aside>
        </div>
      ) : null}

      {drawer ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) closeDrawer(); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de interacción">
            <Detail onBack={closeDrawer} locked={variant === "locked" || variant === "setup"} drawer />
          </aside>
        </div>
      ) : null}

      {demoOpen ? <DemoPanel t={t} setTweak={setTweak} onClose={() => setDemoOpen(false)} /> : null}
      <AiFab />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
