<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech Analytics — Banca</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237B2FE8'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='13' width='3' height='6' rx='1.5'/%3E%3Crect x='12.5' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='5' width='3' height='22' rx='1.5'/%3E%3Crect x='23.5' y='11' width='3' height='10' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">

<style>
/* ══════════════════════════════════════════════════════════════════════
   Sistema de diseño del tablero de Speech Analytics: mismos tokens,
   tipografías y reglas de componentes del tablero original. Debajo se
   agregan solo los componentes propios de este tablero, escritos con
   esos mismos tokens.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --purple:#7B2FE8;
  --purple-600:#5E18C7;
  --purple-soft:#EFE4FE;
  --purple-tint:#F8F2FF;
  --green:#1A7F5A;
  --green-bg:#E8F5EF;
  --amber:#B45309;
  --amber-bg:#FDF3E7;
  --red:#991B1B;
  --red-bg:#FBEAEA;
  --blue:#1D4ED8;
  --blue-bg:#EAF0FD;
  --bg:#FAFAFA;
  --card:#FFFFFF;
  --border:#E5E5E5;
  --ink:#1A1A2E;
  --ink-2:#4A4A5A;
  --ink-3:#8A8A99;
  --neutral:#9CA3AF;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--purple);text-decoration:none;}
a:hover{color:var(--purple-600);text-decoration:underline;}
button{font-family:inherit;}

/* ── Sidebar ── */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:56px;
  background:#fff;border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:12px 0;gap:4px;z-index:40;
}
.sidebar .logo{
  width:32px;height:32px;border-radius:8px;background:var(--purple);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;margin-bottom:12px;
}
.nav-item{
  width:40px;height:40px;border-radius:8px;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--ink-3);font-size:20px;transition:background .12s,color .12s;
}
.nav-item:hover{background:#F3F1F8;color:var(--ink-2);}
.nav-item.active{background:var(--purple-soft);color:var(--purple);}
.sidebar .spacer{flex:1;}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--purple-soft);
  color:var(--purple);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.avatar.sm{width:26px;height:26px;font-size:10px;}
.avatar.lg{width:52px;height:52px;font-size:17px;}
.avatar.gray{background:#F0F0F3;color:var(--ink-2);}

/* ── Layout ── */
.main{margin:0 auto;padding:0 28px 90px;max-width:none;}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 4px;}
.page-title{font-size:20px;font-weight:600;letter-spacing:-0.3px;}
.page-sub{font-size:12px;color:var(--ink-3);padding-top:3px;}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:10px 0 18px;}
.tab{
  padding:10px 16px;font-size:14px;font-weight:500;color:var(--ink-3);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;
  transition:color .12s;margin-bottom:-1px;
}
.tab:hover{color:var(--ink-2);}
.tab.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:600;}

/* chips */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;
  background:#fff;border:1px solid var(--border);
  font-size:13px;font-weight:500;color:var(--ink-2);
  cursor:pointer;transition:border-color .12s,background .12s;position:relative;
}
.chip:hover{border-color:#C9C9D4;background:#FCFCFD;}
.chip i{font-size:14px;color:var(--ink-3);}
.chip.open,.chip.active-filter{border-color:var(--purple);color:var(--purple);background:var(--purple-soft);}
.chip.open i,.chip.active-filter i{color:var(--purple);}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0 18px;position:relative;}

/* dropdown */
.dropdown{
  position:absolute;top:calc(100% + 6px);left:0;z-index:50;
  width:260px;background:#fff;border:1px solid var(--border);border-radius:10px;
  box-shadow:0 8px 24px rgba(26,26,46,0.12);padding:10px;
}
.dropdown .dd-search{
  display:flex;align-items:center;gap:6px;border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;margin-bottom:8px;
}
.dropdown .dd-search input{border:none;outline:none;font-family:inherit;font-size:13px;width:100%;}
.dd-opt{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;
  font-size:13px;color:var(--ink);cursor:pointer;
}
.dd-opt:hover{background:var(--purple-tint);}
.dd-opt input{accent-color:var(--purple);}
.dd-apply{
  width:100%;margin-top:8px;padding:8px;border-radius:8px;border:none;
  background:var(--purple);color:#fff;font-size:13px;font-weight:600;cursor:pointer;
}
.dd-apply:hover{background:var(--purple-600);}

/* ── Cards / grid ── */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:20px 24px;position:relative;display:flex;flex-direction:column;
  transition:box-shadow .15s,transform .15s;
}
.card.hoverable{cursor:pointer;}
.card.hoverable:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,26,46,0.08);}
.card .ver-detalle{
  position:absolute;top:18px;right:20px;font-size:12px;font-weight:500;color:var(--purple);
  opacity:0;transition:opacity .15s;pointer-events:none;
}
.card.hoverable:hover .ver-detalle{opacity:1;}
.span-3{grid-column:span 3;}
.span-4{grid-column:span 4;}
.span-6{grid-column:span 6;}
.span-8{grid-column:span 8;}
.span-12{grid-column:span 12;}

.card-label{
  font-size:12px;text-transform:uppercase;letter-spacing:0.06em;
  color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px;
}
.card-title{font-size:14px;font-weight:600;color:var(--ink);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
.card-sub{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.45;}

.card.primary-card{}
.card.alert-card{border-left:3px solid var(--red);}

/* metric */
.metric-value-row{display:flex;align-items:baseline;gap:10px;margin-top:10px;flex-wrap:wrap;}
.metric-value{font-size:36px;font-weight:600;letter-spacing:-0.8px;line-height:1;}
.metric-unit{font-size:18px;font-weight:500;color:var(--ink-3);}
.trend{
  display:inline-flex;align-items:center;gap:3px;
  font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;
}
.trend.up{color:var(--green);background:var(--green-bg);}
.trend.down{color:var(--red);background:var(--red-bg);}
.trend.warn{color:var(--amber);background:var(--amber-bg);}
.trend.flat{color:var(--ink-2);background:#F0F0F3;}
.metric-spark{margin-top:auto;padding-top:14px;height:auto;}
.card:has(.metric-spark){display:flex;flex-direction:column;width:100%;}
.metric-spark svg{display:block;width:100%;height:32px;}
.tag-estimado{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--ink-3);background:#F0F0F3;border-radius:4px;padding:2px 6px;
}
.alert-icon{color:var(--red);font-size:15px;}

/* pills */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap;
}
.pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pill.pos{background:var(--green-bg);color:var(--green);}
.pill.pos .dot{background:var(--green);}
.pill.neu{background:#F0F0F3;color:var(--ink-2);}
.pill.neu .dot{background:var(--neutral);}
.pill.neg{background:var(--red-bg);color:var(--red);}
.pill.neg .dot{background:var(--red);}
.pill.crit{background:var(--red-bg);color:var(--red);font-weight:600;}
.pill.warn{background:var(--amber-bg);color:var(--amber);font-weight:600;}
.pill.purple{background:var(--purple-soft);color:var(--purple);}
.pill.blue{background:var(--blue-bg);color:var(--blue);}
.pill.sm{font-size:11px;padding:2px 8px;}

/* live */
.live-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:var(--green);text-transform:uppercase;letter-spacing:0.05em;
}
.live-badge .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative;}
.live-badge .pulse-dot::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--green);opacity:0;
  animation:pulse-ring 2s cubic-bezier(0.4,0,0.2,1) infinite;
}
@keyframes pulse-ring{0%{transform:scale(0.5);opacity:0.8;}100%{transform:scale(1.4);opacity:0;}}
.chart-pulse{transform-origin:center;transform-box:fill-box;animation:pulse-svg 2s cubic-bezier(0.4,0,0.2,1) infinite;}
@keyframes pulse-svg{0%{opacity:0.6;transform:scale(0.6);}100%{opacity:0;transform:scale(2.4);}}
@media (prefers-reduced-motion: reduce){
  .live-badge .pulse-dot::after,.chart-pulse{animation:none !important;}
}
.axis-label{font-size:11px;fill:var(--ink-3);font-family:'Inter',sans-serif;}
@keyframes ins-pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.18);opacity:.7;}}
@keyframes ins-step{to{opacity:1;}}
@keyframes ins-bar{from{width:0;}to{width:100%;}}
.grid-line{stroke:#F0F0F3;stroke-width:1;}

/* chart tooltip */
.chart-tooltip{
  position:absolute;background:#1A1A2E;color:#fff;border-radius:8px;padding:10px 12px;
  font-size:12px;pointer-events:none;z-index:30;min-width:130px;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
}
.chart-tooltip .tt-date{font-weight:600;margin-bottom:6px;}
.chart-tooltip .tt-row{display:flex;align-items:center;gap:6px;margin-top:3px;}
.chart-tooltip .tt-row .dot{width:7px;height:7px;border-radius:50%;}
.chart-tooltip .tt-row .v{margin-left:auto;font-weight:600;}

/* ratio bar */
.ratio-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-top:18px;position:relative;}
.ratio-seg{display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600;color:#fff;}
.ratio-seg.exec{background:var(--purple);}
.ratio-seg.cli{background:#C7BBE3;color:var(--purple);justify-content:flex-end;}
.ratio-marker{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink-2);}
.ratio-marker-label{font-size:11px;color:var(--ink-2);font-weight:500;padding-top:12px;white-space:nowrap;}

/* compliance / moments list */
.comp-list{display:flex;flex-direction:column;flex:1;margin:0 -12px;}
.comp-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;
  border:none;background:transparent;text-align:left;transition:background .12s;width:100%;
}
.comp-row:hover{background:var(--purple-tint);}
.comp-row + .comp-row{border-top:1px solid #F0F0F3;}
.comp-name{font-size:13px;font-weight:500;color:var(--ink);line-height:1.35;flex:1;min-width:0;}
.comp-count{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;}
.comp-trend{font-size:13px;width:16px;text-align:center;}
.comp-trend.up{color:var(--red);}
.comp-trend.down{color:var(--green);}
.comp-trend.flat{color:var(--ink-3);}

/* leaderboard */
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.lb-row + .lb-row{border-top:1px solid #F0F0F3;}
.lb-rank{font-size:12px;font-weight:600;color:var(--ink-3);width:18px;}
.lb-name{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-bar-track{width:90px;height:6px;border-radius:3px;background:#F0F0F3;flex-shrink:0;}
.lb-bar{height:6px;border-radius:3px;background:var(--purple);}
.lb-score{font-size:13px;font-weight:600;width:28px;text-align:right;}
.lb-row.top .lb-rank{color:var(--green);}
.lb-row.low .lb-rank{color:var(--amber);}

/* mini h-bars */
.hbar-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.hbar-label{font-size:12px;color:var(--ink-2);width:110px;flex-shrink:0;}
.hbar-track{flex:1;height:10px;border-radius:5px;background:#F0F0F3;}
.hbar{height:10px;border-radius:5px;background:var(--purple);}
.hbar-val{font-size:13px;font-weight:600;width:20px;text-align:right;}

/* locked state */
.card.locked .locked-blur{opacity:0.25;filter:grayscale(1);pointer-events:none;user-select:none;}
.locked-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:20px;text-align:center;z-index:5;
}
.locked-overlay .lock-circle{
  width:38px;height:38px;border-radius:50%;background:#F0F0F3;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.locked-overlay p{font-size:13px;color:var(--ink-2);font-weight:500;max-width:220px;line-height:1.45;}
.btn-secondary{
  padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;
  font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .12s;
}
.btn-secondary:hover{border-color:#C9C9D4;}
.btn-primary{
  padding:9px 16px;border-radius:8px;border:none;background:var(--purple);
  font-size:13px;font-weight:600;color:#fff;cursor:pointer;transition:background .12s;
}
.btn-primary:hover{background:var(--purple-600);}
.btn-primary:active,.btn-secondary:active{transform:translateY(1px);}

/* day-1 banner */
.banner-info{
  display:flex;align-items:center;gap:10px;background:var(--purple-tint);
  border:1px solid #DDD2F0;border-radius:10px;padding:12px 16px;margin-bottom:16px;
  font-size:13px;color:var(--purple-600);font-weight:500;
}
.banner-info i{font-size:17px;color:var(--purple);}

/* AI pill + popover próximamente */
.ai-fab-wrap{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.ai-fab{
  display:flex;align-items:center;gap:8px;
  padding:12px 18px;border-radius:999px;border:none;cursor:pointer;
  background:var(--purple);color:#fff;font-size:14px;font-weight:600;
  box-shadow:0 8px 24px rgba(75,45,143,0.35);transition:background .12s,transform .15s;
}
.ai-fab:hover{background:var(--purple-600);transform:translateY(-2px);}
.ai-fab i{font-size:17px;}
.ai-pop{
  width:290px;background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:16px;box-shadow:0 14px 40px rgba(26,26,46,0.18);
}
.ai-pop-head{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;margin-bottom:8px;}
.ai-pop-head i{color:var(--purple);font-size:16px;}
.ai-pop p{font-size:13px;line-height:1.55;color:var(--ink-2);margin-bottom:14px;}

/* ══ Screen 2: table ══ */
.search-bar{
  display:flex;align-items:center;gap:8px;flex:1;min-width:260px;max-width:420px;
  background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 14px;
}
.search-bar input{border:none;outline:none;font-family:inherit;font-size:13px;width:100%;background:transparent;}
.search-bar i{color:var(--ink-3);}
.review-strip{margin-bottom:16px;}
.review-strip .strip-title{
  font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);
  font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.review-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.review-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:box-shadow .15s;
}
.review-card:hover{box-shadow:0 4px 14px rgba(26,26,46,0.08);}
.review-card.crit{border-left:3px solid var(--red);}
.review-card.warn{border-left:3px solid var(--amber);}
.review-card .rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.review-card .rc-reason{font-size:13px;font-weight:600;}
.review-card .rc-meta{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;}

table.data{width:100%;border-collapse:collapse;}
table.data th{
  font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);
  font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;white-space:nowrap;
}
table.data th:hover{color:var(--ink-2);}
table.data th .sort{font-size:10px;margin-left:3px;}
table.data td{
  padding:11px 12px;font-size:13px;border-bottom:1px solid #F0F0F3;vertical-align:middle;white-space:nowrap;
}
table.data tbody tr{cursor:pointer;transition:background .1s;}
table.data tbody tr:hover{background:var(--purple-tint);}
.chip-gray{
  display:inline-block;font-size:12px;color:var(--ink-2);background:#F0F0F3;
  border-radius:6px;padding:3px 8px;font-weight:500;
}
.alert-badges{display:flex;gap:4px;}
.alert-badge{
  width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;
}
.alert-badge.crit{background:var(--red-bg);color:var(--red);}
.alert-badge.warn{background:var(--amber-bg);color:var(--amber);}
.link-btn{
  background:none;border:none;color:var(--purple);font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px;
}
.link-btn:hover{background:var(--purple-soft);}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 0;font-size:13px;color:var(--ink-3);}
.pag-btns{display:flex;gap:4px;}
.pag-btn{
  min-width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;
  font-size:13px;color:var(--ink-2);cursor:pointer;padding:0 8px;
}
.pag-btn:hover{border-color:#C9C9D4;}
.pag-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600;}
.pag-btn:disabled{opacity:0.4;cursor:default;}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;gap:12px;text-align:center;
}
.empty-state .es-circle{
  width:64px;height:64px;border-radius:50%;background:var(--purple-tint);color:var(--purple);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.empty-state p{font-size:14px;color:var(--ink-2);font-weight:500;}

/* ══ Screen 3: detail ══ */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);padding:18px 0 8px;}
.breadcrumb a{font-weight:500;}
.detail-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:16px;}
.detail-header h1{font-size:19px;font-weight:600;letter-spacing:-0.3px;margin-right:4px;}
.meta-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  color:var(--ink-2);background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 10px;
}
.detail-layout{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start;}

/* transcript */
.transcript-card{padding:0;overflow:hidden;}
.player{padding:16px 20px;border-bottom:1px solid var(--border);}
.player-top{display:flex;align-items:center;gap:12px;}
.play-btn{
  width:40px;height:40px;border-radius:50%;border:none;background:var(--purple);color:#fff;
  font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.play-btn:hover{background:var(--purple-600);}
.waveform{flex:1;height:40px;position:relative;cursor:pointer;}
.player-time{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex-shrink:0;}
.sent-strip{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;}
.sent-seg{cursor:pointer;transition:opacity .12s;}
.sent-seg:hover{opacity:0.75;}
.sent-strip-label{font-size:11px;color:var(--ink-3);margin-top:6px;}

.tx-search{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);background:#FCFCFD;}
.tx-search .search-bar{max-width:none;border-radius:8px;padding:6px 10px;}
.tx-search .match-count{font-size:12px;color:var(--ink-3);white-space:nowrap;}
.tx-nav-btn{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fff;
  color:var(--ink-2);cursor:pointer;font-size:12px;
}
.tx-nav-btn:hover{border-color:#C9C9D4;}
.tx-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-height:560px;overflow-y:auto;}
.bubble-row{display:flex;gap:10px;align-items:flex-end;}
.bubble-row.client{flex-direction:row-reverse;}
.bubble{
  max-width:78%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.55;color:var(--ink);
}
.bubble-row.exec .bubble{background:var(--purple-tint);border:1px solid #E4DBF4;border-bottom-left-radius:4px;}
.bubble-row.client .bubble{background:#F5F5F7;border:1px solid #ECECEF;border-bottom-right-radius:4px;}
.bubble .b-meta{font-size:11px;color:var(--ink-3);margin-bottom:3px;font-weight:600;display:flex;gap:6px;align-items:center;}
.hl-search{background:#FDE68A;border-radius:2px;}
.hl-search.current{background:#F59E0B;color:#fff;}

/* highlights accesibles: color + ícono + subrayado propio + borde izq */
.hl{
  position:relative;border-radius:3px;padding:1px 4px 1px 3px;cursor:pointer;
  border-left:3px solid;text-decoration-line:underline;text-underline-offset:3px;
}
.hl:focus-visible{outline:2px solid currentColor;outline-offset:2px;}
.hl .hl-ic{font-size:11px;margin-right:3px;}
.hl .hl-label{
  display:none;position:absolute;bottom:calc(100% + 4px);left:0;z-index:25;
  background:#1A1A2E;color:#fff;font-size:10px;font-weight:600;letter-spacing:0.03em;
  text-transform:uppercase;border-radius:4px;padding:2px 7px;white-space:nowrap;text-decoration:none;
}
.hl:hover .hl-label,.hl:focus .hl-label{display:inline-block;}
.hl-kw{background:var(--purple-soft);color:var(--purple);border-left-color:var(--purple);text-decoration-style:solid;text-decoration-thickness:1.5px;}
.hl-obj{background:var(--amber-bg);color:#92400E;border-left-color:#92400E;text-decoration-style:dotted;text-decoration-thickness:2px;}
.hl-commit{background:var(--blue-bg);color:var(--blue);border-left-color:var(--blue);text-decoration-style:double;}
.hl-esc{background:var(--red-bg);color:var(--red);border-left-color:var(--red);text-decoration-style:solid;text-decoration-thickness:3px;}

/* right analysis panel */
.analysis-panel{display:flex;flex-direction:column;gap:16px;position:relative;}
.analysis-scroll{display:flex;flex-direction:column;gap:16px;max-height:640px;overflow-y:auto;padding-bottom:4px;}
.card.ai-card{background:var(--purple-tint);border-color:#DDD2F0;}
.ai-card .card-label{color:var(--purple);}
.ai-card p{font-size:13px;line-height:1.6;color:var(--ink);margin-top:8px;}
.ai-card ul{margin:8px 0 0 16px;font-size:13px;color:var(--ink-2);line-height:1.6;}
.metric-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.metric-row + .metric-row{border-top:1px solid #F0F0F3;}
.metric-row .mr-label{font-size:13px;color:var(--ink-2);flex:1;display:flex;align-items:center;gap:5px;}
.metric-row .mr-bar-track{width:80px;height:6px;border-radius:3px;background:#F0F0F3;flex-shrink:0;}
.metric-row .mr-bar{height:6px;border-radius:3px;}
.metric-row .mr-val{font-size:13px;font-weight:600;width:70px;text-align:right;white-space:nowrap;}
.info-icon{color:var(--ink-3);font-size:14px;cursor:help;position:relative;}
.tooltip-box{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#1A1A2E;color:#fff;font-size:12px;line-height:1.5;border-radius:8px;
  padding:8px 10px;width:210px;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,0.2);font-weight:400;
}

/* checklist */
.check-row{
  display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:8px;cursor:pointer;
  border:none;background:transparent;width:100%;text-align:left;transition:background .1s;
}
.check-row:hover{background:var(--purple-tint);}
.check-row.fail{background:var(--red-bg);}
.check-row.fail:hover{background:#F7DBDB;}
.check-ic{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.check-ic.ok{background:var(--green-bg);color:var(--green);}
.check-ic.no{background:var(--red);color:#fff;}
.check-label{font-size:13px;flex:1;color:var(--ink);}
.check-row.fail .check-label{color:var(--red);font-weight:500;}
.check-ts{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

/* detection chips */
.det-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.det-chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:box-shadow .12s;
}
.det-chip:hover{box-shadow:0 2px 8px rgba(26,26,46,0.10);}
.det-chip.blue{background:var(--blue-bg);color:var(--blue);}
.det-chip.amber{background:var(--amber-bg);color:var(--amber);}
.det-chip.gray{background:#F0F0F3;color:var(--ink-3);}
.det-chip.purple{background:var(--purple-soft);color:var(--purple);}
.det-chip.selected{border-color:currentColor;}

/* sticky footer */
.panel-footer{
  position:sticky;bottom:0;background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 -4px 16px rgba(26,26,46,0.05);
  flex-wrap:wrap;z-index:10;
}
.panel-footer .flink{margin-left:auto;font-size:13px;font-weight:500;}

/* popover / modal / toast */
.popover{
  position:absolute;bottom:calc(100% + 8px);right:0;width:250px;background:#fff;
  border:1px solid var(--border);border-radius:10px;padding:14px;z-index:45;
  box-shadow:0 10px 30px rgba(26,26,46,0.15);
}
.popover p{font-size:13px;color:var(--ink);line-height:1.5;margin-bottom:12px;}
.popover .pop-actions{display:flex;gap:8px;justify-content:flex-end;}
.notified{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green);}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(26,26,46,0.45);z-index:80;
  display:flex;align-items:center;justify-content:center;
}
.modal{
  width:400px;max-width:calc(100vw - 40px);background:#fff;border-radius:14px;padding:22px;
  box-shadow:0 24px 60px rgba(0,0,0,0.25);
}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px;}
.modal .m-sub{font-size:13px;color:var(--ink-3);margin-bottom:16px;}
.modal label{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin:12px 0 5px;}
.modal select,.modal textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;
  font-family:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff;
}
.modal select:focus,.modal textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(75,45,143,0.12);}
.modal textarea{resize:vertical;min-height:70px;}
.modal .m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;
  background:#1A1A2E;color:#fff;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,0.25);
  animation:toast-in .25s cubic-bezier(0.4,0,0.2,1);
}
.toast i{color:#4ADE80;font-size:16px;}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

/* ══ Screen 4: profile ══ */
.profile-header{display:flex;align-items:center;gap:14px;padding:18px 0 4px;flex-wrap:wrap;}
.profile-header .ph-info h1{font-size:19px;font-weight:600;letter-spacing:-0.3px;}
.profile-header .ph-info p{font-size:13px;color:var(--ink-3);margin-top:2px;}
.profile-header .chip{margin-left:auto;}
.emp-bar-track{height:8px;border-radius:4px;background:#F0F0F3;margin-top:16px;}
.emp-bar{height:8px;border-radius:4px;background:var(--amber);}
.mini-row{display:flex;align-items:center;gap:10px;padding:10px 0;}
.mini-row + .mini-row{border-top:1px solid #F0F0F3;}
.mini-row .mr-date{font-size:12px;color:var(--ink-3);width:56px;flex-shrink:0;}
.mini-row .mr-motivo{flex:1;min-width:0;}
.mini-row .mr-score{font-size:13px;font-weight:600;width:34px;text-align:right;}
.coaching-note{
  font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-top:14px;
}

/* segmented toggle (dentro de card) */
.seg{display:inline-flex;background:#F0F0F3;border-radius:8px;padding:2px;gap:2px;}
.seg-btn{
  border:none;background:transparent;font-size:12px;font-weight:600;color:var(--ink-3);
  padding:4px 10px;border-radius:6px;cursor:pointer;transition:background .12s,color .12s;
}
.seg-btn:hover{color:var(--ink-2);}
.seg-btn.on{background:#fff;color:var(--purple);box-shadow:0 1px 2px rgba(26,26,46,0.1);}

/* sentimiento fusionado */
.sent-merged{display:flex;gap:24px;flex:1;min-height:0;}
.sent-aggregate{
  width:190px;flex-shrink:0;border-left:1px solid #F0F0F3;padding-left:20px;
  display:flex;flex-direction:column;
}

/* nube de palabras */
.nube{
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:center;
  padding:14px 4px;flex:1;align-content:center;
}
.nube-word{color:var(--purple);font-weight:600;cursor:default;line-height:1.3;white-space:nowrap;}
.nube-word:hover{text-decoration:underline;}

/* insights por temas (cards narrativas) */
.insights-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.insights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.insight-card{
  background:#FCFCFD;border:1px solid var(--border);border-radius:12px;
  padding:20px 22px;display:flex;flex-direction:column;
}
.ic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.ic-title{font-size:14px;font-weight:600;color:var(--ink);}
.ic-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);margin-top:5px;}
.ic-headline{font-size:14px;font-weight:700;color:var(--ink);margin-top:12px;line-height:1.4;}
.ic-prosa{
  font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.ic-prosa.open{-webkit-line-clamp:unset;display:block;}
.ic-more{
  align-self:flex-start;background:none;border:none;color:var(--purple);font-size:12px;
  font-weight:600;cursor:pointer;padding:3px 0;margin-top:2px;
}
.ic-more:hover{text-decoration:underline;}
.ic-recos{
  margin-top:12px;padding-top:12px;border-top:1px solid #F0F0F3;
}
.ic-recos-title{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);margin-bottom:7px;
}
.ic-recos-title i{color:var(--amber);font-size:13px;}
.ic-reco{font-size:12.5px;color:var(--ink);line-height:1.5;padding:3px 0;}
.ic-ev{color:var(--ink-3);}
.ic-drill{
  margin-top:auto;padding-top:14px;align-self:flex-start;
  background:none;border:none;color:var(--purple);font-size:13px;font-weight:600;cursor:pointer;
}
.ic-drill:hover{text-decoration:underline;}
.topic-quote{
  font-size:13px;color:var(--ink-2);line-height:1.55;font-style:italic;
  border-left:3px solid var(--purple-soft);padding-left:12px;margin:0;
}

/* active filters bar */
.active-filters{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:0 0 14px;
}
.af-label{font-size:12px;color:var(--ink-3);font-weight:600;}
.af-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:500;color:var(--purple);
  background:var(--purple-soft);border-radius:999px;padding:4px 6px 4px 12px;
}
.af-x{
  width:18px;height:18px;border-radius:50%;border:none;background:transparent;
  color:var(--purple);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;
}
.af-x:hover{background:rgba(75,45,143,0.15);}
.af-clear{
  background:none;border:none;color:var(--ink-2);font-size:12px;font-weight:600;
  cursor:pointer;padding:4px 8px;border-radius:6px;
}
.af-clear:hover{background:#F0F0F3;}

/* setup banner */
.setup-banner{
  background:#fff;border:1px solid #DDD2F0;border-radius:12px;
  padding:16px 20px;margin-bottom:16px;
}
.setup-banner .sb-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.setup-banner .sb-title{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);
}
.setup-banner .sb-title i{color:var(--purple);font-size:16px;}
.setup-banner .sb-sub{font-size:12px;color:var(--ink-3);margin-top:4px;}
.sb-progress-label{font-size:12px;font-weight:600;color:var(--purple);white-space:nowrap;}
.sb-progress{height:6px;border-radius:3px;background:#F0F0F3;margin:12px 0;}
.sb-progress-fill{height:6px;border-radius:3px;background:var(--purple);}
.sb-steps{display:flex;gap:20px;flex-wrap:wrap;}
.sb-step{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);}
.sb-step.done{color:var(--ink);}
.sb-step a{font-size:12px;font-weight:600;}

/* histogram (leaderboard apagado) */
.histo{display:flex;align-items:flex-end;gap:8px;height:120px;flex:1;padding-top:8px;}
.histo-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;}
.histo-n{font-size:11px;font-weight:600;color:var(--ink-2);}
.histo-bar{width:100%;max-width:34px;border-radius:4px 4px 0 0;}
.histo-range{font-size:10px;color:var(--ink-3);white-space:nowrap;}

/* insufficient data + phrases */
.insuf-state{display:flex;gap:12px;align-items:flex-start;margin-top:12px;}
.insuf-state .es-circle{background:var(--purple-tint);color:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.phrases-toggle{
  margin-top:12px;background:none;border:none;color:var(--purple);font-size:13px;font-weight:600;
  cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:5px;text-align:left;
}
.phrases-toggle:hover{text-decoration:underline;}
.phrases-list{margin-top:6px;display:flex;flex-direction:column;}
.phrase-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;}
.phrase-row + .phrase-row{border-top:1px solid #F0F0F3;}
.phrase-text{flex:1;min-width:0;}
.phrase-ts{font-size:12px;font-weight:600;white-space:nowrap;}

/* ── Drawer (detalle de interacción) ── */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(26,26,46,0.45);z-index:70;
  display:flex;justify-content:flex-end;
  animation:fade-in .18s ease;
}
@keyframes fade-in{from{opacity:0;}to{opacity:1;}}
.drawer{
  width:min(94vw,880px);height:100%;background:var(--bg);
  box-shadow:-16px 0 48px rgba(26,26,46,0.25);
  overflow-y:auto;padding:0 24px 24px;
  animation:drawer-in .28s cubic-bezier(0.4,0,0.2,1);
}
@keyframes drawer-in{from{transform:translateX(40px);opacity:0.4;}to{transform:translateX(0);opacity:1;}}
@media (prefers-reduced-motion: reduce){.drawer,.drawer-backdrop{animation:none !important;}}
.drawer-head{
  position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px;
}
.drawer-close{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;
  color:var(--ink-2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.drawer-close:hover{border-color:#C9C9D4;background:#FCFCFD;}
.detail-layout.in-drawer{grid-template-columns:1fr;}
.detail-layout.in-drawer .tx-body{max-height:420px;}
.detail-layout.in-drawer .analysis-scroll{max-height:none;overflow:visible;}

/* ── Responsive ── */
@media (max-width:1150px){
  .insights-grid{grid-template-columns:repeat(2,1fr);}
  .span-3{grid-column:span 6;}
  .span-4{grid-column:span 12;}
  .span-8{grid-column:span 12;}
  .detail-layout{grid-template-columns:1fr;}
  .review-cards{grid-template-columns:1fr;}
}
@media (max-width:760px){
  .main{margin-left:0;padding:0 14px 90px;}
  .sidebar{
    top:auto;bottom:0;left:0;right:0;width:auto;height:56px;
    flex-direction:row;justify-content:center;padding:0 8px;gap:2px;
    border-right:none;border-top:1px solid var(--border);
  }
  .sidebar .logo{display:none;}
  .sidebar .spacer{display:none;}
  .sidebar .avatar{display:none;}
  .main{padding-bottom:150px;}
  .span-3,.span-4,.span-6,.span-8{grid-column:span 12;}
  .page-title{font-size:18px;}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab{white-space:nowrap;padding:10px 12px;}
  .filter-row{overflow-x:auto;flex-wrap:nowrap;padding-bottom:12px;-webkit-overflow-scrolling:touch;}
  .filter-row .chip{white-space:nowrap;flex-shrink:0;}
  .search-bar{min-width:200px;}
  .metric-value{font-size:30px;}
  .drawer{width:100vw;padding:0 14px 14px;}
  .ai-fab-wrap{right:14px;bottom:70px;}
  .ai-fab{padding:10px 14px;font-size:13px;}
  .sent-merged{flex-direction:column;gap:16px;}
  .sent-aggregate{width:auto;border-left:none;padding-left:0;border-top:1px solid #F0F0F3;padding-top:14px;}
  .insights-grid{grid-template-columns:1fr;}
  .bubble{max-width:88%;}
  .detail-header h1{font-size:17px;}
  .panel-footer{flex-wrap:wrap;}
  .panel-footer .flink{margin-left:0;width:100%;}
  .modal{width:100%;}
  .chart-wrap{min-height:180px;}
}


/* Refinamiento de UI + accesibilidad (se aplica sobre las reglas de arriba) */
:root{
  --ink-3:#6B6B7C; /* antes #8A8A99 — contraste 4.6:1 sobre blanco */
  --shadow-card:0 1px 2px rgba(18,18,23,0.05);
  --shadow-pop:0 10px 30px rgba(26,26,46,0.14);
}

/* foco visible consistente en todo elemento interactivo */
:where(button,a,input,select,[tabindex]):focus-visible{
  outline:2px solid var(--purple);outline-offset:2px;border-radius:6px;
}
.chip:focus-visible,.btn-primary:focus-visible,.btn-secondary:focus-visible{outline-offset:3px;}

/* skip link */
.skip-link{
  position:fixed;top:-48px;left:16px;z-index:100;background:var(--purple);color:#fff;
  padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:top .15s;
}
.skip-link:focus{top:12px;color:#fff;text-decoration:none;}

/* cards: elevación sutil y consistente */
.card{box-shadow:var(--shadow-card);}
.card .card-head{gap:12px;}
.card-label{color:var(--ink-3);}

/* KPIs: respiro entre cards y dentro de la card */
.grid{gap:14px;}.grid > .span-3 > .card, .grid > .span-4 > .card, .grid > .span-6 > .card, .grid > .span-8 > .card, .grid > .span-12 > .card{flex:1 1 auto;width:100%;}
.span-3 .card,.card.primary-card,.card.alert-card{padding:22px 26px;}
.metric-value{font-size:38px;letter-spacing:-1px;}
.metric-value-row{margin-top:12px;align-items:center;gap:12px;}
.trend{font-variant-numeric:tabular-nums;}
.card-label{gap:7px;line-height:1.4;}

/* tabs: hit area y estado activo más claro */
.tab{padding:11px 16px;min-height:44px;}
.tab:focus-visible{outline-offset:-2px;}

/* chips y dropdowns */
.chip{min-height:36px;}
.dropdown{box-shadow:var(--shadow-pop);}
.dd-opt{min-height:36px;}

/* filas clickeables: affordance */
.comp-row{min-height:44px;border-radius:8px;}
.comp-row:focus-visible{outline-offset:-2px;}
.comp-row .comp-name{font-weight:500;}

/* leaderboard: números tabulares */
.lb-score,.comp-count,.hbar-val{font-variant-numeric:tabular-nums;}

/* sidebar: área táctil y separación del activo */
.nav-item{width:44px;height:44px;}
.nav-item.active{box-shadow:inset 3px 0 0 var(--purple);}

/* heatmap: celdas con borde hairline para no depender solo del color */
.hm-cell{border:1px solid rgba(26,26,46,0.06);}
.hm-cell:focus-visible{outline:2px solid var(--purple);outline-offset:1px;z-index:2;position:relative;}

/* jerarquía de página */
.page-title{font-size:21px;}
.topbar{padding-top:24px;}

/* estados hover más silenciosos y consistentes */
.card.hoverable:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,26,46,0.08);}
.hbar-row.drill,.comp-row.drill,.lb-row.drill{cursor:pointer;border-radius:6px;transition:background .12s;}
.hbar-row.drill:hover,.comp-row.drill:hover,.lb-row.drill:hover{background:var(--purple-tint);}

/* ── Apto daltonismo: los estados nunca dependen solo del color ── */
/* pills de sentimiento: forma del dot distinta por estado */
.pill.pos .dot{border-radius:50%;}
.pill.neu .dot{border-radius:2px;}
.pill.neg .dot{border-radius:0;transform:rotate(45deg);}
/* trends: siempre ícono + texto (ya presente); refuerzo de peso */
.trend i{font-size:11px;}
/* alerta de KPI: borde + ícono, no solo color */
.card.alert-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:0.01ms !important;animation-duration:0.01ms !important;}
}


/* ══════════════════════════════════════════════════════════════════════
   Componentes propios de este tablero (identificación del cliente,
   informe del período, panel de demostración). Se escriben con los
   tokens del sistema original: no se introduce ningún color nuevo.
   ══════════════════════════════════════════════════════════════════════ */

/* el sidebar es fijo: el contenido arranca después de sus 56px */
.main{margin-left:56px;}
.sidebar .logo{padding:0;}
.sidebar .logo svg{display:block;width:20px;height:20px;}

/* identificación del cliente en la barra superior */
.tenant-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--purple-tint);border:1px solid #E4DBF4;color:var(--purple);
  border-radius:999px;padding:5px 12px 5px 6px;font-size:12px;font-weight:600;white-space:nowrap;
}
.tenant-chip .tc-dot{
  width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #E4DBF4;
  display:flex;align-items:center;justify-content:center;
}
.tenant-chip .tc-dot svg{display:block;}

/* pills adicionales */
.pill.brand{background:var(--purple-soft);color:var(--purple);}
.btn-brand{
  padding:9px 16px;border-radius:8px;border:none;background:var(--purple);
  font-size:13px;font-weight:600;color:#fff;cursor:pointer;transition:background .12s;
}
.btn-brand:hover{background:var(--purple-600);}

/* informe del período */
.report-sheet{background:#fff;padding:0 0 40px;}
.report-hero{background:var(--purple);color:#fff;padding:28px 36px;}
.report-hero .rh-kicker{font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.8;font-weight:600;}
.report-hero h2{font-size:27px;font-weight:600;letter-spacing:-0.4px;margin-top:6px;line-height:1.2;}
.report-hero p{font-size:13.5px;line-height:1.65;margin-top:10px;max-width:760px;opacity:0.94;}
.report-body{padding:26px 36px 0;display:flex;flex-direction:column;gap:24px;}
.report-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.report-kpi{border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:10px;padding:14px 16px;}
.report-kpi .rk-v{font-size:27px;font-weight:600;letter-spacing:-0.6px;line-height:1;}
.report-kpi .rk-l{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-top:6px;}
.report-h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;}
.report-h3 i{color:var(--purple);font-size:17px;}
.report-list{display:flex;flex-direction:column;gap:10px;}
.report-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.report-item .ri-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.report-item .ri-name{font-size:14px;font-weight:600;}
.report-item p{font-size:13px;color:var(--ink-2);line-height:1.6;}
.report-action{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:10px;padding:12px 14px;}
.report-action .ra-n{font-size:16px;font-weight:600;color:var(--purple);width:22px;flex-shrink:0;}
table.export-preview th{background:#F0F0F3;font-weight:600;color:var(--ink-2);}

/* panel de estados para la demostración */
.demo-panel{
  position:fixed;right:24px;bottom:88px;z-index:65;width:290px;background:#fff;
  border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow-pop);
}
.demo-panel h4{font-size:14px;font-weight:600;margin-bottom:2px;}
.demo-panel .dp-sub{font-size:11.5px;color:var(--ink-3);margin-bottom:12px;line-height:1.45;}
.dp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:12.5px;color:var(--ink-2);}
.dp-row + .dp-row{border-top:1px solid #F0F0F3;}
.dp-row select{border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:12px;background:#fff;color:var(--ink);}
.switch{width:38px;height:22px;border-radius:999px;border:none;background:#DCDCE3;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;}
.switch.on{background:var(--purple);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;}
.switch.on::after{transform:translateX(16px);}

@media (max-width:760px){
  .main{margin-left:0;}
  .demo-panel{right:14px;bottom:136px;width:calc(100vw - 28px);}
  .report-hero,.report-body{padding-left:18px;padding-right:18px;}
  .report-hero h2{font-size:22px;}
}

/* El informe del período se imprime solo: el resto del tablero se oculta */
@media print{
  .sidebar,.main,.ai-fab-wrap,.demo-panel,.drawer-backdrop,.report-toolbar{display:none !important;}
  .modal-backdrop{position:static !important;background:#fff !important;display:block !important;backdrop-filter:none !important;}
  .report-modal{width:100% !important;height:auto !important;max-width:none !important;border-radius:0 !important;box-shadow:none !important;overflow:visible !important;}
  .report-scroll{overflow:visible !important;max-height:none !important;}
  .report-hero{background:var(--purple) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .report-item,.report-action,.report-kpi{break-inside:avoid;}
}

</style>

<body>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
/* ── Shell y primitivos compartidos del tablero de Speech Analytics ── */
const { useState, useEffect, useRef } = React;

/* ── Icons via phosphor <i> ── */
function Ph({ name, fill, style, className }) {
  return <i className={(fill ? "ph-fill ph-" : "ph ph-") + name + (className ? " " + className : "")} style={style}></i>;
}

/* ── Sparkline ── */
function Sparkline({ points, color = "var(--purple)" }) {
  // points: array of 0..1 values
  const w = 220, h = 32, pad = 4;
  const step = w / (points.length - 1);
  const coords = points.map((p, i) => [i * step, pad + (1 - p) * (h - pad * 2)]);
  const line = coords.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
  const area = line + ` L${w},${h} L0,${h} Z`;
  return (
    <div className="metric-spark">
      <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" aria-hidden="true">
        <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"></path>
        <path d={area} fill={color} opacity="0.06"></path>
      </svg>
    </div>
  );
}

/* ── Trend chip ── */
function Trend({ dir, value, tone }) {
  const cls = tone || (dir === "up" ? "up" : dir === "down" ? "down" : "flat");
  const icon = dir === "up" ? "arrow-up" : dir === "down" ? "arrow-down" : "minus";
  return (
    <span className={"trend " + cls}>
      <i className={"ph-bold ph-" + icon}></i>{value}
    </span>
  );
}

/* ── Sentiment pill ── */
function SentPill({ kind, label, count }) {
  const map = { pos: "Positivo", neu: "Neutro", neg: "Negativo" };
  return (
    <span className={"pill " + kind}>
      <span className="dot"></span>{label || map[kind]}{count != null ? <b style={{ fontWeight: 600 }}>{count}</b> : null}
    </span>
  );
}

/* ── Info tooltip (para KPIs y charts) ── */
function InfoDot({ text }) {
  const [show, setShow] = useState(false);
  return (
    <span style={{ position: "relative", display: "inline-flex", marginLeft: 2 }}
      onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
      <button aria-label={"Información: " + text} onFocus={() => setShow(true)} onBlur={() => setShow(false)}
        style={{ border: "none", background: "none", color: "var(--ink-3)", cursor: "help", fontSize: 13, padding: 0, display: "flex" }}>
        <i className="ph ph-info"></i>
      </button>
      {show ? (
        <span role="tooltip" style={{
          position: "absolute", bottom: "calc(100% + 8px)", left: "50%", transform: "translateX(-50%)",
          background: "#1A1A2E", color: "#fff", fontSize: 12, lineHeight: 1.5, borderRadius: 8,
          padding: "8px 10px", width: 220, zIndex: 40, boxShadow: "0 6px 18px rgba(0,0,0,0.2)",
          fontWeight: 400, textTransform: "none", letterSpacing: 0, whiteSpace: "normal", textAlign: "left",
        }}>{text}</span>
      ) : null}
    </span>
  );
}

/* ── Metric card ── */
function MetricCard({ label, tag, alertIcon, value, unit, trend, sub, spark, sparkColor, className, locked, lockedText, onDetail, info }) {
  const body = (
    <React.Fragment>
      <div className="card-label">
        {label}
        {tag ? <span className="tag-estimado">{tag}</span> : null}
        {alertIcon ? <i className="ph-fill ph-warning-circle alert-icon" title="Sobre el umbral definido"></i> : null}
        {info ? <InfoDot text={info} /> : null}
      </div>
      <div className="metric-value-row">
        <span className="metric-value">{value}{unit ? <span className="metric-unit">{unit}</span> : null}</span>
        {trend}
      </div>
      {sub ? <div className="card-sub">{sub}</div> : null}
      {spark ? <Sparkline points={spark} color={sparkColor} /> : null}
    </React.Fragment>
  );
  if (locked) {
    return (
      <section className={"card locked " + (className || "")}>
        <div className="locked-blur">{body}</div>
        <div className="locked-overlay">
          <div className="lock-circle"><Ph name="lock-simple" /></div>
          <p>{lockedText || "Activá esta métrica cargando tu protocolo"}</p>
          <button className="btn-secondary">Ir a configuración</button>
        </div>
      </section>
    );
  }
  return (
    <section className={"card " + (onDetail ? "hoverable " : "") + (className || "")} onClick={onDetail}>
      {onDetail ? <span className="ver-detalle">Ver detalle →</span> : null}
      {body}
    </section>
  );
}

/* ── Filter chip with dropdown (controlled) ── */
function FilterChip({ icon, label, options, active, single, selected, onApply }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const [checked, setChecked] = useState(() => new Set(selected || []));
  const ref = useRef(null);
  useEffect(() => {
    if (open) setChecked(new Set(selected || []));
  }, [open]);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  const opts = (options || []).filter(o => o.toLowerCase().includes(q.toLowerCase()));
  return (
    <div ref={ref} style={{ position: "relative", display: "inline-flex" }}>
      <button className={"chip" + (open ? " open" : "") + (active ? " active-filter" : "")}
        aria-haspopup="listbox" aria-expanded={open} onClick={() => setOpen(!open)}>
        {icon ? <Ph name={icon} /> : null}{label}<Ph name="caret-down" />
      </button>
      {open && options ? (
        <div className="dropdown">
          <div className="dd-search">
            <Ph name="magnifying-glass" style={{ fontSize: 13, color: "var(--ink-3)" }} />
            <input placeholder="Buscar…" value={q} onChange={e => setQ(e.target.value)} autoFocus />
          </div>
          <div style={{ maxHeight: 180, overflowY: "auto" }}>
            {opts.map(o => (
              <label className="dd-opt" key={o}>
                <input type={single ? "radio" : "checkbox"} name={single ? label : undefined}
                  checked={checked.has(o)} onChange={() => {
                    if (single) { setChecked(new Set([o])); return; }
                    const n = new Set(checked); n.has(o) ? n.delete(o) : n.add(o); setChecked(n);
                  }} />
                {o}
              </label>
            ))}
          </div>
          <button className="dd-apply" onClick={() => { if (onApply) onApply([...checked]); setOpen(false); }}>Aplicar</button>
        </div>
      ) : null}
    </div>
  );
}

const PERIODO_DEFAULT = "Últimos 30 días";
const PERIODO_INFORME = "últimos 30 días";
const SUCURSALES = ["Agencia Centro", "Agencia Norte", "Agencia Sur", "Agencia Oriente", "Agencia Poniente"];
const EJECUTIVOS = ["María González", "Carlos Fuentes", "Ana Riquelme", "Pedro Salas", "Lucía Vergara"];

function FilterRow({ filters, onChange, hideEjecutivos }) {
  const f = filters;
  return (
    <div className="filter-row">
      <FilterChip icon="calendar-blank" single
        label={f.periodo || PERIODO_DEFAULT}
        active={!!f.periodo}
        selected={[f.periodo || PERIODO_DEFAULT]}
        options={["Hoy", "Últimos 7 días", "Últimos 30 días", "Este trimestre", "Personalizado"]}
        onApply={sel => onChange({ ...f, periodo: sel[0] === PERIODO_DEFAULT ? null : sel[0] })} />
      <FilterChip icon="buildings"
        label={f.sucursales.length ? `Agencias (${f.sucursales.length})` : "Todas las agencias"}
        active={f.sucursales.length > 0}
        selected={f.sucursales}
        options={SUCURSALES}
        onApply={sel => onChange({ ...f, sucursales: sel })} />
      {!hideEjecutivos ? <FilterChip icon="user"
        label={f.ejecutivos.length ? `Usuarios (${f.ejecutivos.length})` : "Todos los usuarios"}
        active={f.ejecutivos.length > 0}
        selected={f.ejecutivos}
        options={EJECUTIVOS}
        onApply={sel => onChange({ ...f, ejecutivos: sel })} /> : null}
    </div>
  );
}

/* ── Active filters bar (persistente en las 3 tabs) ── */
function ActiveFiltersBar({ filters, onChange }) {
  const items = [];
  if (filters.periodo) items.push({ key: "periodo", label: "Período: " + filters.periodo, remove: () => onChange({ ...filters, periodo: null }) });
  filters.sucursales.forEach(s => items.push({ key: "s:" + s, label: s, remove: () => onChange({ ...filters, sucursales: filters.sucursales.filter(x => x !== s) }) }));
  filters.ejecutivos.forEach(e => items.push({ key: "e:" + e, label: e, remove: () => onChange({ ...filters, ejecutivos: filters.ejecutivos.filter(x => x !== e) }) }));
  if (filters.interpretable) items.push({ key: "interp", label: filters.interpretable, remove: () => onChange({ ...filters, interpretable: null }) });
  if (filters.keyword) items.push({ key: "kw", label: "Palabra: " + filters.keyword, remove: () => onChange({ ...filters, keyword: null }) });
  if (!items.length) return null;
  return (
    <div className="active-filters" aria-label="Filtros activos">
      <span className="af-label">Filtros activos:</span>
      {items.map(it => (
        <span className="af-chip" key={it.key}>
          {it.label}
          <button className="af-x" aria-label={"Quitar filtro " + it.label} onClick={it.remove}><Ph name="x" /></button>
        </span>
      ))}
      <button className="af-clear" onClick={() => onChange({ periodo: null, sucursales: [], ejecutivos: [], interpretable: null, keyword: null })}>Limpiar todo</button>
    </div>
  );
}

/* ── Marca del producto: barras de analítica, sin nombre de banco ── */
function BrandMark({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" role="img" aria-label="Speech Analytics">
      <g fill="currentColor">
        <rect x="4" y="13" width="4" height="6" rx="2"></rect>
        <rect x="10.5" y="8" width="4" height="16" rx="2"></rect>
        <rect x="17" y="4" width="4" height="24" rx="2"></rect>
        <rect x="23.5" y="11" width="4" height="10" rx="2"></rect>
      </g>
    </svg>
  );
}

/* ── Sidebar ── */
function Sidebar() {
  return (
    <nav className="sidebar" aria-label="Navegación principal">
      <div className="logo"><BrandMark /></div>
      <button className="nav-item" title="Inicio" aria-label="Inicio"><Ph name="house" /></button>
      <button className="nav-item" title="Monitoreo" aria-label="Monitoreo"><Ph name="monitor" /></button>
      <button className="nav-item active" title="Speech Analytics" aria-label="Speech Analytics" aria-current="page"><Ph name="waveform" fill /></button>
      <button className="nav-item" title="Conversaciones" aria-label="Conversaciones"><Ph name="chats-circle" /></button>
      <button className="nav-item" title="Mi reporte" aria-label="Mi reporte" onClick={() => { window.location.href = "mireporte.html"; }}><Ph name="chart-bar" /></button>
      <button className="nav-item" title="Alertas" aria-label="Alertas"><Ph name="bell" /></button>
      <div className="spacer"></div>
      <button className="nav-item" title="Configuración" aria-label="Configuración"><Ph name="gear" /></button>
      <div className="avatar">MG</div>
    </nav>
  );
}

/* ── Tabs ── */
function Tabs({ tab, onTab }) {
  const tabs = ["Resumen", "Comercial", "Caja", "Interacciones", "Consentimiento", "Performance de usuarios", "Agencias", "Reportes"];
  return (
    <div className="tabs" role="tablist">
      {tabs.map(t => (
        <button key={t} role="tab" aria-selected={tab === t} className={"tab" + (tab === t ? " active" : "")} onClick={() => onTab(t)}>{t}</button>
      ))}
    </div>
  );
}

/* ── Asistente de analítica (próximamente) ── */
function AiFab() {
  const [open, setOpen] = useState(false);
  const [notified, setNotified] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  return (
    <div ref={ref} className="ai-fab-wrap">
      {open ? (
        <div className="ai-pop" role="dialog" aria-label="Asistente de analítica próximamente">
          <div className="ai-pop-head">
            <Ph name="sparkle" fill /> Asistente de analítica <span className="pill sm purple">próximamente</span>
          </div>
          <p>Pronto va a poder preguntar en lenguaje natural sobre las atenciones de la red: “¿Por qué subieron las escalaciones esta semana?”, “¿Qué ejecutivos necesitan coaching en manejo de objeciones?”, “¿Qué agencias incumplen el SLA de caja?”.</p>
          {notified ? (
            <span className="notified"><Ph name="check-circle" fill />Le avisaremos cuando esté disponible</span>
          ) : (
            <button className="btn-primary" style={{ width: "100%" }} onClick={() => setNotified(true)}>Avisarme cuando esté disponible</button>
          )}
        </div>
      ) : null}
      <button className="ai-fab" onClick={() => setOpen(!open)} aria-expanded={open}>
        <Ph name="sparkle" fill /> Preguntar a la analítica
      </button>
    </div>
  );
}

/* ── Export menu (solo UI) ── */
function ExportMenu({ compact, onExport }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  const pick = fmt => { setOpen(false); if (onExport) onExport(fmt); };
  return (
    <div ref={ref} style={{ position: "relative", display: "inline-flex", marginLeft: "auto" }}>
      <button className="chip" onClick={() => setOpen(!open)}>

/* ── Heatmap de frecuencia de atenciones ── */
const HM_SUCURSALES = ["Todas las agencias", "Agencia Centro", "Agencia Norte", "Agencia Sur", "Agencia Oriente", "Agencia Poniente"];
const HM_DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const HM_HORAS = [9, 10, 11, 12, 13, 14, 15, 16, 17];

function hmValue(suc, d, h) {
  // mock determinista: pico media mañana y mediodía, sábado corto, variación por agencia
  const base = Math.exp(-Math.pow(h - 11.2, 2) / 8) * 0.75 + Math.exp(-Math.pow(h - 13.5, 2) / 3) * 0.5;
  const dia = d === 5 ? (h > 13 ? 0 : 0.55) : 1 - Math.abs(d - 1.5) * 0.07;
  const seed = Math.abs(Math.sin((suc + 1) * 3.7 + d * 1.3 + h * 0.9)) * 0.22;
  return Math.max(0, Math.min(1, base * dia + seed));
}

function HeatmapAtenciones() {
  const [sel, setSel] = useStateD([]); // índices de agencias (vacío = todas)
  const [open, setOpen] = useStateD(false);
  const [hover, setHover] = useStateD(null);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  const max = 46;
  const activos = sel.length ? sel : HM_SUCURSALES.map((_, i) => i).slice(1);
  const valor = (d, h) => activos.reduce((s, i) => s + hmValue(i, d, h), 0) / activos.length;
  const label = sel.length === 0 ? "Todas las agencias" : sel.length === 1 ? HM_SUCURSALES[sel[0]] : "Agencias (" + sel.length + ")";
  const toggleSuc = i => setSel(sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i]);
  return (
    <section className="card span-8" data-screen-label="Frecuencia de atenciones">
      <div className="card-head">
        <span className="card-title">Frecuencia de atenciones <InfoDot text="Cantidad promedio de atenciones registradas por día y hora." /></span>
      </div>
      <div role="grid" aria-label={"Frecuencia de atenciones por día y hora — " + label}
        style={{ display: "grid", gridTemplateColumns: "44px repeat(" + HM_HORAS.length + ", 1fr)", gap: 3, alignItems: "center" }}>
        <span></span>
        {HM_HORAS.map(h => <span key={h} style={{ fontSize: 11, color: "var(--ink-3)", textAlign: "center" }}>{h}:00</span>)}
        {HM_DIAS.map((d, di) => (
          <React.Fragment key={d}>
            <span style={{ fontSize: 11.5, color: "var(--ink-2)", fontWeight: 600 }}>{d}</span>
            {HM_HORAS.map(h => {
              const val = valor(di, h);
              const n = Math.round(val * max * (sel.length === 1 ? 1 : activos.length * 0.6));
              return (
                <div key={h} className="hm-cell" tabIndex={0} role="gridcell"
                  aria-label={d + " " + h + ":00 — " + n + " atenciones"}
                  title={d + " " + h + ":00 — " + n + " atenciones"}
                  onMouseEnter={() => setHover(d + h)} onMouseLeave={() => setHover(null)}
                  onFocus={() => setHover(d + h)} onBlur={() => setHover(null)}
                  style={{
                    height: 28, borderRadius: 5, cursor: "default",
                    background: "rgba(75,45,143," + (0.05 + val * 0.85).toFixed(2) + ")",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 10.5, fontWeight: 600, fontVariantNumeric: "tabular-nums",
                    color: val > 0.7 ? "#fff" : hover === d + h ? "var(--ink)" : "transparent",
                  }}>{n}</div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14, fontSize: 11.5, color: "var(--ink-3)" }}>
        <span>Menos</span>
        {[0.08, 0.25, 0.45, 0.65, 0.9].map(o => (
          <span key={o} style={{ width: 18, height: 12, borderRadius: 3, background: "rgba(75,45,143," + o + ")" }}></span>
        ))}
        <span>Más</span>
        <span style={{ marginLeft: "auto" }}>atenciones por hora · últimas 4 semanas</span>
      </div>
    </section>
  );
}

/* ── Nube de palabras clave ── */
function KeywordCloud({ active, onSelect }) {
  const [hover, setHover] = React.useState(null);
  const data = [

function SentimentChart() {
  // Serie diaria en conteos; último tramo proyectado (punteado)
  const days = ["28 oct", "30 oct", "1 nov", "3 nov", "5 nov", "7 nov", "9 nov", "11 nov", "13 nov", "15 nov", "17 nov", "19 nov", "21 nov", "23 nov", "25 nov", "27 nov", "29 nov", "1 dic", "3 dic", "5 dic", "Hoy"];
  const series = [
    { key: "neg", name: "Negativo", color: "#D93D0D", bg: "var(--red-bg)", vals: [15, 19, 21, 19, 21, 20, 22, 16, 19, 18, 16, 19, 21, 23, 25, 27, 28, 26, 25, 27, 26] },
    { key: "pos", name: "Positivo", color: "var(--green)", bg: "var(--green-bg)", vals: [8, 12, 14, 12, 14, 16, 14, 22, 15, 12, 10, 13, 15, 17, 19, 21, 20, 18, 18, 21, 22] },
    { key: "neu", name: "Neutro", color: "#9CA3AF", bg: "#F0F0F3", vals: [4, 2, 3, 3, 3, 2, 6, 4, 2, 5, 6, 6, 7, 8, 10, 12, 9, 6, 5, 2, 4] },
  ];
  const proj = days.length - 1;
  const MAX = 40;
  const W = 760, H = 300, x0 = 46, x1 = 738, yTop = 18, y0 = 250;
  const X = i => x0 + (i * (x1 - x0)) / (days.length - 1);
  const Y = v => y0 - (v / MAX) * (y0 - yTop);
  const seg = (arr, from, to) => arr.slice(from, to + 1).map((v, i) => (i ? "L" : "M") + X(from + i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
  const ticks = [0, 5, 12, 19];
  return (
    <section className="card span-8" data-screen-label="Sentimiento en el tiempo">
      <div className="card-head" style={{ marginBottom: 8 }}>
        <span className="card-title">Sentimiento en el tiempo <InfoDot text="Evolución diaria del sentimiento detectado en las conversaciones del período." /></span>
        <span style={{ fontSize: 12, color: "var(--ink-3)" }}>Última actualización 14:32</span>
      </div>
      <div style={{ width: "100%" }}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="Evolución del sentimiento negativo, positivo y neutro en el tiempo">
          {[40, 30, 20, 10, 0].map(v => (
            <g key={v}>
              <line className="grid-line" x1={x0} y1={Y(v)} x2={x1} y2={Y(v)}></line>
              <text className="axis-label" x={x0 - 10} y={Y(v) + 4} textAnchor="end">{v}</text>
            </g>
          ))}
          {ticks.map(i => (
            <text key={i} className="axis-label" x={X(i)} y={y0 + 24} textAnchor="middle">{days[i]}</text>
          ))}
          {series.map(s => (
            <path key={s.key} d={seg(s.vals, 0, days.length - 1)} fill="none" stroke={s.color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"></path>
          ))}
        </svg>
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 6, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {series.map(s => (
            <span key={s.key} style={{ display: "inline-flex", alignItems: "center", gap: 7, background: s.bg, color: s.color, fontSize: 12, fontWeight: 600, padding: "4px 11px", borderRadius: "var(--radius-pill, 999px)" }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: s.color }}></span>{s.name}
            </span>
          ))}
        </div>
        <div style={{ fontSize: 13, color: "var(--ink-2)" }}>
          <b style={{ color: "var(--ink)", fontWeight: 600 }}>55% positivo</b> · 2.334 interacciones
        </div>
      </div>
    </section>
  );
}

          <FilterField label="Agencia" value={ff.sucursal} onChange={v => setField("sucursal", v)} options={["Todas las agencias", ...SUCURSALES_T]} />
          <FilterField label="Desde" value={ff.desde} onChange={v => setField("desde", v)} type="date" />

                <thead>

                    <th>Trámite</th>
                    <th>Agencia</th>
                    <th>Fecha</th>

                      </td>

            </div>
            <div className="pagination">
              <span>Mostrando {rows.length} de {CONSENTIMIENTO.length} atenciones</span>
            </div>
          </React.Fragment>
        )}
      </section>
    </React.Fragment>
  );
}

  const bars = React.useMemo(() => Array.from({ length: 90 }, (_, i) => 0.25 + Math.abs(Math.sin(i * 0.55)) * 0.6 + (i % 7 === 0 ? 0.15 : 0)), []);
  return (
    <div className="waveform" onClick={e => {
      const r = e.currentTarget.getBoundingClientRect();
      onSeek((e.clientX - r.left) / r.width);
    }}>
      <svg viewBox="0 0 90 40" preserveAspectRatio="none" style={{ width: "100%", height: "100%", display: "block" }}>
        {bars.map((b, i) => (
          <rect key={i} x={i + 0.15} width="0.7" y={(1 - b) * 20} height={b * 40}
            rx="0.35" fill={i / 90 <= progress ? "var(--purple)" : "#DDD6EC"}></rect>
        ))}
      </svg>
    </div>
  );
}

const OKABE_P = ["var(--purple)", "#0072B2", "#56B4E9", "#E69F00", "#CC79A7", "#1A7F5A", "#9CA3AF", "#991B1B"];

const fmtNum = n => n.toLocaleString("es-CL");
const fmtP = v => v.toFixed(1).replace(".", ",");

function downloadText(filename, mime, text) {
  const b = new Blob([text], { type: mime });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500);
}
function toCSV(headers, rows) {
  const esc = v => { const s = String(v).replace(/"/g, '""'); return /[",;\n]/.test(s) ? '"' + s + '"' : s; };
  return [headers.join(";")].concat(rows.map(r => r.map(esc).join(";"))).join("\n");
}
function exportSvgPng(svg, filename) {
  const xml = new XMLSerializer().serializeToString(svg);
  const vb = svg.viewBox.baseVal;
  const w = (vb && vb.width) || svg.clientWidth || 680;
  const h = (vb && vb.height) || svg.clientHeight || 300;
  const img = new Image();
  img.onload = function () {
    const scale = 2, c = document.createElement("canvas");
    c.width = w * scale; c.height = h * scale;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function (b) { const u = URL.createObjectURL(b); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500); });
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

/* ── Gráfico configurable (barras / pastel / línea) exportable ── */
function ChartCard({ title, sub, span, items, colorMode }) {
  const [type, setType] = useStateP("barras");

  const W = 700, H = 320, pad = 8;
  const max = Math.max.apply(null, items.map(i => i.value)) || 1;
  const color = i => colorMode === "multi" ? OKABE_P[i % OKABE_P.length] : "var(--purple)";
  const colorHex = i => colorMode === "multi" ? OKABE_P[i % OKABE_P.length] : "var(--purple)";

  let chart = null;
  if (type === "barras") {
    const x0 = 150, x1 = 660, y0 = 20, rowH = (H - 40) / items.length;
    chart = (
      <g>
        {items.map((it, i) => {
          const y = y0 + i * rowH, bw = (it.value / max) * (x1 - x0);
          return (
            <g key={it.name}>
              <text x={x0 - 10} y={y + rowH / 2 + 4} textAnchor="end" style={{ fontSize: 12, fill: "var(--ink-2)", fontFamily: "Inter" }}>{it.name.length > 20 ? it.name.slice(0, 19) + "…" : it.name}</text>

            </g>
          );
        })}
      </g>
    );
  } else if (type === "pastel") {
    const cx = 165, cy = 160, r = 120, C = 2 * Math.PI * r, sum = items.reduce((s, x) => s + x.value, 0) || 1;
    let acc = 0;
    chart = (
      <g>
        {items.map((it, i) => {
          const frac = it.value / sum, dash = frac * C, off = -acc; acc += dash;
          return <circle key={it.name} cx={cx} cy={cy} r={r} fill="none" stroke={OKABE_P[i % OKABE_P.length]} strokeWidth="52"
            strokeDasharray={(dash - 2) + " " + (C - dash + 2)} strokeDashoffset={off} transform={`rotate(-90 ${cx} ${cy})`}></circle>;
        })}
        {items.map((it, i) => (
          <g key={"l" + it.name} transform={`translate(370, ${40 + i * 34})`}>

          </g>
        ))}
      </g>
    );
  } else {
    const x0 = 46, x1 = 670, y0 = 280, yTop = 20;
    const X = i => x0 + (items.length === 1 ? 0 : i * (x1 - x0) / (items.length - 1));
    const Y = v => y0 - (v / max) * (y0 - yTop);
    const line = items.map((it, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(it.value).toFixed(1)).join(" ");
    chart = (
      <g>
        {[0, 0.25, 0.5, 0.75, 1].map(f => (
          <line key={f} x1={x0} y1={Y(max * f)} x2={x1} y2={Y(max * f)} stroke="#F0F0F3" strokeWidth="1"></line>
        ))}
        <path d={line} fill="none" stroke="var(--purple)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"></path>
        <path d={line + ` L${X(items.length - 1)},${y0} L${x0},${y0} Z`} fill="var(--purple)" opacity="0.06"></path>
        {items.map((it, i) => (
          <g key={it.name}>
            <circle cx={X(i)} cy={Y(it.value)} r="4" fill="var(--purple)" stroke="#fff" strokeWidth="1.5"></circle>
            <text x={X(i)} y={y0 + 20} textAnchor="middle" style={{ fontSize: 10.5, fill: "var(--ink-3)", fontFamily: "Inter" }}>{it.name.split(" ")[0]}</text>

    );

  return (
    <section className={"card span-" + (span || 12)} data-screen-label={title}>

        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <Segmented value={type} onChange={setType} options={[
            { v: "barras", label: "Barras", icon: "chart-bar" },
            { v: "pastel", label: "Pastel", icon: "chart-pie" },
            { v: "linea", label: "Línea", icon: "chart-line" },
          ]} />
          <div style={{ display: "flex", gap: 6 }}>
            <button className="btn-secondary" style={{ fontSize: 12, padding: "6px 10px" }} onClick={() => exportSvgPng(svgRef.current, title + ".png")}>
              <i className="ph ph-image" style={{ marginRight: 4 }}></i>PNG
            </button>
            <button className="btn-secondary" style={{ fontSize: 12, padding: "6px 10px" }} onClick={() => downloadText(title + ".svg", "image/svg+xml", new XMLSerializer().serializeToString(svgRef.current))}>
              <i className="ph ph-file-svg" style={{ marginRight: 4 }}></i>SVG
            </button>
          </div>
        </div>
      </div>
      <svg ref={svgRef} width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label={title}>
        <rect width={W} height={H} fill="#fff"></rect>
        {chart}
      </svg>
    </section>
  );
}

/* Dataset sintético determinista */
const RB_ROWS = (() => {
  let s = 20260803;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const out = [];
  for (let i = 0; i < 2334; i++) {
    const canal = rnd() < 0.76 ? "Caja" : "SAC";
    const suc = pick(RB_DIM.suc.vals);
    // la última agencia solo opera Caja en el período — genera combinaciones sin datos
    if (suc === RB_DIM.suc.vals[3] && canal === "SAC") continue;
    const skill = 0.7 + rnd() * 0.6;
    const r = {
      suc, canal, agente: pick(RB_DIM.agente.vals), periodo: pick(RB_DIM.periodo.vals),
      resolucion: pick(RB_DIM.resolucion.vals), resultado: pick(RB_DIM.resultado.vals),

      objecion: pick(RB_DIM.objecion.vals), fortaleza: pick(RB_DIM.fortaleza.vals),
      productos: Math.round(rnd() * 2 * skill * 10) / 10,
      sellerScore: Math.max(1, Math.min(10, Math.round(2 + rnd() * 5 * skill))),
      protocolo: Math.round(20 + rnd() * 55 * skill),
      confidence: Math.round((0.55 + rnd() * 0.44) * 100) / 100,
      interpretable: rnd() > 0.11,
      flags: {},
    };
