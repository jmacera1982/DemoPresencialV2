function Waveform({ progress, onSeek }) {
  const bars = React.useMemo(() => Array.from({ length: 90 }, (_, i) => 0.25 + Math.abs(Math.sin(i * 0.55)) * 0.6 + (i % 7 === 0 ? 0.15 : 0)), []);
  return (
    <div className="waveform" onClick={e => {
      const r = e.currentTarget.getBoundingClientRect();
      onSeek((e.clientX - r.left) / r.width);
    }}>
      <svg viewBox="0 0 90 40" preserveAspectRatio="none" style={{ width: "100%", height: "100%", display: "block" }}>
        {bars.map((b, i) => (
          <rect key={i} x={i + 0.15} width="0.7" y={(1 - b) * 20} height={b * 40} rx="0.35"
            fill={i / 90 <= progress ? "var(--purple)" : "#DDD6EC"}></rect>
        ))}
      </svg>
    </div>
  );
}

function InfoTip({ text }) {
  const [show, setShow] = useState(false);
  return (
    <span className="info-icon" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
      <Ph name="info" />
      {show ? <span className="tooltip-box">{text}</span> : null}
    </span>
  );
}

function Detail({ onBack, row, drawer, onGoProfile }) {
  const r = row || INTERACCIONES[0];
  const caso = r.canal === "Taller" ? CASO_TALLER
    : (r.canal === "WhatsApp" || r.canal === "Call center") ? CASO_SEGUIMIENTO
    : CASO_VITRINA;
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0.28);
  const [q, setQ] = useState("");
  const [matchIdx, setMatchIdx] = useState(0);
  const [selDetection, setSelDetection] = useState(null);
  const [modal, setModal] = useState(false);
  const [toast, setToast] = useState(null);
  const [note, setNote] = useState("");
  const panelRef = useRef(null);
  const txRef = useRef(null);

  const [min, seg] = r.dur.split(":").map(Number);
  const DUR = min * 60 + seg;
  const fmt = s => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");

  useEffect(() => { setProgress(0.28); setPlaying(false); setQ(""); setSelDetection(null); }, [r.id]);
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setProgress(p => (p >= 1 ? (setPlaying(false), 1) : p + 0.002)), 100);
    return () => clearInterval(id);
  }, [playing]);
  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(id);
  }, [toast]);

  const seekTo = ts => {
    if (!ts) return;
    const [m, s] = ts.split(":").map(Number);
    setProgress(Math.min(1, (m * 60 + s) / DUR));
    setPlaying(true);
  };
  const scrollPanelTo = id => {
    const el = document.getElementById(id);
    if (el && panelRef.current) {
      const top = el.offsetTop - panelRef.current.offsetTop;
      panelRef.current.scrollTo({ top: Math.max(0, top - 8), behavior: "smooth" });
    }
  };

  const matches = [];
  if (q.length >= 2) {
    caso.transcript.forEach((b, bi) => b.parts.forEach((p, pi) => {
      let idx = p.x.toLowerCase().indexOf(q.toLowerCase());
      while (idx !== -1) { matches.push({ bi, pi, idx }); idx = p.x.toLowerCase().indexOf(q.toLowerCase(), idx + 1); }
    }));
  }
  const curMatch = matches.length ? matches[((matchIdx % matches.length) + matches.length) % matches.length] : null;
  useEffect(() => {
    if (!curMatch || !txRef.current) return;
    const el = txRef.current.querySelector(".hl-search.current");
    if (el) txRef.current.scrollTo({ top: el.offsetTop - txRef.current.offsetTop - 80, behavior: "smooth" });
  }, [q, matchIdx]);

  const renderPart = (p, bi, pi) => {
    let content = p.x;
    if (q.length >= 2) {
      const pieces = [];
      let last = 0;
      const lower = p.x.toLowerCase(), ql = q.toLowerCase();
      let idx = lower.indexOf(ql);
      while (idx !== -1) {
        if (idx > last) pieces.push(p.x.slice(last, idx));
        const isCur = curMatch && curMatch.bi === bi && curMatch.pi === pi && curMatch.idx === idx;
        pieces.push(<mark key={idx} className={"hl-search" + (isCur ? " current" : "")}>{p.x.slice(idx, idx + q.length)}</mark>);
        last = idx + q.length;
        idx = lower.indexOf(ql, last);
      }
      if (last < p.x.length) pieces.push(p.x.slice(last));
      content = pieces;
    }
    if (p.hl) {
      const cfg = HL_TYPES[p.hl];
      const dim = selDetection && selDetection !== p.hl;
      return (
        <span key={pi} className={"hl hl-" + p.hl} tabIndex={0} role="button"
          aria-label={cfg.label + ": " + p.x} style={dim ? { opacity: 0.4 } : null}
          onClick={() => scrollPanelTo("card-detecciones")}
          onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); scrollPanelTo("card-detecciones"); } }}>
          <Ph name={cfg.icon} fill className="hl-ic" />
          {content}
          <span className="hl-label">{cfg.label}</span>
        </span>
      );
    }
    return <span key={pi}>{content}</span>;
  };

  const cumplidos = caso.protocol.filter(p => p.ok).length;

  return (
    <React.Fragment>
      {drawer ? (
        <div className="drawer-head">
          <span style={{ fontSize: 13, color: "var(--ink-3)" }}>Interacciones · {r.sede}</span>
          <button className="drawer-close" onClick={onBack} aria-label="Cerrar"><Ph name="x" /></button>
        </div>
      ) : (
        <div className="breadcrumb">
          <a href="#" onClick={e => { e.preventDefault(); onBack(); }}>Interacciones</a>
          <Ph name="caret-right" style={{ fontSize: 11 }} />
          <span>{r.sede}</span>
          <Ph name="caret-right" style={{ fontSize: 11 }} />
          <span style={{ color: "var(--ink)", fontWeight: 600 }}>{r.id}</span>
        </div>
      )}

      <div className="detail-header">
        <h1>Interacción {r.id}</h1>
        <span className="meta-chip"><Ph name="calendar-blank" />{r.fecha}</span>
        <span className="meta-chip"><Ph name="clock" />{r.dur}</span>
        <span className="meta-chip"><Ph name="storefront" />{r.sede}</span>
        <span className="meta-chip"><Ph name="map-pin" />{r.puesto}</span>
        <span className={"chip-canal " + canalCls(r.canal)}>{r.canal}</span>
        <span className="meta-chip"><Ph name="motorcycle" />{r.modelo}</span>
        <span className="meta-chip"><Ph name="wrench" />{r.motivo}</span>
        <span className="meta-chip"><span className="avatar sm">{r.ini}</span>{r.exec}</span>
        <SentPill kind={r.sent} />
      </div>

      <div className={"detail-layout" + (drawer ? " in-drawer" : "")}>
        <section className="card transcript-card">
          <div className="player">
            <div className="player-top">
              <button className="play-btn" onClick={() => setPlaying(!playing)} aria-label={playing ? "Pausar" : "Reproducir"}>
                <Ph name={playing ? "pause" : "play"} fill />
              </button>
              <Waveform progress={progress} onSeek={p => setProgress(p)} />
              <span className="player-time">{fmt(progress * DUR)} / {r.dur}</span>
            </div>
          </div>
          <div className="tx-search">
            <div className="search-bar">
              <Ph name="magnifying-glass" />
              <input placeholder="Buscar en la transcripción…" value={q} onChange={e => { setQ(e.target.value); setMatchIdx(0); }} />
            </div>
            {q.length >= 2 ? (
              <React.Fragment>
                <span className="match-count">
                  {matches.length ? (((matchIdx % matches.length) + matches.length) % matches.length) + 1 + " de " + matches.length : "0 resultados"}
                </span>
                <button className="tx-nav-btn" onClick={() => setMatchIdx(i => i - 1)} disabled={!matches.length}>↑</button>
                <button className="tx-nav-btn" onClick={() => setMatchIdx(i => i + 1)} disabled={!matches.length}>↓</button>
              </React.Fragment>
            ) : null}
          </div>
          <div className="tx-body" ref={txRef}>
            {caso.transcript.map((b, bi) => (
              <div key={bi} className={"bubble-row " + b.who}>
                <span className={"avatar sm" + (b.who === "client" ? " gray" : "")}>{b.who === "exec" ? r.ini : "CL"}</span>
                <div className="bubble">
                  <div className="b-meta">
                    {b.who === "exec" ? r.exec.split(" ")[0] + " (asesor)" : "Cliente"}
                    <button onClick={() => seekTo(b.t)} title="Reproducir desde aquí"
                      style={{ border: "none", background: "none", color: "var(--purple)", fontWeight: 600, cursor: "pointer", padding: 0, fontSize: 11 }}>{b.t}</button>
                  </div>
                  {b.parts.map((p, pi) => renderPart(p, bi, pi))}
                </div>
              </div>
            ))}
          </div>
        </section>

        <div className="analysis-panel">
          <div className="analysis-scroll" ref={panelRef}>
            <section className="card ai-card" id="card-feedback">
              <div className="card-head" style={{ marginBottom: 0 }}>
                <span className="card-label"><Ph name="sparkle" fill />Lectura de la conversación</span>
              </div>
              <p>{caso.feedback}</p>
              <div style={{ fontSize: 12, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em", color: "var(--red)", marginTop: 12 }}>Oportunidades</div>
              <ul>
                {caso.oportunidades.map(o => <li key={o}>{o}</li>)}
              </ul>
            </section>

            <section className="card" id="card-metricas">
              <div className="card-label">Métricas de la interacción</div>
              <div style={{ marginTop: 8 }}>
                <div className="metric-row">
                  <span className="mr-label">{caso.protocolLabel}</span>
                  <div className="mr-bar-track"><div className="mr-bar" style={{ width: (cumplidos / caso.protocol.length) * 100 + "%", background: "var(--purple)" }}></div></div>
                  <span className="mr-val">{cumplidos} de {caso.protocol.length}</span>
                </div>
                {caso.metricas.map(m => (
                  <div className="metric-row" key={m.label}>
                    <span className="mr-label">
                      {m.label}
                      {m.tag ? <span className="tag-estimado">estimado</span> : null}
                      {m.info ? <InfoTip text={m.info} /> : null}
                    </span>
                    <div className="mr-bar-track"><div className="mr-bar" style={{ width: m.pct + "%", background: m.color }}></div></div>
                    <span className="mr-val">{m.val}</span>
                  </div>
                ))}
              </div>
            </section>

            <section className="card" id="card-protocolo">
              <div className="card-label">Momentos del protocolo</div>
              <div style={{ margin: "8px -8px 0" }}>
                {caso.protocol.map(p => (
                  <button className={"check-row" + (p.ok ? "" : " fail")} key={p.label} onClick={() => seekTo(p.ts)}>
                    <span className={"check-ic " + (p.ok ? "ok" : "no")}><Ph name={p.ok ? "check" : "x"} bold /></span>
                    <span className="check-label">{p.label}</span>
                    <span className="check-ts">{p.ts || "no detectado"}</span>
                  </button>
                ))}
              </div>
            </section>

            <section className="card" id="card-detecciones">
              <div className="card-label">Detecciones</div>
              <div className="det-chips">
                {caso.detecciones.map(([key, color, label]) => (
                  <button key={key} className={"det-chip " + color + (selDetection === key ? " selected" : "")}
                    onClick={() => setSelDetection(selDetection === key ? null : key)}>{label}</button>
                ))}
              </div>
              {selDetection ? <div className="card-sub" style={{ marginTop: 10 }}>Resaltando en la transcripción. Haga clic de nuevo para quitar el filtro.</div> : null}
            </section>

            <section className="card" id="card-modelos">
              <div className="card-label">Modelos, repuestos y marcas nombrados</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 12 }}>
                {caso.chips.map(c => (
                  <span className={"pill " + c.cls} key={c.text}><Ph name={c.icon} />{c.text}</span>
                ))}
              </div>
              <div className="card-sub" style={{ marginTop: 12 }}>{caso.chipsNota}</div>
            </section>

            <section className="card" id="card-compromisos">
              <div className="card-label">Compromisos por cumplir</div>
              <div style={{ marginTop: 8 }}>
                {caso.compromisos.map(c => (
                  <div className="kv-row" key={c.k}>
                    <span className="kv-k">{c.k}</span>
                    <span className={"pill sm " + c.cls}>{c.v}</span>
                  </div>
                ))}
              </div>
            </section>
          </div>

          <div className="panel-footer">
            <button className="btn-secondary" onClick={() => setModal(true)}><Ph name="chalkboard-teacher" style={{ marginRight: 4 }} />Enviar a coaching</button>
            <button className="btn-secondary" onClick={() => setToast("Enlace copiado al portapapeles")}><Ph name="link" style={{ marginRight: 4 }} />Compartir</button>
            <a href="#" className="flink" onClick={e => { e.preventDefault(); if (onGoProfile) onGoProfile(); }}>Ver desempeño del asesor →</a>
          </div>
        </div>
      </div>

      {modal ? (
        <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) setModal(false); }}>
          <div className="modal" role="dialog" aria-label="Enviar a coaching">
            <h3>Enviar a coaching</h3>
            <div className="m-sub">Interacción {r.id} · {r.exec}</div>
            <label htmlFor="sup">Responsable</label>
            <select id="sup" defaultValue="">
              <option value="" disabled>Seleccione un responsable</option>
              <option>Andrés Felipe Gómez — Jefe de vitrina Guayabal</option>
              <option>Paola Andrea Ríos — Gerente de zona Antioquia</option>
              <option>Mauricio Alzate — Formación comercial de la red</option>
              <option>Claudia Restrepo — Jefatura de posventa</option>
            </select>
            <label htmlFor="foco">Foco del coaching</label>
            <select id="foco" defaultValue={caso.focos[0]}>
              {caso.focos.map(f => <option key={f}>{f}</option>)}
            </select>
            <label htmlFor="nota">Nota (opcional)</label>
            <textarea id="nota" placeholder="Contexto para el responsable…" value={note} onChange={e => setNote(e.target.value)}></textarea>
            <div className="m-actions">
              <button className="btn-secondary" onClick={() => setModal(false)}>Cancelar</button>
              <button className="btn-primary" onClick={() => { setModal(false); setToast("Interacción enviada a coaching"); }}>Enviar</button>
            </div>
          </div>
        </div>
      ) : null}

      {toast ? <Toast>{toast}</Toast> : null}
    </React.Fragment>

}

function EXPORT_SHEETS(tab) {
  if (tab === "Resumen") return [
    { title: "Indicadores del período", cols: ["Métrica", "Valor"], rows: [
      ["Protocolo de asesoría", "72%"], ["Interacciones analizadas", "2.418 de 2.690"],
      ["CSAT estimado", "4,1/5"], ["Índice de asesoría", "6,4/10"],
      ["Pruebas de ruta agendadas", "296"], ["Cotizaciones entregadas", "879"],
      ["Citas de taller agendadas", "486"], ["Entregas prometidas sin confirmar", "37"],
    ] },
    { title: "Temas del período", cols: ["Tema", "Interacciones", "Variación", "Sentimiento"],
      rows: TEMAS.map(t => [t.name, t.vol, t.nuevo ? "nuevo" : (t.delta > 0 ? "+" : "") + t.delta + "%", SENT_LABEL[t.sent]]) },
    { title: "Modelos más mencionados", cols: ["Modelo", "Marca", "Categoría", "Menciones", "Pruebas de ruta", "Cotizaciones", "Separaciones"],
      rows: MODELOS.map(m => [m.name, m.marca, m.cat, m.menciones, m.pruebas, m.cotizaciones, m.cierres]) },
    { title: "Competencia mencionada", cols: ["Marca", "Menciones", "Contexto"], rows: COMPETENCIA.map(c => [c.name, c.n, c.ctx]) },
    { title: "Uso declarado de la moto", cols: ["Uso", "Interacciones"], rows: USO_DECLARADO.map(u => [u.name, u.n]) },
    { title: "Sentimiento en el tiempo", cols: ["Fecha", "Positivo", "Neutro", "Negativo"], rows: [
      ["14 jul", 22, 16, 12], ["20 jul", 31, 15, 16], ["26 jul", 30, 19, 21],
      ["1 ago", 29, 20, 26], ["7 ago", 41, 16, 19], ["Hoy", 46, 15, 17],
    ] },
  ];
  if (tab === "Vitrina") return [
    { title: "Resumen de vitrina", cols: ["Métrica", "Valor"], rows: [
      ["Total interacciones", "1.204"], ["Con cotización entregada", "512 (42,5%)"],
      ["Se fue sin cotización", "692"], ["Índice de asesoría", "6,1/10"],
    ] },
    { title: "Embudo de la conversación", cols: ["Paso", "Interacciones", "% del total"],
      rows: EMBUDO.map(s => [s.name, s.n, Math.round((s.n / EMBUDO[0].n) * 100) + "%"]) },
    { title: "Modelos más mencionados", cols: ["Modelo", "Menciones", "Objeción dominante"],
      rows: MODELOS.map(m => [m.name, m.menciones, m.objecion]) },
    { title: "Objeciones más frecuentes", cols: ["Objeción", "Casos"], rows: [
      ["La cuota inicial es muy alta", 96], ["No me aprobaron el crédito con el aliado", 74],
      ["En otra vitrina está más barata", 61], ["Prefiero esperar el modelo del próximo año", 44],
      ["El casco y el baúl no vienen incluidos", 38], ["Voy a mirar una usada", 29], ["No hay el color que quiero", 27],
    ] },
    { title: "Experiencia del cliente", cols: ["Indicador", "Valor"], rows: [
      ["Cumplimiento de protocolo", "58%"], ["Escucha activa", "41%"],
      ["Cierre con próximos pasos", "36%"], ["Invitación a la encuesta", "4%"],
    ] },
  ];
  if (tab === "Posventa") return [
    { title: "Resumen de taller", cols: ["Métrica", "Valor"], rows: [
      ["Total interacciones", "842"], ["Resueltas en la visita", "519 (61,6%)"],
      ["Sin resolver", "323"], ["Índice de asesoría", "6,8/10"],
      ["Recepción en menos de 10 min", "63,4%"], ["Reingresos por la misma falla", "27"],
    ] },
    { title: "Tipo de servicio", cols: ["Servicio", "Atenciones"], rows: [
      ["Mantenimiento preventivo (1.000 / 5.000 / 10.000 km)", 268], ["Cambio de aceite y filtro", 148],
      ["Frenos y pastillas", 96], ["Kit de arrastre y transmisión", 82], ["Sistema eléctrico y batería", 74],
      ["Reclamo de garantía", 62], ["Campaña de seguridad", 48], ["Llantas y rines", 38], ["Diagnóstico de motor", 26],
    ] },
    { title: "Motivos de no resolución", cols: ["Motivo", "Casos"], rows: [
      ["Repuesto no disponible", 118], ["Requiere cita programada", 74], ["Garantía en estudio", 52],
      ["Cliente no autorizó el costo", 41], ["Diagnóstico incompleto", 25], ["Falta soporte de mantenimientos previos", 13],
    ] },
    { title: "Eficiencia por asesor de taller", cols: ["Asesor", "Atenciones", "Tiempo de recepción", "SLA"], rows: [
      ["Luz Adriana Cardona", 218, "12m 40s", "68,4%"], ["Jhon Fredy Zapata", 186, "15m 12s", "61,2%"],
      ["Wilmar Alexis Betancur", 164, "18m 05s", "54,8%"], ["Édison Camilo Vargas", 148, "21m 34s", "47,3%"],
      ["Leidy Johana Cifuentes", 126, "16m 48s", "58,1%"],
    ] },
  ];
  if (tab === "Interacciones") return [
    { title: "Conversaciones", note: "2.418 filas en total — se muestra una selección",
      cols: ["ID", "Fecha", "Asesor", "Canal", "Sede", "Modelo", "Duración", "Motivo", "Resultado", "Puntuación"],
      rows: INTERACCIONES.map(r => [r.id, r.fecha, r.exec, r.canal, r.sede, r.modelo, r.dur, r.motivo, r.resultado, r.punt + "/10"]) },
  ];
  if (tab === "Asesores") return [
    { title: "Ranking de asesores", note: ASESORES_DATA.length + " filas en total",
      cols: ["Asesor", "Rol", "Sede", "Interacciones", "Conversión", "Motos", "Prueba de ruta", "Índice", "Resueltas", "Sin resolver"],
      rows: ASESORES_DATA.slice(0, 14).map(e => [e.name, e.rol, e.sede, e.interacciones, fmtP(e.conversion) + "%", e.ventas, e.pruebas + "%", fmtP(e.score) + "/10", e.resueltas, e.noResueltas]) },
  ];
  if (tab === "Sedes") return [
    { title: "Ranking de sedes", cols: ["Sede", "Ciudad", "Asesores", "Interacciones", "Conversión", "Motos", "Prueba de ruta", "Índice"],
      rows: SEDES_DATA.map(a => [a.name, a.ciudad, a.asesores, a.interacciones, fmtP(a.conversion) + "%", a.ventas, a.pruebas + "%", fmtP(a.score) + "/10"]) },
  ];
  return [{ title: tab, cols: ["Métrica", "Valor"], rows: [] }];
}

    estado: "normal", rankingPublico: true, nubePalabras: false, listaVacia: false, datosInsuficientes: false,
  });
  const setTweak = (k, v) => setTweaks(s => ({ ...s, [k]: v }));
  const [demoOpen, setDemoOpen] = useState(false);
  const [tab, setTab] = useState("Resumen");
  const [detailRow, setDetailRow] = useState(null);
  const [topic, setTopic] = useState(null);
  const [model, setModel] = useState(null);
  const [informeOpen, setInformeOpen] = useState(false);
  const [exportFmt, setExportFmt] = useState(null);
  const [drillQuery, setDrillQuery] = useState("");
  const [filters, setFilters] = useState(EMPTY_FILTERS);

  const drill = q => { setDrillQuery(typeof q === "string" ? q : ""); setTopic(null); setModel(null); setTab("Interacciones"); };
  const closeAll = () => { setDetailRow(null); setTopic(null); setModel(null); };

  useEffect(() => {
    const open = detailRow || topic || model;
    if (!open) return;
    const onKey = e => { if (e.key === "Escape") closeAll(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [detailRow, topic, model]);

  const variant = tweaks.estado === "bloqueado" ? "locked"
    : tweaks.estado === "día 1" ? "day1"
    : tweaks.estado === "configuración pendiente" ? "setup"
    : "normal";

  return (
    <React.Fragment>
      <a className="skip-link" href="#contenido">Saltar al contenido</a>
      <Sidebar />
      {informeOpen ? <InformeModal onClose={() => setInformeOpen(false)} /> : null}
      {exportFmt ? <ExportPreviewModal tab={tab} format={exportFmt} onClose={() => setExportFmt(null)} /> : null}

      <main className="main" id="contenido">
        <div className="topbar">
          <div>
            <h1 className="page-title">Speech Analytics</h1>
            <div className="page-sub">Red de concesionarios y talleres · {PERIODO.label} ({PERIODO.rango})</div>
          </div>
          <span className="tenant-chip" style={{ marginLeft: 8 }}>
            <span className="tc-dot"><RutaMotoMark size={13} /></span>RutaMoto Mobility
          </span>
          <div style={{ display: "flex", gap: 8, marginLeft: "auto", alignItems: "center", flexWrap: "wrap" }}>
            <button className="chip" onClick={() => setDemoOpen(!demoOpen)} aria-pressed={demoOpen}>
              <Ph name="sliders-horizontal" />Demo
            </button>
            <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }} onClick={() => setInformeOpen(true)}>
              <Ph name="sparkle" fill />Generar informe
            </button>
            <ExportMenu onExport={setExportFmt} />
          </div>
        </div>

        <Tabs tab={tab} onTab={setTab} />
        <FilterRow filters={filters} onChange={setFilters} hideAsesores={tab === "Sedes"} />
        <ActiveFiltersBar filters={filters} onChange={setFilters} />

        {tab === "Resumen" ? (
          <Dashboard variant={variant}
            rankingPublico={tweaks.rankingPublico}
            nubePalabras={tweaks.nubePalabras}
            onOpenProfile={() => setTab("Asesores")}
            onGoTemas={() => drill("")}
            onDrillTopic={setTopic}
            onOpenModel={setModel}
            onDrill={drill} />
        ) : null}
        {tab === "Vitrina" ? <Vitrina onDrill={drill} onOpenModel={setModel} /> : null}
        {tab === "Posventa" ? <Posventa onDrill={drill} /> : null}
        {tab === "Interacciones" ? (
          <Interactions onOpenDetail={setDetailRow} forceEmpty={tweaks.listaVacia}
            initialQuery={drillQuery} onExport={setExportFmt} />
        ) : null}
        {tab === "Asesores" ? (
          <Asesores datosInsuficientes={tweaks.datosInsuficientes} onGoInteractions={drill} />
        ) : null}
        {tab === "Sedes" ? <Sedes onGoInteractions={drill} /> : null}
      </main>

      {topic ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setTopic(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de tema">
            <TopicDetail topic={topic} onClose={() => setTopic(null)}
              onOpenDetail={() => { setTopic(null); setDetailRow(INTERACCIONES[0]); }}
              onGoInteractions={() => drill(topic.q != null ? topic.q : topic.name)} />
          </aside>
        </div>
      ) : null}

      {model ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setModel(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de modelo">
            <ModelDetail model={model} onClose={() => setModel(null)} onGoInteractions={() => drill(model.name)} />
          </aside>
        </div>
      ) : null}

      {detailRow ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setDetailRow(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de interacción">
            <Detail row={detailRow} drawer onBack={() => setDetailRow(null)}
              onGoProfile={() => { setDetailRow(null); setTab("Asesores"); }} />
          </aside>
        </div>
      ) : null}

      {demoOpen ? <DemoPanel t={tweaks} setTweak={setTweak} onClose={() => setDemoOpen(false)} /> : null}
      <AiFab />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
