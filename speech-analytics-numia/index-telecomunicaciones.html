  durMin: "Sin mínimo", durMax: "Sin máximo", desde: "", hasta: "", puntMin: "Sin mínimo",
};

function selStyle() {
  return { width: "100%", height: 38, padding: "0 12px", borderRadius: 8, border: "1px solid var(--border)", background: "var(--card)", fontFamily: "inherit", fontSize: 13, color: "var(--ink)", cursor: "pointer" };
}

function FilterField({ label, value, onChange, options, type }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, minWidth: 0 }}>
      <label style={{ fontSize: 12, fontWeight: 500, color: "var(--ink-2)" }}>{label}</label>
      {type === "date" ? (
        <input type="date" value={value} onChange={e => onChange(e.target.value)} style={selStyle()} />
      ) : (
        <select value={value} onChange={e => onChange(e.target.value)} style={selStyle()}>
          {options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      )}
    </div>
  );
}

function Interactions({ onOpenDetail, forceEmpty, initialQuery, onExport }) {
  const [q, setQ] = useState("");
  const [sort, setSort] = useState({ col: "fecha", dir: "desc" });
  const [page, setPage] = useState(1);
  const [ff, setFf] = useState(FILTER_DEFAULTS);
  const setField = (k, v) => setFf(s => ({ ...s, [k]: v }));
  useEffect(() => { if (initialQuery != null) { setQ(initialQuery); setPage(1); } }, [initialQuery]);

  let allRows = INTERACCIONES.filter(r => {
    const hay = (r.exec + " " + r.motivo + " " + r.sede + " " + r.id + " " + r.puesto + " " + r.modelo + " " + r.canal + " " + r.resultado).toLowerCase();
    const okQ = !q || hay.includes(q.toLowerCase());
    const okRes = ff.resultado === "Todos" || r.resultado === ff.resultado;
    const okMot = ff.motivo === "Todos" || r.motivo === ff.motivo;
    const okCan = ff.canal === "Todos" || r.canal === ff.canal;
    const okMod = ff.modelo === "Todos" || r.modelo === ff.modelo;
    return okQ && okRes && okMot && okCan && okMod;
  });
  /* La muestra de demostración trae 12 conversaciones: cuando un drill-down
     no encuentra coincidencia exacta se muestran todas y se avisa, en lugar
     de dejar la tabla vacía. */
  const sinCoincidencia = !!q && allRows.length === 0;
  let rows = sinCoincidencia ? INTERACCIONES.slice() : allRows;
  const empty = forceEmpty || rows.length === 0;

  const cols = [
    ["exec", "Asesor"], ["canal", "Punto de contacto"], ["modelo", "Modelo"], ["dur", "Duración"],
    ["sede", "Sede"], ["fecha", "Fecha"], ["motivo", "Motivo"], ["resultado", "Resultado"],
    ["punt", "Puntuación"], ["estado", "Estado"], ["", "Acciones"],
  ];
  const sortBy = col => { if (col) setSort(s => ({ col, dir: s.col === col && s.dir === "asc" ? "desc" : "asc" })); };
  if (sort.col) {
    rows = [...rows].sort((a, b) => {
      const cmp = String(a[sort.col]).localeCompare(String(b[sort.col]), "es", { numeric: true });
      return sort.dir === "asc" ? cmp : -cmp;
    });
  }
  const reviews = INTERACCIONES.filter(r => r.review);
  const clearAll = () => { setFf(FILTER_DEFAULTS); setQ(""); };

  return (
    <React.Fragment>
      <div className="filter-row" style={{ paddingTop: 0 }}>
        <div className="search-bar">
          <Ph name="magnifying-glass" />
          <input placeholder="Buscar por palabra clave, asesor, modelo o motivo…" value={q}
            onChange={e => { setQ(e.target.value); setPage(1); }} />
        </div>
        {q ? <button className="link-btn" onClick={() => setQ("")}>Limpiar búsqueda</button> : null}
      </div>

      <section className="card" style={{ marginBottom: 20 }}>
        <div className="card-head" style={{ marginBottom: 14, alignItems: "flex-start" }}>
          <div style={{ display: "flex", gap: 12 }}>
            <span className="sec-ic red"><Ph name="funnel" fill /></span>
            <div>
              <div style={{ fontSize: 15, fontWeight: 600 }}>Filtros</div>
              <div style={{ fontSize: 12.5, color: "var(--ink-3)" }}>Afine la búsqueda por canal, modelo o resultado</div>
            </div>
          </div>
          <button className="link-btn" style={{ display: "inline-flex", alignItems: "center", gap: 5 }} onClick={clearAll}>
            <Ph name="x" />Limpiar filtros
          </button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 14 }}>
          <FilterField label="Resultado" value={ff.resultado} onChange={v => setField("resultado", v)} options={["Todos", "Resuelto", "No resuelto"]} />
          <FilterField label="Motivo" value={ff.motivo} onChange={v => setField("motivo", v)} options={["Todos", ...MOTIVOS]} />
          <FilterField label="Punto de contacto" value={ff.canal} onChange={v => setField("canal", v)} options={["Todos", ...CANALES]} />
          <FilterField label="Modelo" value={ff.modelo} onChange={v => setField("modelo", v)} options={["Todos", ...MODELOS.map(m => m.name)]} />
          <FilterField label="Duración mín." value={ff.durMin} onChange={v => setField("durMin", v)} options={["Sin mínimo", "1 min", "3 min", "5 min", "10 min"]} />
          <FilterField label="Duración máx." value={ff.durMax} onChange={v => setField("durMax", v)} options={["Sin máximo", "5 min", "10 min", "15 min", "30 min"]} />
          <FilterField label="Desde" value={ff.desde} onChange={v => setField("desde", v)} type="date" />
          <FilterField label="Hasta" value={ff.hasta} onChange={v => setField("hasta", v)} type="date" />
          <FilterField label="Puntuación mín." value={ff.puntMin} onChange={v => setField("puntMin", v)} options={["Sin mínimo", "3/10", "5/10", "7/10", "9/10"]} />
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 18 }}>
          <button className="btn-secondary" onClick={clearAll}>Limpiar</button>
          <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6 }} onClick={() => setPage(1)}>
            <Ph name="magnifying-glass" />Aplicar filtros
          </button>
        </div>
      </section>

      {sinCoincidencia ? (
        <div className="banner-info">
          <Ph name="info" fill />
          No hay coincidencias exactas para “{q}” en la muestra de conversaciones cargada. Se muestran las conversaciones del período.
        </div>
      ) : null}

      {!empty ? (
        <div className="review-strip">
          <div className="strip-title"><Ph name="flag" fill style={{ color: "var(--red)" }} />Requieren revisión</div>
          <div className="review-cards">
            {reviews.map(r => (
              <div className={"review-card " + r.reviewSev} key={r.id} onClick={() => onOpenDetail(r)}>
                <div className="rc-top">
                  <span className="rc-reason">{r.reviewReason}</span>
                  <span className={"pill sm " + (r.reviewSev === "crit" ? "crit" : "warn")}>{r.reviewSev === "crit" ? "Crítica" : "Media"}</span>
                </div>
                <div className="rc-meta">
                  <span>{r.id}</span>·<span>{r.exec}</span>·<span>{r.fecha}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      ) : null}

      <section className="card" style={{ padding: "8px 16px 16px" }}>
        {empty ? (
          <div className="empty-state">
            <div className="es-circle"><Ph name="magnifying-glass" /></div>
            <p>No hay conversaciones con estos filtros</p>
            <span style={{ fontSize: 13, color: "var(--ink-3)" }}>Pruebe con otro rango de fechas, otra sede u otro modelo.</span>
            <button className="btn-secondary" onClick={clearAll}>Limpiar filtros</button>
          </div>
        ) : (
          <React.Fragment>
            <div style={{ display: "flex", alignItems: "center", padding: "8px 4px 4px", gap: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 12, color: "var(--ink-3)", fontWeight: 600 }}>
                2.612 conversaciones en el período · mostrando {rows.length}
              </span>
              <ExportMenu compact onExport={onExport} />
            </div>
            <div style={{ overflowX: "auto" }}>
              <table className="data">
                <thead>
                  <tr>
                    {cols.map(([key, label]) => (
                      <th key={label} onClick={() => sortBy(key)}>
                        {label}
                        {key && sort.col === key ? <span className="sort">{sort.dir === "asc" ? "▲" : "▼"}</span> : null}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map(r => (
                    <tr key={r.id} onClick={() => onOpenDetail(r)}>
                      <td>
                        <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                          <span className="avatar sm gray">{r.ini}</span>
                          <span style={{ fontWeight: 600 }}>{r.exec}</span>
                        </span>
                      </td>
                      <td>
                        <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                          <span className={"chip-canal " + canalCls(r.canal)} style={{ alignSelf: "flex-start" }}>{r.canal}</span>
                          <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{r.puesto}</span>
                        </div>
                      </td>
                      <td style={{ color: "var(--ink-2)" }}>{r.modelo}</td>
                      <td style={{ fontVariantNumeric: "tabular-nums", color: "var(--ink-2)" }}>{r.dur}</td>
                      <td style={{ color: "var(--ink-2)" }}>{r.sede}</td>
                      <td style={{ color: "var(--ink-2)" }}>{r.fecha}</td>
                      <td><span className="chip-gray">{r.motivo}</span></td>
                      <td>
                        <span className={"pill sm " + (r.resultado === "Resuelto" ? "pos" : "neg")}>
                          <span className="dot"></span>{r.resultado}
                        </span>
                      </td>
                      <td>
                        <span style={{
                          fontSize: 12, fontWeight: 600, fontVariantNumeric: "tabular-nums", borderRadius: 6, padding: "3px 8px",
                          color: r.punt >= 7 ? "var(--green)" : r.punt >= 5 ? "var(--amber)" : "var(--red)",
                          background: r.punt >= 7 ? "var(--green-bg)" : r.punt >= 5 ? "var(--amber-bg)" : "var(--red-bg)",
                        }}>{r.punt}/10</span>
                      </td>
                      <td>
                        <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12.5, color: "var(--green)", fontWeight: 500 }}>
                          <Ph name="check-circle" fill />{r.estado}
                        </span>
                      </td>
                      <td>
                        <button className="btn-secondary" style={{ fontSize: 12, padding: "5px 10px" }} onClick={e => { e.stopPropagation(); onOpenDetail(r); }}>
                          <Ph name="eye" style={{ marginRight: 4 }} />Ver
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="pagination">
              <span>Mostrando {rows.length} de 2.612 conversaciones</span>
              <div className="pag-btns">
                <button className="pag-btn" disabled={page === 1} onClick={() => setPage(p => p - 1)}>‹</button>
                {[1, 2, 3].map(n => (
                  <button key={n} className={"pag-btn" + (page === n ? " active" : "")} onClick={() => setPage(n)}>{n}</button>
                ))}
                <span style={{ alignSelf: "center", padding: "0 4px" }}>…</span>
                <button className="pag-btn" onClick={() => setPage(202)}>202</button>
                <button className="pag-btn" onClick={() => setPage(p => p + 1)}>›</button>
              </div>
            </div>
          </React.Fragment>
        )}
      </section>
    </React.Fragment>
  );
}

/* ══════════════════════════════════════════════════════════════════════
   Casos de conversación: la muestra incluye tres escenarios reales del
   negocio, ninguno bancario. Se elige según el punto de contacto.
   1) Tienda — cliente que quiere portarse a Numia: sondeo de uso,
      comparación con la competencia y verificación de DNI.
   2) Soporte técnico — reclamo de garantía por un equipo que no enciende
      y termina en repuesto sin fecha de llegada.
   3) Seguimiento (WhatsApp / call center) — reclamo por una activación
      de portabilidad que no se cumplió en el plazo prometido.
   ══════════════════════════════════════════════════════════════════════ */

function Waveform({ progress, onSeek }) {
  const bars = React.useMemo(() => Array.from({ length: 90 }, (_, i) => 0.25 + Math.abs(Math.sin(i * 0.55)) * 0.6 + (i % 7 === 0 ? 0.15 : 0)), []);
  return (
    <div className="waveform" onClick={e => {
      const r = e.currentTarget.getBoundingClientRect();
      onSeek((e.clientX - r.left) / r.width);
    }}>
      <svg viewBox="0 0 90 40" preserveAspectRatio="none" style={{ width: "100%", height: "100%", display: "block" }}>
        {bars.map((b, i) => (
          <rect key={i} x={i + 0.15} width="0.7" y={(1 - b) * 20} height={b * 40} rx="0.35"
            fill={i / 90 <= progress ? "var(--purple)" : "#DDD6EC"}></rect>
        ))}
      </svg>
    </div>
  );
}

}

  const matches = [];
  if (q.length >= 2) {
    caso.transcript.forEach((b, bi) => b.parts.forEach((p, pi) => {

      while (idx !== -1) { matches.push({ bi, pi, idx }); idx = p.x.toLowerCase().indexOf(q.toLowerCase(), idx + 1); }
    }));
  }
  const curMatch = matches.length ? matches[((matchIdx % matches.length) + matches.length) % matches.length] : null;
  useEffect(() => {
    if (!curMatch || !txRef.current) return;
    const el = txRef.current.querySelector(".hl-search.current");

  }, [q, matchIdx]);

  const renderPart = (p, bi, pi) => {
    let content = p.x;
    if (q.length >= 2) {
      const pieces = [];
      let last = 0;
      const lower = p.x.toLowerCase(), ql = q.toLowerCase();
      let idx = lower.indexOf(ql);
      while (idx !== -1) {

        pieces.push(<mark key={idx} className={"hl-search" + (isCur ? " current" : "")}>{p.x.slice(idx, idx + q.length)}</mark>);
        last = idx + q.length;
        idx = lower.indexOf(ql, last);

      if (last < p.x.length) pieces.push(p.x.slice(last));

                  <td style={{ color: "var(--green)", fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{fmtNum(a.resueltas)}</td>

  );
}

<script type="text/babel" data-presets="react">

/* ══════════ Modelo de datos ══════════ */

  { k: "avgProductos", n: "Promedio de productos ofrecidos", f: "B", t: "promedio", field: "productos", dec: 1 },
  { k: "avgSeller", n: "sellerScore promedio", f: "B", t: "promedio", field: "sellerScore", dec: 1, unit: "/10" },

  { k: "pBienvenida", n: "% Bienvenida", f: "C", t: "tasa", p: 0.58 },
  { k: "pPresentacion", n: "% Presentación", f: "C", t: "tasa", p: 0.44 },
  { k: "pPersonalizacion", n: "% Personalización", f: "C", t: "tasa", p: 0.37 },
  { k: "pDespedida", n: "% Despedida con nombre", f: "C", t: "tasa", p: 0.29 },
  { k: "pConsultaAdic", n: "% Consulta adicional", f: "C", t: "tasa", p: 0.33 },
  { k: "pFraseCierre", n: "% Frase de cierre", f: "C", t: "tasa", p: 0.26 },

  { k: "pCumpl6", n: "% Cumplimiento total 6/6", f: "C", t: "tasa", p: 0.08 },
  { k: "pEscucha", n: "% con escucha activa", f: "C", t: "tasa", p: 0.13 },

  { k: "pSencillo", n: "% “no hay sencillo”", f: "D", t: "tasa", p: 0.03, neg: true, soloCaja: true },
  { k: "pCambio", n: "% “no hay cambio”", f: "D", t: "tasa", p: 0.02, neg: true, soloCaja: true },

  { k: "pCentral", n: "% derivado a central", f: "D", t: "tasa", p: 0.02, neg: true },
  { k: "pCobros", n: "% derivado a cobros", f: "D", t: "tasa", p: 0.02, neg: true },
  { k: "pSupervisor", n: "% esperó supervisor", f: "D", t: "tasa", p: 0.05, neg: true },
  { k: "pDigital", n: "% promovió canal digital", f: "D", t: "tasa", p: 0.033 },

  { k: "pQueja", n: "% atenciones con queja", f: "E", t: "tasa", p: 0.05, neg: true },
  { k: "pQuejaRes", n: "% quejas resueltas", f: "E", t: "tasa", p: 0.41 },

  { k: "pPositivo", n: "% sentimiento positivo", f: "F", t: "tasa", p: 0.14 },
  { k: "pNegativo", n: "% sentimiento negativo", f: "F", t: "tasa", p: 0.03, neg: true },
  { k: "pFelicitaciones", n: "% felicitaciones explícitas", f: "F", t: "tasa", p: 0.05 },

  { k: "avgConfidence", n: "analysisConfidence promedio", f: "G", t: "promedio", field: "confidence", dec: 2 },
  { k: "pConfBajo", n: "% con confidence bajo", f: "G", t: "tasa", p: 0.07 },
  { k: "pNoInterp", n: "% no interpretables", f: "G", t: "tasa", p: 0.11 },
  { k: "pNoPresento", n: "% “no se presentó”", f: "G", t: "tasa", p: 0.04 },
];
const RB_M = {};
RB_MEAS.forEach(m => { RB_M[m.k] = m; });

/* Dataset sintético determinista */
const RB_ROWS = (() => {
  let s = 20260803;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const out = [];
  for (let i = 0; i < 2334; i++) {
    const canal = rnd() < 0.76 ? "Caja" : "SAC";
    const suc = pick(RB_DIM.suc.vals);
    // la última agencia solo opera Caja en el período — genera combinaciones sin datos
    if (suc === RB_DIM.suc.vals[3] && canal === "SAC") continue;
    const skill = 0.7 + rnd() * 0.6;
    const r = {
      suc, canal, agente: pick(RB_DIM.agente.vals), periodo: pick(RB_DIM.periodo.vals),
      resolucion: pick(RB_DIM.resolucion.vals), resultado: pick(RB_DIM.resultado.vals),
      motivo: pick(RB_DIM.motivo.vals), motivoNoRes: pick(RB_DIM.motivoNoRes.vals),
      tipoQueja: pick(RB_DIM.tipoQueja.vals), sentimiento: rnd() < 0.14 ? "Positivo" : rnd() < 0.9 ? "Neutro" : "Negativo",
      etapaDebil: pick(RB_DIM.etapaDebil.vals), producto: pick(RB_DIM.producto.vals),
      objecion: pick(RB_DIM.objecion.vals), fortaleza: pick(RB_DIM.fortaleza.vals),
      productos: Math.round(rnd() * 2 * skill * 10) / 10,
      sellerScore: Math.max(1, Math.min(10, Math.round(2 + rnd() * 5 * skill))),
      protocolo: Math.round(20 + rnd() * 55 * skill),
      confidence: Math.round((0.55 + rnd() * 0.44) * 100) / 100,
      interpretable: rnd() > 0.11,
      flags: {},
    };
    r.scoreBucket = r.sellerScore <= 2 ? "1–2" : r.sellerScore <= 4 ? "3–4" : r.sellerScore <= 6 ? "5–6" : r.sellerScore <= 8 ? "7–8" : "9–10";
    RB_MEAS.forEach(m => { if (m.t === "tasa") r.flags[m.k] = rnd() < m.p * (m.neg ? 2 - skill : skill); });
    r.flags.conflictivo = rnd() < 0.006;
    out.push(r);
  }
  return out;
})();

/* ══════════ Cálculo ══════════ */
const rbNum = (v, dec) => v.toLocaleString("es-PE", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });

function rbValue(m, rows, base) {
  const den = base === "interpretables" ? rows.filter(r => r.interpretable) : rows;
  if (!rows.length) return null;
  if (m.t === "conteo") return m.flag ? rows.filter(r => r.flags[m.flag]).length : rows.length;
  if (m.t === "tasa") return den.length ? (den.filter(r => r.flags[m.k]).length / den.length) * 100 : null;
  if (m.t === "promedio") return den.length ? den.reduce((a, r) => a + r[m.field], 0) / den.length : null;
  return den.length; // distribución / ranking se resuelven por dimensión
}
function rbFmt(m, v) {
  if (v == null) return "—";
  if (m.t === "conteo" || m.t === "distribucion" || m.t === "ranking") return rbNum(v, 0);
  if (m.t === "tasa") return rbNum(v, 1) + "%";
  return rbNum(v, m.dec) + (m.unit || "");
}

/* ══════════ Helpers de vista ══════════ */
const RB_TYPE_ICON = { conteo: "hash", tasa: "percent", promedio: "chart-line-up", distribucion: "chart-donut", ranking: "list-numbers" };
const RB_TYPE_LABEL = { conteo: "conteo", tasa: "tasa %", promedio: "promedio", distribucion: "distribución", ranking: "ranking" };
const RB_VIZ = [
  { k: "pivot", n: "Tabla", icon: "table", help: "Filas y columnas con los valores exactos." },
  { k: "barra", n: "Barra", icon: "chart-bar-horizontal", help: "Compara magnitudes entre grupos." },
  { k: "linea", n: "Línea", icon: "chart-line", help: "Evolución en el tiempo." },
  { k: "kpi", n: "KPI", icon: "square", help: "Un solo número grande." },
];
const RB_PALETTE = ["var(--purple)", "#0072B2", "#56B4E9", "#E69F00", "#CC79A7"];

const rbFilter = gf => RB_ROWS.filter(r =>
  (!gf.sucs || !gf.sucs.length || gf.sucs.indexOf(r.suc) >= 0) &&
  (!gf.agentes || !gf.agentes.length || gf.agentes.indexOf(r.agente) >= 0) &&
  (gf.canal === "Todos" || r.canal === gf.canal));

function rbValidViz(cfg) {
  const v = ["pivot"];
  if (cfg.rowDims.length === 1) v.push("barra");
  if (cfg.rowDims.length === 1 && ["periodo", "mes"].indexOf(cfg.rowDims[0].k) >= 0 && cfg.meas.length === 1) v.push("linea");
  if (!cfg.rowDims.length && cfg.meas.length === 1) v.push("kpi");
  return v;
}
function rbRecommended(cfg) {
  if (!cfg.rowDims.length && cfg.meas.length === 1) return "kpi";
  if (cfg.rowDims.length === 1 && ["periodo", "mes"].indexOf(cfg.rowDims[0].k) >= 0 && cfg.meas.length === 1) return "linea";
  if (cfg.rowDims.length === 1 && cfg.meas.length === 1) return "barra";
  return "pivot";
}
const rbEffViz = cfg => {
  const valid = rbValidViz(cfg);
  return cfg.viz && valid.indexOf(cfg.viz) >= 0 ? cfg.viz : rbRecommended(cfg);
};
const rbInvalid = cfg => cfg.meas.length > 1 && cfg.colDims.length > 0;
const rbNaMeas = (cfg, gf) => cfg.meas.filter(k => RB_M[k].soloCaja && gf.canal === "SAC").map(k => RB_M[k]);

function rbPivot(rows, cfg, base) {
  if (!rows.length || !cfg.meas.length) return null;
  const rd = cfg.rowDims.map(d => d.k);
  const limit = (vals, topN) => topN === "Todos" ? vals : vals.slice(0, parseInt(String(topN).replace("Top ", ""), 10));
  const combos = [];
  const walk = (i, acc) => {
    if (i === rd.length) { combos.push(acc); return; }
    const d = cfg.rowDims[i];
    const counts = {}, score = {};
    const M0 = RB_M[cfg.meas[0]];
    RB_DIM[d.k].vals.forEach(v => {
      const sub = rows.filter(r => r[d.k] === v && acc.every((a, j) => r[rd[j]] === a));
      counts[v] = sub.length;
      score[v] = sub.length ? (rbValue(M0, sub, base) || 0) : -Infinity;
    });
    limit(RB_DIM[d.k].vals.slice().filter(v => counts[v] > 0).sort((a, b) => score[b] - score[a]), d.topN).forEach(v => walk(i + 1, [...acc, v]));
  };
  if (rd.length) walk(0, []); else combos.push([]);
  const cd = cfg.colDims[0];
  const colVals = cd ? limit(RB_DIM[cd.k].vals.filter(v => rows.some(r => r[cd.k] === v)), cd.topN) : [null];
  const body = combos.map(c => {
    const subset = rows.filter(r => c.every((v, j) => r[rd[j]] === v));
    return {
      combo: c, subset,
      cells: colVals.map(cv => cfg.meas.map(k => rbValue(RB_M[k], cv == null ? subset : subset.filter(r => r[cd.k] === cv), base))),
    };
  }).filter(b => b.subset.length > 0);
  return { colVals, body, cd };
}

/* ══════════ Estados ══════════ */
function RbSkeleton() {
  return (
    <div style={{ padding: 4 }}>
      {[0, 1, 2, 3, 4, 5].map(i => (
        <div key={i} style={{ height: 28, marginBottom: 8, borderRadius: 6, background: "linear-gradient(90deg,#F0F0F3 25%,#F7F7F9 50%,#F0F0F3 75%)", backgroundSize: "200% 100%", animation: "rb-shimmer 1.6s linear infinite", opacity: 1 - i * 0.11 }}></div>
      ))}
    </div>
  );
}
function RbMsg({ icon, title, body, tone, action }) {
  const c = tone === "warn" ? "var(--amber)" : tone === "error" ? "var(--red)" : "var(--purple)";
  const bg = tone === "warn" ? "var(--amber-bg)" : tone === "error" ? "var(--red-bg)" : "var(--purple-soft)";
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 11, padding: "60px 32px", textAlign: "center" }}>
      <span style={{ width: 44, height: 44, borderRadius: 12, background: bg, color: c, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 21 }}>
        <i className={"ph ph-" + icon}></i>
      </span>
      <div style={{ fontSize: 15, fontWeight: 600 }}>{title}</div>
      <div style={{ fontSize: 13, color: "var(--ink-3)", maxWidth: 400, lineHeight: 1.55 }}>{body}</div>
      {action || null}
    </div>

}

/* ══════════ Render de una visualización ══════════ */
function RbView({ cfg, gf: gfIn, base, height }) {
  const gf = useMemoR(() => (cfg.canal ? { ...gfIn, canal: cfg.canal } : gfIn), [gfIn, cfg.canal]);
  const rows = useMemoR(() => rbFilter(gf), [gf]);
  useEffectR(() => { window.__rbOpenGallery = () => setGallery(true); return () => { delete window.__rbOpenGallery; }; }, []);
  const pivot = useMemoR(() => rbPivot(rows, cfg, base), [rows, cfg, base]);
  const na = rbNaMeas(cfg, gf);
  const naAll = na.length === cfg.meas.length && cfg.meas.length > 0;
  if (!cfg.meas.length) return <RbMsg icon="ruler" title="Seleccione una métrica" body="Indique qué desea medir —por ejemplo, el porcentaje de atenciones resueltas— y el gráfico se calcula solo." />;
  if (rbInvalid(cfg)) return <RbMsg tone="error" icon="warning-circle" title="Esta combinación no se puede mostrar" body="No se pueden ver varias métricas y un segundo corte al mismo tiempo: la tabla quedaría con dos ejes de números. Deje una sola métrica o quite el cruce." />;
  if (!rows.length) return <RbMsg tone="warn" icon="database" title="No hay atenciones con estos filtros" body="La combinación de agencia, usuario y tipo de atención no registró atenciones en el período. Amplíe el rango de fechas o quite un filtro." />;
  if (naAll) return <RbMsg tone="warn" icon="info" title="Las métricas elegidas no aplican a SAC" body="Las fricciones de caja (sistema caído, falta de sencillo o de cambio) solo se detectan en atenciones de ventanilla. Modifique el filtro de canal o seleccione otra métrica." />;
  const viz = rbEffViz(cfg);
  const M0 = RB_M[cfg.meas[0]];

  if (viz === "kpi") {
    return (
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", padding: "26px 4px" }}>
        {cfg.meas.map(k => {
          const M = RB_M[k], no = M.soloCaja && gf.canal === "SAC";
          return (
            <div key={k} style={{ flex: "1 1 200px" }}>
              <div style={{ fontSize: 12.5, color: "var(--ink-3)", marginBottom: 8 }}>{M.n}</div>
              <div style={{ fontSize: 40, fontWeight: 600, letterSpacing: "-0.02em", color: no ? "var(--ink-3)" : M.alerta ? "var(--red)" : "var(--ink)", fontVariantNumeric: "tabular-nums" }}>
                {no ? "N/A" : rbFmt(M, rbValue(M, rows, base))}
              </div>
              <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 6 }}>{rbNum(rows.length, 0)} atenciones</div>
            </div>
          );
        })}
      </div>
    );
  }
  if (viz === "linea") {
    const pts = pivot.body.map(b => ({ x: b.combo.join(" "), v: b.cells[0][0] || 0 }));
    const mx = Math.max.apply(null, pts.map(p => p.v)) * 1.15 || 1;
    const W = 760, H = height || 250, x0 = 46, x1 = 744, y0 = H - 40, yT = 14;
    const X = i => x0 + (i * (x1 - x0)) / Math.max(1, pts.length - 1);
    const Y = v => y0 - (v / mx) * (y0 - yT);
    return (
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto", display: "block" }}>
        {[0, 0.25, 0.5, 0.75, 1].map(f => (
          <g key={f}>
            <line x1={x0} y1={Y(mx * f)} x2={x1} y2={Y(mx * f)} stroke="rgba(26,26,46,0.07)"></line>
            <text x={x0 - 10} y={Y(mx * f) + 4} textAnchor="end" style={{ fontSize: 11, fill: "var(--ink-3)" }}>{rbNum(mx * f, 0)}</text>
          </g>
        ))}
        <path d={pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(p.v).toFixed(1)).join(" ")} fill="none" stroke="var(--purple)" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"></path>
        {pts.map((p, i) => <circle key={p.x} cx={X(i)} cy={Y(p.v)} r="3.5" fill="var(--purple)" stroke="#fff" strokeWidth="1.5"><title>{p.x}: {rbFmt(M0, p.v)}</title></circle>)}
        {pts.map((p, i) => <text key={"l" + p.x} x={X(i)} y={y0 + 22} textAnchor="middle" style={{ fontSize: 11, fill: "var(--ink-3)" }}>{p.x}</text>)}
      </svg>
    );
  }
  if (viz === "barra") {
    const stacked = cfg.colDims.length && cfg.apilar;
    const maxV = Math.max.apply(null, pivot.body.map(b => stacked ? b.cells.reduce((a, c) => a + (c[0] || 0), 0) : (b.cells[0][0] || 0))) || 1;
    return (
      <div>
        {pivot.body.map(b => {
          const tot = b.cells.reduce((a, c) => a + (c[0] || 0), 0);
          return (
            <div key={b.combo.join("|")} style={{ display: "grid", gridTemplateColumns: "minmax(110px,200px) 1fr 76px", alignItems: "center", gap: 12, padding: "5px 0" }}>
              <span style={{ fontSize: 12.5, color: "var(--ink-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.combo.join(" · ") || "Total"}</span>
              <div style={{ display: "flex", height: 18, borderRadius: 4, overflow: "hidden", background: "var(--bg)" }}>
                {stacked ? b.cells.map((c, i) => (
                  <div key={i} title={pivot.colVals[i] + ": " + rbFmt(M0, c[0])} style={{ width: ((c[0] || 0) / maxV * 100) + "%", background: RB_PALETTE[i % RB_PALETTE.length] }}></div>
                )) : (
                  <div style={{ width: Math.max(1, (b.cells[0][0] || 0) / maxV * 100) + "%", background: "var(--purple)", borderRadius: 4, transition: "width .28s cubic-bezier(0.4,0,0.2,1)" }}></div>
                )}
              </div>
              <span style={{ fontSize: 12.5, fontWeight: 600, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{rbFmt(M0, stacked ? tot : b.cells[0][0])}</span>
            </div>
          );
        })}
        {stacked ? (
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 12, paddingTop: 10, borderTop: "1px solid var(--border)" }}>
            {pivot.colVals.map((v, i) => (
              <span key={v} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--ink-2)" }}>
                <span style={{ width: 9, height: 9, borderRadius: 2, background: RB_PALETTE[i % RB_PALETTE.length] }}></span>{v}
              </span>
            ))}
          </div>
        ) : null}
      </div>
    );
  }
  return (
    <div style={{ overflowX: "auto" }}>
      <table className="data" style={{ width: "100%", fontSize: 12.5, borderCollapse: "collapse" }}>
        <thead>
          {pivot.cd ? (
            <tr>
              {cfg.rowDims.map(d => <th key={d.k} rowSpan="2" style={{ whiteSpace: "nowrap", verticalAlign: "bottom" }}>{RB_DIM[d.k].n}</th>)}
              {pivot.colVals.map(cv => <th key={cv} colSpan={cfg.meas.length} style={{ textAlign: "center", whiteSpace: "nowrap", borderLeft: "1px solid var(--border)" }}>{cv}</th>)}
            </tr>
          ) : null}
          <tr>
            {!pivot.cd ? cfg.rowDims.map(d => <th key={d.k} style={{ whiteSpace: "nowrap" }}>{RB_DIM[d.k].n}</th>) : null}
            {pivot.colVals.map(cv => cfg.meas.map(k => (
              <th key={String(cv) + k} style={{ textAlign: "right", whiteSpace: "nowrap" }}>{RB_M[k].n}</th>
            )))}
          </tr>
        </thead>
        <tbody>
          {pivot.body.map(b => (
            <tr key={b.combo.join("|")}>
              {b.combo.map((v, i) => <td key={i} style={{ fontWeight: i === 0 ? 500 : 400, whiteSpace: "nowrap" }}>{v}</td>)}
              {b.cells.map((cell, ci) => cell.map((v, mi) => {
                const M = RB_M[cfg.meas[mi]], no = M.soloCaja && gf.canal === "SAC";
                return <td key={ci + "-" + mi} style={{ textAlign: "right", fontVariantNumeric: "tabular-nums", color: no ? "var(--ink-3)" : M.alerta && v > 0 ? "var(--red)" : "var(--ink-2)", borderLeft: ci > 0 && mi === 0 ? "1px solid var(--border)" : "none" }}>{no ? "N/A" : rbFmt(M, v)}</td>;
              }))}
            </tr>
          ))}
          <tr style={{ borderTop: "2px solid var(--border)", fontWeight: 600 }}>
            {cfg.rowDims.map((d, i) => <td key={d.k}>{i === 0 ? "Total" : ""}</td>)}
            {pivot.colVals.map((cv, ci) => cfg.meas.map((k, mi) => {
              const M = RB_M[k], no = M.soloCaja && gf.canal === "SAC";
              const sub = cv == null ? rows : rows.filter(r => r[pivot.cd.k] === cv);
              return <td key={ci + "-" + mi} style={{ textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{no ? "N/A" : rbFmt(M, rbValue(M, sub, base))}</td>;
            }))}
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* ══════════ Controles ══════════ */
const rbSelStyle = { width: "100%", height: 36, padding: "0 10px", borderRadius: 8, border: "1px solid var(--border)", background: "var(--bg)", fontFamily: "inherit", fontSize: 13, color: "var(--ink)", cursor: "pointer" };

function RbDimSelect({ value, onChange, placeholder, disabled, exclude }) {
  return (
    <select value={value || ""} disabled={disabled} onChange={e => onChange(e.target.value || null)} style={{ ...rbSelStyle, opacity: disabled ? 0.5 : 1, cursor: disabled ? "not-allowed" : "pointer" }}>
      <option value="">{placeholder}</option>
      {["Globales", "Del análisis"].map(g => (
        <optgroup key={g} label={g}>
          {RB_DIMS.filter(d => d.g === g && !d.hidden && (exclude || []).indexOf(d.k) < 0).map(d => <option key={d.k} value={d.k}>{d.n}</option>)}
        </optgroup>
      ))}
    </select>
  );
}
function RbMeasSelect({ value, onChange, exclude }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)} style={rbSelStyle}>
      {RB_FAMS.map(f => (
        <optgroup key={f.k} label={f.n + (f.k === "G" ? " (diagnóstico)" : "")}>
          {RB_MEAS.filter(m => m.f === f.k && (m.k === value || (exclude || []).indexOf(m.k) < 0)).map(m => <option key={m.k} value={m.k}>{m.n}</option>)}
        </optgroup>
      ))}
    </select>
  );
}
function RbSection({ title, count, help, children, right }) {
  return (
    <div style={{ borderTop: "1px solid var(--border)", padding: "16px 0" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: help ? 4 : 10 }}>

      {help ? <div style={{ fontSize: 12, color: "var(--ink-3)", lineHeight: 1.5, marginBottom: 10 }}>{help}</div> : null}
      {children}
    </div>

}
function RbSegmented({ value, options, onChange }) {
  return (
    <div style={{ display: "inline-flex", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 8, padding: 2 }}>
      {options.map(o => (

          style={{ border: "none", borderRadius: 6, padding: "5px 12px", fontFamily: "inherit", fontSize: 12, fontWeight: value === o.k ? 600 : 400, cursor: "pointer", background: value === o.k ? "var(--card)" : "transparent", color: value === o.k ? "var(--ink)" : "var(--ink-3)", boxShadow: value === o.k ? "0 1px 2px rgba(18,18,23,0.06)" : "none" }}>{o.n}</button>
      ))}

/* ══════════ Chart builder (patrón Intercom) ══════════ */
function RbChartBuilder({ initial, gf, base, onBase, onCancel, onSave }) {
  const [cfg, setCfg] = useStateR(initial);
  const [loading, setLoading] = useStateR(false);
  const key = JSON.stringify([cfg.meas, cfg.rowDims, cfg.colDims, cfg.apilar, base]);
  useEffectR(() => { setLoading(true); const t = setTimeout(() => setLoading(false), 300); return () => clearTimeout(t); }, [key]);
  useEffectR(() => {
    const onKey = e => { if (e.key === "Escape") onCancel(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, []);
  const set = p => setCfg(c => ({ ...c, ...p }));
  const valid = rbValidViz(cfg), rec = rbRecommended(cfg), eff = rbEffViz(cfg);
  const rowDim = cfg.rowDims[0] ? cfg.rowDims[0].k : null;
  const colDim = cfg.colDims[0] ? cfg.colDims[0].k : null;
  const colBlocked = cfg.meas.length > 1;
  const invalid = rbInvalid(cfg);
  const autoName = cfg.meas.length ? RB_M[cfg.meas[0]].n + (rowDim ? " por " + RB_DIM[rowDim].n.toLowerCase() : "") : "";

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 220, background: "rgba(10,12,17,0.5)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }} onClick={onCancel}>
      <div onClick={e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Constructor de gráfico"
        style={{ width: "100%", height: "100%", maxWidth: 1340, background: "#fff", borderRadius: 14, boxShadow: "0 28px 70px rgba(10,12,17,0.32)", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {/* header */}
        <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 22px 14px" }}>
          <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 8 }}>
            <input value={cfg.name} onChange={e => set({ name: e.target.value })} placeholder="Escriba un nombre para este gráfico"
              style={{ width: 340, maxWidth: "100%", border: "none", borderBottom: "1px dashed transparent", padding: "2px 0", fontFamily: "inherit", fontSize: 19, fontWeight: 600, color: "var(--ink)", background: "transparent" }}
              onFocus={e => { e.target.style.borderBottomColor = "var(--border)"; }} onBlur={e => { e.target.style.borderBottomColor = "transparent"; }} />
            <i className="ph ph-pencil-simple" aria-hidden="true" style={{ fontSize: 15, color: "var(--ink-3)", flexShrink: 0 }}></i>
          </div>
          <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
            <button className="btn-secondary" onClick={onCancel}>Cancelar</button>
            <button className="btn-primary" disabled={!cfg.meas.length || invalid}
              style={{ opacity: (!cfg.meas.length || invalid) ? 0.5 : 1, cursor: (!cfg.meas.length || invalid) ? "not-allowed" : "pointer" }}
              onClick={() => onSave({ ...cfg, name: cfg.name || autoName, viz: eff })}>
              {initial.saved ? "Guardar cambios" : "Agregar gráfico"}
            </button>
          </div>
        </div>

        <div style={{ flex: 1, minHeight: 0, display: "grid", gridTemplateColumns: "minmax(0,1fr) 380px", borderTop: "1px solid var(--border)" }}>
          {/* izquierda: tipos + preview */}
          <div style={{ overflowY: "auto", padding: "16px 22px 26px" }}>
            <section className="card" style={{ minHeight: 330 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                <span style={{ fontSize: 14.5, fontWeight: 600 }}>{cfg.name || autoName || "Gráfico sin título"}</span>
              </div>
              {loading ? <RbSkeleton /> : <RbView cfg={cfg} gf={gf} base={base} />}
            </section>
          </div>

          {/* derecha: configuración */}
          <div style={{ borderLeft: "1px solid var(--border)", overflowY: "auto", padding: "14px 20px 30px" }}>
            <React.Fragment>
                <RbSection title={<React.Fragment>Tipo de visualización <InfoDot text="Cómo se dibuja el resultado. Tabla para leer los valores exactos, barra para comparar agencias o usuarios, línea para ver la evolución en el tiempo y KPI para un único número. Solo se habilitan las opciones que sirven para lo que eligió; el punto marca la sugerida." /></React.Fragment>}>
                  <div style={{ display: "inline-flex", gap: 2, background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 10, padding: 3 }}>
                    {RB_VIZ.map(v => {
                      const ok = valid.indexOf(v.k) >= 0, on = eff === v.k;
                      return (
                        <button key={v.k} disabled={!ok} onClick={() => set({ viz: v.k })}
                          title={ok ? v.n + (v.k === rec ? " · recomendada" : "") : v.n + " — no aplica a los campos elegidos"}
                          style={{ display: "inline-flex", alignItems: "center", gap: 6, height: 32, padding: "0 11px", border: "none", borderRadius: 7, fontFamily: "inherit", fontSize: 12, fontWeight: on ? 600 : 400, cursor: ok ? "pointer" : "not-allowed", background: on ? "var(--card)" : "transparent", boxShadow: on ? "0 1px 2px rgba(18,18,23,0.08)" : "none", color: on ? "var(--purple)" : "var(--ink-3)", opacity: ok ? 1 : 0.4, position: "relative" }}>
                          <i className={"ph ph-" + v.icon} style={{ fontSize: 15 }}></i>{v.n}
                          {ok && v.k === rec ? <span style={{ position: "absolute", top: 4, right: 4, width: 4, height: 4, borderRadius: "50%", background: "var(--purple)" }}></span> : null}
                        </button>
                      );
                    })}
                  </div>
                </RbSection>

                <RbSection title={<React.Fragment>Métricas <InfoDot text="Qué se quiere medir: por ejemplo, cuántas atenciones hubo, qué porcentaje se resolvió o el promedio de cumplimiento de protocolo. Puede sumar hasta 3 métricas para verlas juntas." /></React.Fragment>} count={cfg.meas.length}>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {cfg.meas.map((k, i) => (
                      <div key={i} style={{ border: "1px solid var(--border)", borderRadius: 10, padding: 12 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                          <i className={"ph ph-" + RB_TYPE_ICON[RB_M[k].t]} style={{ fontSize: 14, color: "var(--purple)" }}></i>
                          <span style={{ fontSize: 12.5, fontWeight: 600 }}>{RB_TYPE_LABEL[RB_M[k].t]}</span>
                          {cfg.meas.length > 1 ? (
                            <button onClick={() => set({ meas: cfg.meas.filter((_, j) => j !== i) })} aria-label="Quitar métrica"
                              style={{ marginLeft: "auto", border: "none", background: "none", cursor: "pointer", color: "var(--ink-3)", padding: 0 }}>
                              <i className="ph ph-x" style={{ fontSize: 13 }}></i>
                            </button>
                          ) : null}
                        </div>
                        <RbMeasSelect value={k} exclude={cfg.meas} onChange={v => set({ meas: cfg.meas.map((x, j) => j === i ? v : x) })} />
                        {RB_M[k].soloCaja ? <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 7 }}>Solo se detecta en atenciones de Caja.</div> : null}
                      </div>
                    ))}
                  </div>
                  {cfg.meas.length < 3 ? (
                    <button onClick={() => set({ meas: cfg.meas.concat(RB_MEAS.filter(m => cfg.meas.indexOf(m.k) < 0)[0].k), colDims: [] })}
                      style={{ display: "inline-flex", alignItems: "center", gap: 6, border: "none", background: "none", fontFamily: "inherit", fontSize: 12.5, fontWeight: 500, color: "var(--purple)", cursor: "pointer", padding: "10px 0 0" }}>
                      <i className="ph ph-plus" style={{ fontSize: 13 }}></i>Agregar métrica
                    </button>
                  ) : null}
                </RbSection>

                <RbSection title={<React.Fragment>Ver por <InfoDot text="Cómo se divide el resultado. Si elige Agencia, obtiene una línea por agencia; si elige Usuario, una por cada ejecutivo. Si no elige nada, ve el total de toda la operación." /></React.Fragment>}>
                  <RbDimSelect value={rowDim} exclude={colDim ? [colDim] : []} placeholder="Sin agrupación (total general)"
                    onChange={v => set({ rowDims: v ? [{ k: v, topN: cfg.rowDims[0] ? cfg.rowDims[0].topN : "Todos" }] : [] })} />
                  {rowDim && RB_TEMPORAL.indexOf(rowDim) >= 0 ? (
                    <div style={{ marginTop: 10 }}>
                      <RbSegmented value={rowDim} options={[{ k: "periodo", n: "Semana" }, { k: "mes", n: "Mes" }]}
                        onChange={v => set({ rowDims: [{ k: v, topN: "Todos" }] })} />
                    </div>
                  ) : null}
                  {rowDim ? (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
                      <span style={{ fontSize: 12, color: "var(--ink-3)" }}>Mostrar</span>
                      <select value={cfg.rowDims[0].topN} onChange={e => set({ rowDims: [{ ...cfg.rowDims[0], topN: e.target.value }] })}
                        style={{ ...rbSelStyle, width: "auto", height: 30, fontSize: 12 }}>
                        {RB_TOP_OPTS.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>
                  ) : null}
                </RbSection>

                <RbSection title={<React.Fragment>Cruzar por <InfoDot text="Un segundo corte, para comparar en paralelo: por ejemplo, ver cada agencia separada en Caja y SAC, o por sentimiento del cliente. Es opcional." /></React.Fragment>}>
                  <RbDimSelect value={colDim} disabled={colBlocked} exclude={rowDim ? [rowDim] : []} placeholder="Sin cruce"
                    onChange={v => set({ colDims: v ? [{ k: v, topN: "Top 5" }] : [] })} />
                  {colBlocked ? (
                    <div style={{ display: "flex", gap: 7, background: "var(--amber-bg)", color: "var(--amber)", borderRadius: 8, padding: "9px 11px", fontSize: 11.5, lineHeight: 1.45, marginTop: 9 }}>
                      <i className="ph ph-info" style={{ fontSize: 14, flexShrink: 0, marginTop: 1 }}></i>
                      <span>Deje una sola métrica para habilitar el cruce por columnas.</span>
                    </div>
                  ) : null}
                  {colDim && eff === "barra" ? (
                    <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: "var(--ink-2)", cursor: "pointer", marginTop: 10 }}>
                      <input type="checkbox" checked={!!cfg.apilar} onChange={e => set({ apilar: e.target.checked })} />
                      Apilar las barras
                    </label>
                  ) : null}
                </RbSection>
              <RbSection title={<React.Fragment>Canal de atención <InfoDot text="Por defecto el gráfico usa el canal elegido en los filtros del reporte. Puede fijarlo a Caja o SAC si este gráfico en particular solo aplica a uno de los dos." /></React.Fragment>}>
                <RbSegmented value={cfg.canal || "reporte"} onChange={v => set({ canal: v === "reporte" ? null : v })}
                  options={[{ k: "reporte", n: "Según el reporte" }, { k: "Todos", n: "Caja y SAC" }, { k: "Caja", n: "Caja" }, { k: "SAC", n: "SAC" }]} />
              </RbSection>

              <RbSection title={<React.Fragment>Base de cálculo <InfoDot text="Sobre qué universo se calculan los porcentajes. Algunas atenciones no se pueden analizar porque el audio quedó inaudible o demasiado corto. “Todas” las cuenta e incluirlas baja los porcentajes; “Solo interpretables” mide únicamente las conversaciones que el análisis sí pudo escuchar. Se aplica a todo el reporte." /></React.Fragment>}>
                <RbSegmented value={base} onChange={onBase} options={[{ k: "todas", n: "Todas" }, { k: "interpretables", n: "Solo interpretables" }]} />
              </RbSection>
            </React.Fragment>
          </div>
        </div>
      </div>
    </div>
  );
}

function RbThumb({ viz }) {

}

function RbGallery({ onClose, onCustom, onPreset }) {
  const [q, setQ] = useStateR("");
  const [type, setType] = useStateR("Todos");
  useEffectR(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);
  const typeOf = p => p.viz === "kpi" ? "KPI" : p.viz === "linea" ? "Línea" : p.viz === "pivot" ? "Tabla" : "Barra";
  // cualquier métrica se puede ver como tabla: al filtrar por “Tabla” se ofrecen todas en esa vista
  const source = type === "Tabla" ? RB_PRESETS.map(p => ({ ...p, viz: "pivot", width: p.col ? "full" : p.width })) : RB_PRESETS;
  const list = source.filter(p => (type === "Todos" || type === "Tabla" || typeOf(p) === type) && (!q || p.name.toLowerCase().indexOf(q.toLowerCase()) >= 0 || p.fam.toLowerCase().indexOf(q.toLowerCase()) >= 0));
  const fams = RB_FAMS.map(f => f.n).filter(n => list.some(p => p.fam === n));
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 215, display: "flex", justifyContent: "flex-end" }}>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(10,12,17,0.4)" }}></div>
      <div style={{ position: "relative", width: 460, maxWidth: "94vw", background: "#fff", height: "100%", boxShadow: "-12px 0 40px rgba(10,12,17,0.18)", display: "flex", flexDirection: "column" }}>

          </button>
        </div>
        <div style={{ padding: "0 22px 14px", borderBottom: "1px solid var(--border)" }}>

            onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--purple)"; e.currentTarget.style.background = "var(--purple-tint)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)"; e.currentTarget.style.background = "var(--card)"; }}>
            <span style={{ width: 40, height: 40, borderRadius: 9, background: "var(--purple-soft)", color: "var(--purple)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19, flexShrink: 0 }}>

            </span>

              <span style={{ display: "block", fontSize: 12.5, color: "var(--ink-3)", marginTop: 2 }}>Defina la métrica, la dimensión y la visualización.</span>
            </span>
          </button>
          <div style={{ position: "relative", marginBottom: 10 }}>

            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar un gráfico o una métrica"
              style={{ width: "100%", height: 36, padding: "0 10px 0 33px", borderRadius: 8, border: "1px solid var(--border)", fontFamily: "inherit", fontSize: 13, background: "var(--bg)", color: "var(--ink)" }} />

/* ══════════ Widget en el canvas ══════════ */
function RbWidget({ cfg, gf, base, onEdit, onDup, onDelete, onWidth }) {
  const [menu, setMenu] = useStateR(false);
  const eff = rbEffViz(cfg);
  const desc = cfg.desc || [
    cfg.meas.map(k => RB_M[k].n).join(" · "),
    cfg.rowDims.length ? "por " + RB_DIM[cfg.rowDims[0].k].n.toLowerCase() : null,
    cfg.colDims.length ? "cruzado con " + RB_DIM[cfg.colDims[0].k].n.toLowerCase() : null,
  ].filter(Boolean).join(" · ");
  return (
    <section className="card" style={{ gridColumn: cfg.width === "full" ? "span 2" : "span 1", display: "flex", flexDirection: "column", minWidth: 0 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 14 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{cfg.name}</div>
          <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{desc}</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 4, flexShrink: 0, position: "relative" }}>
          <button onClick={() => onWidth(cfg.width === "full" ? "half" : "full")} title={cfg.width === "full" ? "Media pantalla" : "Ancho completo"}
            style={{ border: "none", background: "none", cursor: "pointer", color: "var(--ink-3)", padding: 4 }}>
            <i className={"ph ph-" + (cfg.width === "full" ? "arrows-in-simple" : "arrows-out-simple")} style={{ fontSize: 15 }}></i>
          </button>
          <button onClick={() => setMenu(!menu)} aria-label="Acciones del gráfico" title="Acciones"
            style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 26, height: 26, border: "none", background: "none", borderRadius: 6, color: "var(--ink-3)", cursor: "pointer" }}>
            <i className="ph ph-dots-three-vertical" style={{ fontSize: 16 }}></i>
          </button>
          {menu ? (
            <React.Fragment>
              <div onClick={() => setMenu(false)} style={{ position: "fixed", inset: 0, zIndex: 5 }}></div>
              <div className="dropdown" style={{ width: 170, right: 0, left: "auto", top: 30, zIndex: 6 }}>
                {[["Editar", "pencil-simple", () => { setMenu(false); onEdit(); }],
                  ["Duplicar", "copy", () => { setMenu(false); onDup(); }],
                  ["Exportar a Excel", "file-xls", () => setMenu(false)],
                  ["Eliminar", "trash", () => { setMenu(false); onDelete(); }]].map(([l, ic, fn]) => (
                    <button key={l} className="dd-opt" onClick={fn}
                      style={{ width: "100%", border: "none", background: "none", fontFamily: "inherit", color: l === "Eliminar" ? "var(--red)" : "var(--ink)" }}>
                      <i className={"ph ph-" + ic} style={{ fontSize: 15 }} />{l}
                    </button>
                  ))}

            </React.Fragment>
          ) : null}
        </div>
      </div>
      <RbView cfg={cfg} gf={gf} base={base} height={220} />
    </section>
  );
}

/* ══════════ Reporte (canvas) ══════════ */
function Reportes({ filters }) {
  const [title, setTitle] = useStateR("Operación y demanda");
  const [desc, setDesc] = useStateR("");
  const [widgets, setWidgets] = useStateR([]);
  const [snapshot, setSnapshot] = useStateR([]);
  const [gallery, setGallery] = useStateR(false);
  const [builder, setBuilder] = useStateR(null);
  const [base, setBase] = useStateR("todas");
  const canal = (filters && filters.canal) || "Todos";
  const gf = useMemoR(() => ({
    sucs: (filters && filters.sucursales) || [], agentes: (filters && filters.ejecutivos) || [],
    canal, fecha: (filters && filters.periodo) || "Últimos 30 días",
  }), [filters, canal]);
  const [toast, setToast] = useStateR(null);
  useEffectR(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);

  const rows = useMemoR(() => rbFilter(gf), [gf]);
  useEffectR(() => { window.__rbOpenGallery = () => setGallery(true); return () => { delete window.__rbOpenGallery; }; }, []);
  const activeFilters = [
    gf.suc !== "Todas las sucursales" ? { k: "suc", l: gf.suc, reset: { suc: "Todas las sucursales" } } : null,
    gf.agente !== "Todos los agentes" ? { k: "agente", l: gf.agente, reset: { agente: "Todos los agentes" } } : null,
    gf.canal !== "Todos" ? { k: "canal", l: "Canal: " + gf.canal, reset: { canal: "Todos" } } : null,
  ].filter(Boolean);

  const save = cfg => {
    setWidgets(w => w.some(x => x.id === cfg.id) ? w.map(x => x.id === cfg.id ? { ...cfg, saved: true } : x) : w.concat({ ...cfg, saved: true }));
    setBuilder(null);
  };
  const sel = { border: "1px solid var(--border)", borderRadius: 8, height: 34, padding: "0 10px", fontFamily: "inherit", fontSize: 12.5, color: "var(--ink)", background: "var(--card)", cursor: "pointer" };

  return (
    <React.Fragment>
      <section className="card" style={{ padding: 0, overflow: "hidden" }} data-screen-label="Reporte custom">
        {/* alcance del reporte: canal + base de cálculo (el resto viene de los filtros del tablero) */}
        <div className="chips-sm" style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 22px", borderTop: "1px solid var(--border)", borderBottom: "1px solid var(--border)", flexWrap: "wrap" }}>
          <span style={{ fontSize: 12, color: "var(--ink-3)" }}>{gf.fecha} · {rbNum(rows.length, 0)} atenciones</span>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
            <button className="btn-secondary" style={{ display: "inline-flex", alignItems: "center", gap: 6, flexShrink: 0 }} onClick={() => setGallery(true)}>
              <i className="ph ph-plus"></i>Agregar gráfico
            </button>
          </div>
        </div>

        {/* canvas */}
        <div style={{ padding: 22, minHeight: 460, background: "#FAFAF9", backgroundImage: "radial-gradient(rgba(26,26,46,0.13) 1px, transparent 1px)", backgroundSize: "16px 16px" }}>
          {!widgets.length ? (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: "70px 24px", textAlign: "center" }}>
              <div style={{ fontSize: 16, fontWeight: 600 }}>Este reporte todavía no tiene gráficos</div>
              <div style={{ fontSize: 13, color: "var(--ink-3)", maxWidth: 430, lineHeight: 1.6 }}>
                Seleccione un gráfico de la galería —vienen preconfigurados por métrica— o cree uno nuevo definiendo qué medir y por qué dimensión analizarlo.
              </div>
              <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6, marginTop: 4 }} onClick={() => setGallery(true)}>
                <i className="ph ph-plus"></i>Agregar gráfico
              </button>
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 18, alignItems: "start" }}>
              {widgets.map(w => (
                <RbWidget key={w.id} cfg={w} gf={gf} base={base}
                  onEdit={() => setBuilder(w)}
                  onDup={() => setWidgets(list => list.concat({ ...w, id: "w" + (RB_SEQ++), name: w.name + " (copia)" }))}
                  onDelete={() => setWidgets(list => list.filter(x => x.id !== w.id))}
                  onWidth={width => setWidgets(list => list.map(x => x.id === w.id ? { ...x, width } : x))} />
              ))}
              <button onClick={() => setGallery(true)}
                style={{ gridColumn: "span 1", minHeight: 150, border: "1.5px dashed var(--border)", borderRadius: 10, background: "rgba(255,255,255,0.6)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, fontFamily: "inherit", fontSize: 13, color: "var(--purple)", fontWeight: 500, cursor: "pointer" }}>
                <i className="ph ph-plus-circle" style={{ fontSize: 22 }}></i>Agregar gráfico
              </button>
            </div>
          )}
        </div>
      </section>

      {gallery ? (
        <RbGallery onClose={() => setGallery(false)}
          onCustom={() => { setGallery(false); setBuilder(rbCfgFromPreset(null)); }}
          onPreset={p => { setGallery(false); setBuilder(rbCfgFromPreset(p)); }} />
      ) : null}
      {builder ? <RbChartBuilder initial={builder} gf={gf} base={base} onBase={setBase} onCancel={() => setBuilder(null)} onSave={save} /> : null}
    </React.Fragment>
  );
}

window.Reportes = Reportes;
</script>

      rows: SEDES_DATA.map(a => [a.name, a.ciudad, a.asesores, a.interacciones, fmtP(a.conversion) + "%", a.ventas, a.pruebas + "%", fmtP(a.score) + "/10"]) },
  ];
  return [{ title: tab, cols: ["Métrica", "Valor"], rows: [] }];
}

function ExportPreviewModal({ tab, format, onClose }) {
  const sheets = EXPORT_SHEETS(tab);
  const fmtLabel = format === "csv" ? "CSV (.csv)" : "Excel (.xlsx)";
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, []);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(7,29,58,0.45)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center" }} onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label="Vista previa de exportación" onClick={e => e.stopPropagation()}
        style={{ width: "84%", height: "88%", maxWidth: 1200, minWidth: 320, background: "#fff", borderRadius: 12, boxShadow: "0 24px 64px rgba(7,29,58,0.35)", overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 20px", borderBottom: "1px solid var(--border)", flexShrink: 0, flexWrap: "wrap" }}>
          <span className="sec-ic" style={{ background: "var(--green-bg)", color: "var(--green)" }}>
            <Ph name={format === "csv" ? "file-csv" : "file-xls"} fill />
          </span>
          <div>
            <div style={{ fontSize: 15, fontWeight: 600 }}>Vista previa de exportación — {tab}</div>
            <div style={{ fontSize: 12.5, color: "var(--ink-3)" }}>{fmtLabel} · {sheets.length} {sheets.length === 1 ? "hoja" : "hojas"} · Numia Comunicaciones · red de tiendas</div>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6 }} onClick={onClose}>

            </button>
            <button className="btn-secondary" aria-label="Cerrar" onClick={onClose} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <Ph name="x" />Cerrar
            </button>
          </div>
        </div>
        <div style={{ flex: 1, minHeight: 0, overflow: "auto", padding: "22px 24px 32px", background: "var(--bg)" }}>
          {sheets.map(sh => (
            <div key={sh.title} style={{ marginBottom: 26 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 8, flexWrap: "wrap" }}>
                <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "#fff", background: "var(--green)", padding: "3px 9px", borderRadius: 5 }}>Hoja</span>
                <span style={{ fontSize: 15, fontWeight: 600 }}>{sh.title}</span>
                {sh.note ? <span style={{ fontSize: 12, color: "var(--ink-3)" }}>{sh.note}</span> : null}
              </div>
              <div style={{ overflowX: "auto", border: "1px solid var(--border)", borderRadius: 8, background: "#fff" }}>
                <table className="data export-preview" style={{ fontSize: 13 }}>
                  <thead>
                    <tr>
                      <th style={{ width: 34, textAlign: "center" }}></th>
                      {sh.cols.map((c, i) => <th key={i} style={{ borderLeft: "1px solid var(--border)" }}>{c}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {sh.rows.length === 0 ? (
                      <tr><td colSpan={sh.cols.length + 1} style={{ padding: "16px 12px", color: "var(--ink-3)", textAlign: "center" }}>Sin datos en el período.</td></tr>
                    ) : sh.rows.map((r, ri) => (
                      <tr key={ri}>
                        <td style={{ width: 34, textAlign: "center", color: "var(--ink-3)", background: "#FAFBFC", fontVariantNumeric: "tabular-nums" }}>{ri + 1}</td>
                        {r.map((cell, ci) => (
                          <td key={ci} style={{ fontVariantNumeric: "tabular-nums", borderLeft: "1px solid var(--border)", color: ci === 0 ? "var(--ink)" : "var(--ink-2)", fontWeight: ci === 0 ? 500 : 400 }}>{cell}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

    return () => { clearTimeout(t); document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, []);
  const steps = ["Analizando 2.612 conversaciones", "Agrupando temas y modelos mencionados", "Redactando hallazgos y próximos pasos"];
  const topTemas = [...TEMAS].sort((a, b) => b.vol - a.vol).slice(0, 3);

          </div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            {!loading ? (
              <button className="btn-brand" style={{ display: "inline-flex", alignItems: "center", gap: 6 }} onClick={() => window.print()}>
                <Ph name="file-pdf" />Descargar PDF
              </button>
            ) : null}
            <button className="btn-secondary" aria-label="Cerrar" onClick={onClose} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <Ph name="x" />Cerrar
            </button>
          </div>
        </div>
        <div className="report-scroll" style={{ flex: 1, minHeight: 0, overflow: "auto", position: "relative" }}>
          {loading ? (
            <div style={{ position: "absolute", inset: 0, background: "#fff", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18, zIndex: 5 }}>
              <div style={{ width: 54, height: 54, borderRadius: "50%", background: "var(--purple-soft)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Ph name="sparkle" fill style={{ color: "var(--purple)", fontSize: 24, animation: "ins-pulse 1.2s cubic-bezier(0.4,0,0.2,1) infinite" }} />
              </div>
              <div style={{ fontSize: 15, fontWeight: 600 }}>Generando el informe del período</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, alignItems: "flex-start" }}>
                {steps.map((s, i) => (
                  <div key={s} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "var(--ink-2)", opacity: 0, animation: "ins-step .4s cubic-bezier(0.4,0,0.2,1) " + (0.25 + i * 0.5) + "s forwards" }}>
                    <Ph name="check-circle" style={{ color: "var(--green)", fontSize: 15 }} />{s}

                ))}
              </div>
              <div style={{ width: 220, height: 4, borderRadius: 2, background: "#EDEFF2", overflow: "hidden" }}>
                <div style={{ height: "100%", borderRadius: 2, background: "var(--red)", animation: "ins-bar 1.7s cubic-bezier(0.4,0,0.2,1) forwards" }}></div>
              </div>

          <div className="report-sheet">
            <div className="report-hero">

              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18, flexWrap: "wrap" }}>
                <span style={{ width: 36, height: 36, borderRadius: 8, background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <BrandMark size={24} />
                </span>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase" }}>Numia Comunicaciones</div>
                  <div className="rh-kicker">Speech Analytics · red de tiendas y soporte técnico</div>

              <div className="rh-kicker">Informe del período</div>

                    <div className="report-item" key={t.name}>
                      <div className="ri-top">
                        <span className="ri-name">{t.name}</span>
                        <span className="pill sm brand">{t.vol} interacciones</span>
                        <SentPill kind={SENT_KIND[t.sent]} label={SENT_LABEL[t.sent]} />

                      <p><b>{t.headline}.</b> {t.sintesis}</p>

              <div>
                <div className="report-h3"><Ph name="device-mobile" fill />Equipos más mencionados</div>
                <div style={{ marginTop: 10 }}>
                  {topModelos.map(m => (
                    <div className="hbar-row" key={m.name}>
                      <span className="hbar-label" style={{ width: 210, fontWeight: 500 }}>{m.name}</span>
                      <div className="hbar-track"><div className="hbar" style={{ width: (m.menciones / topModelos[0].menciones) * 100 + "%" }}></div></div>
                      <span className="hbar-val">{m.menciones}</span>
                      <span style={{ fontSize: 12, color: "var(--ink-3)", width: 220 }}>objeción: {m.objecion}</span>
                    </div>

              </div>

              <div>
                <div className="report-h3"><Ph name="list-checks" fill />Qué hacer en las próximas dos semanas</div>
                <div className="report-list" style={{ marginTop: 12 }}>
                  {ACCIONES_INFORME.map((a, i) => (
                    <div className="report-action" key={a.t}>
                      <span className="ra-n">{i + 1}</span>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>{a.t}</div>
                        <p style={{ fontSize: 13, color: "var(--ink-2)", lineHeight: 1.6, marginTop: 4 }}>{a.d}</p>
                        <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                          <span className="pill sm neu"><Ph name="user" />{a.dueno}</span>
                          <span className={"pill sm " + (a.impacto === "Alto" ? "crit" : "warn")}>impacto {a.impacto.toLowerCase()}</span>

                  ))}

              </div>

              <div className="card-sub" style={{ borderTop: "1px solid var(--border)", paddingTop: 14 }}>
                Nota metodológica: los indicadores se calculan sobre las conversaciones con audio interpretable (2.612 de 2.894 capturadas).
                El CSAT es una estimación a partir del tono y el contenido y no reemplaza la encuesta de posventa.
                Este informe es una herramienta de coaching y de decisión comercial; no constituye evaluación formal de desempeño.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Panel de demo (estados del tablero) ── */
function DemoPanel({ t, setTweak, onClose }) {
  return (
    <div className="demo-panel" role="dialog" aria-label="Opciones de demostración">
      <h4>Modo demostración</h4>
      <div className="dp-sub">Estados del tablero para mostrar en la presentación.</div>
      <div className="dp-row">
        <span>Estado del tablero</span>
        <select value={t.estado} onChange={e => setTweak("estado", e.target.value)}>
          {["normal", "día 1", "configuración pendiente", "bloqueado"].map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      <div className="dp-row">
        <span>Ranking público de asesores</span>
        <button className={"switch" + (t.rankingPublico ? " on" : "")} aria-pressed={t.rankingPublico}
          onClick={() => setTweak("rankingPublico", !t.rankingPublico)} aria-label="Ranking público de asesores"></button>
      </div>
      <div className="dp-row">
        <span>Vista nube de palabras</span>
        <button className={"switch" + (t.nubePalabras ? " on" : "")} aria-pressed={t.nubePalabras}
          onClick={() => setTweak("nubePalabras", !t.nubePalabras)} aria-label="Vista nube de palabras"></button>
      </div>
      <div className="dp-row">
        <span>Lista de interacciones vacía</span>
        <button className={"switch" + (t.listaVacia ? " on" : "")} aria-pressed={t.listaVacia}
          onClick={() => setTweak("listaVacia", !t.listaVacia)} aria-label="Lista de interacciones vacía"></button>
      </div>
      <div className="dp-row">
        <span>Datos insuficientes (asesores)</span>
        <button className={"switch" + (t.datosInsuficientes ? " on" : "")} aria-pressed={t.datosInsuficientes}
          onClick={() => setTweak("datosInsuficientes", !t.datosInsuficientes)} aria-label="Datos insuficientes"></button>
      </div>
      <button className="btn-secondary" style={{ width: "100%", marginTop: 12 }} onClick={onClose}>Cerrar</button>
    </div>

}

/* ══════════════════════ APLICACIÓN ══════════════════════ */
function App() {
  const [tweaks, setTweaks] = useState({
    estado: "normal", rankingPublico: true, nubePalabras: false, listaVacia: false, datosInsuficientes: false,
  });
  const setTweak = (k, v) => setTweaks(s => ({ ...s, [k]: v }));
  const [demoOpen, setDemoOpen] = useState(false);
  const [tab, setTab] = useState("Resumen");
  const [detailRow, setDetailRow] = useState(null);
  const [topic, setTopic] = useState(null);
  const [model, setModel] = useState(null);
  const [informeOpen, setInformeOpen] = useState(false);
  const [exportFmt, setExportFmt] = useState(null);
  const [drillQuery, setDrillQuery] = useState("");
  const [filters, setFilters] = useState(EMPTY_FILTERS);

  const drill = q => { setDrillQuery(typeof q === "string" ? q : ""); setTopic(null); setModel(null); setTab("Interacciones"); };
  const closeAll = () => { setDetailRow(null); setTopic(null); setModel(null); };

  useEffect(() => {
    const open = detailRow || topic || model;
    if (!open) return;
    const onKey = e => { if (e.key === "Escape") closeAll(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [detailRow, topic, model]);

  const variant = tweaks.estado === "bloqueado" ? "locked"
    : tweaks.estado === "día 1" ? "day1"
    : tweaks.estado === "configuración pendiente" ? "setup"
    : "normal";

  return (
    <React.Fragment>
      <a className="skip-link" href="#contenido">Saltar al contenido</a>
      <Sidebar />
      {informeOpen ? <InformeModal onClose={() => setInformeOpen(false)} /> : null}
      {exportFmt ? <ExportPreviewModal tab={tab} format={exportFmt} onClose={() => setExportFmt(null)} /> : null}

      <main className="main" id="contenido">
        <div className="topbar">
          <div>
            <h1 className="page-title">Speech Analytics</h1>
            <div className="page-sub">Red de tiendas y soporte técnico · {PERIODO.label} ({PERIODO.rango})</div>
          </div>
          <span className="tenant-chip" style={{ marginLeft: 8 }}>
            <span className="tc-dot"><BrandMark size={13} /></span>Numia Comunicaciones
          </span>
          <div style={{ display: "flex", gap: 8, marginLeft: "auto", alignItems: "center", flexWrap: "wrap" }}>
            <button className="chip" onClick={() => setDemoOpen(!demoOpen)} aria-pressed={demoOpen}>
              <Ph name="sliders-horizontal" />Demo
            </button>
            <button className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }} onClick={() => setInformeOpen(true)}>
              <Ph name="sparkle" fill />Generar informe
            </button>
            <ExportMenu onExport={setExportFmt} />
          </div>
        </div>

        <Tabs tab={tab} onTab={setTab} />
        <FilterRow filters={filters} onChange={setFilters} hideAsesores={tab === "Sedes"} />
        <ActiveFiltersBar filters={filters} onChange={setFilters} />

        {tab === "Resumen" ? (
          <Dashboard variant={variant}
            rankingPublico={tweaks.rankingPublico}
            nubePalabras={tweaks.nubePalabras}
            onOpenProfile={() => setTab("Asesores")}
            onGoTemas={() => drill("")}
            onDrillTopic={setTopic}
            onOpenModel={setModel}
            onDrill={drill} />
        ) : null}
        {tab === "Tienda" ? <Tienda onDrill={drill} onOpenModel={setModel} /> : null}
        {tab === "Posventa" ? <Posventa onDrill={drill} /> : null}
        {tab === "Interacciones" ? (
          <Interactions onOpenDetail={setDetailRow} forceEmpty={tweaks.listaVacia}
            initialQuery={drillQuery} onExport={setExportFmt} />
        ) : null}
        {tab === "Asesores" ? (
          <Asesores datosInsuficientes={tweaks.datosInsuficientes} onGoInteractions={drill} />
        ) : null}
        {tab === "Sedes" ? <Sedes onGoInteractions={drill} /> : null}
        {tab === "Reportes" ? (
          <Reportes filters={{ sucursales: filters.sedes, ejecutivos: filters.asesores, periodo: filters.periodo, canal: (filters.canales && filters.canales[0]) || null }} />
        ) : null}
      </main>

      {topic ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setTopic(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de tema">
            <TopicDetail topic={topic} onClose={() => setTopic(null)}
              onOpenDetail={() => { setTopic(null); setDetailRow(INTERACCIONES[0]); }}
              onGoInteractions={() => drill(topic.q != null ? topic.q : topic.name)} />
          </aside>
        </div>
      ) : null}

      {model ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setModel(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de modelo">
            <ModelDetail model={model} onClose={() => setModel(null)} onGoInteractions={() => drill(model.name)} />
          </aside>
        </div>
      ) : null}

      {detailRow ? (
        <div className="drawer-backdrop" onClick={e => { if (e.target === e.currentTarget) setDetailRow(null); }}>
          <aside className="drawer" role="dialog" aria-label="Detalle de interacción">
            <Detail row={detailRow} drawer onBack={() => setDetailRow(null)}
              onGoProfile={() => { setDetailRow(null); setTab("Asesores"); }} />
          </aside>
        </div>
      ) : null}

      {demoOpen ? <DemoPanel t={tweaks} setTweak={setTweak} onClose={() => setDemoOpen(false)} /> : null}
      <AiFab />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
