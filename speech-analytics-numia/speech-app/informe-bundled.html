document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"4ab9cec9-4d07-42d0-90cd-b64ccc22142f\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"e2d9a508-d36b-4e9e-b14b-633ffeaf802c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1f227bc4-8521-4ebe-b572-fa20ad8bd087\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"00709227-ae5e-4c31-80ee-d4d44e9477c1\"><\u002Fscript>\n<!-- ⛔ ZONA FIJA — DISEÑO. No editar nada de este bloque <style>: define colores, tipografía y layout que hacen que todos los informes se vean iguales. -->\n<style>\n:root{\n  --black:#060A27; --purple:#863DFF; --grey:#9593A1; --turq:#7BE1C9;\n  --lav:#CAC6FF; --lilac:#DDE0FF; --neon:#CBFF2E; --white:#FFFFFF; --border:#E6E6EF;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{font-family:'Hanken Grotesk',Arial,sans-serif;color:var(--black);background:#F4F4F9;line-height:1.55;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px}\n\n/* NAV */\nnav{position:sticky;top:0;z-index:100;background:rgba(6,10,39,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}\nnav .wrap{display:flex;align-items:center;gap:22px;height:56px;overflow-x:auto}\nnav .logo{font-weight:800;color:#fff;font-size:18px;letter-spacing:-.5px;white-space:nowrap}\nnav .logo span{color:var(--neon)}\nnav .logo-img{height:26px;width:auto;display:block}\n.cover-logo{height:34px;width:auto;margin-bottom:30px;position:relative;z-index:2}\nfooter .logo-img{height:22px;vertical-align:middle;margin-right:6px}\nnav a{color:#B9B7C7;text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;transition:color .2s}\nnav a:hover{color:#fff}\n\n/* COVER */\n.cover{background:var(--black);color:#fff;padding:90px 0 80px;position:relative;overflow:hidden}\n.cover::after{content:\"\";position:absolute;right:-140px;top:-140px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(134,61,255,.45),transparent 68%)}\n.cover .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--neon);border:1px solid rgba(203,255,46,.4);padding:5px 12px;border-radius:20px;margin-bottom:26px}\n.cover h1{font-size:46px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;max-width:820px;margin-bottom:20px}\n.cover h1 em{font-style:normal;color:var(--lav)}\n.cover p.sub{font-size:18px;color:#C9C7D6;max-width:640px;font-weight:400}\n.cover .meta{display:flex;gap:30px;margin-top:38px;flex-wrap:wrap}\n.cover .meta div{position:relative;z-index:2}\n.cover .meta .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--grey)}\n.cover .meta .v{font-size:16px;font-weight:600;color:#fff;margin-top:2px}\n\n/* SECTIONS */\nsection{padding:60px 0}\n.sec-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:10px}\nh2{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-bottom:14px;line-height:1.1}\n.lead{font-size:17px;color:#4A4A5C;max-width:760px;margin-bottom:34px}\nh3{font-size:20px;font-weight:700;margin:34px 0 12px;letter-spacing:-.3px}\np{margin-bottom:14px;color:#33333F}\nstrong{font-weight:700;color:var(--black)}\n\n/* KPI GRID */\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin:8px 0 20px}\n.kpi{background:var(--black);border-radius:16px;padding:22px 20px;position:relative;overflow:hidden}\n.kpi .n{font-size:38px;font-weight:800;color:var(--neon);letter-spacing:-1px;line-height:1}\n.kpi .n small{font-size:17px;font-weight:600}\n.kpi .l{font-size:12.5px;color:#B9B7C7;margin-top:8px;font-weight:500}\n.kpi.alt .n{color:var(--turq)}\n.kpi.warn .n{color:#FF7A7A}\n\n/* CARDS */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px}\n.card.dark{background:var(--black);color:#fff;border:none}\n.card.dark p,.card.dark li{color:#C9C7D6}\n.chart-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin:18px 0}\n.chart-box h4{font-size:15px;font-weight:700;margin-bottom:4px}\n.chart-box .cap{font-size:13px;color:var(--grey);margin-bottom:16px}\n.chart-wrap{position:relative;height:300px}\n.chart-wrap.tall{height:360px}\n\n/* BOARD QUESTIONS ACCORDION */\n.q{background:#fff;border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;transition:box-shadow .2s}\n.q.open{box-shadow:0 8px 30px rgba(6,10,39,.09)}\n.q-head{display:flex;align-items:flex-start;gap:16px;padding:22px 24px;cursor:pointer;user-select:none}\n.q-num{flex:0 0 34px;height:34px;border-radius:9px;background:var(--lilac);color:var(--purple);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}\n.q.open .q-num{background:var(--purple);color:#fff}\n.q-title{flex:1;font-size:17px;font-weight:700;line-height:1.3;padding-top:4px}\n.q-toggle{flex:0 0 auto;color:var(--purple);font-size:22px;font-weight:400;transition:transform .25s;padding-top:2px}\n.q.open .q-toggle{transform:rotate(45deg)}\n.q-body{max-height:0;overflow:hidden;transition:max-height .35s ease}\n.q-inner{padding:0 24px 26px 74px}\n.verdict{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 12px;border-radius:20px;margin-bottom:14px}\n.verdict.no{background:#FFECEC;color:#D64545}\n.verdict.si{background:#E6F9F3;color:#1B9B7A}\n.verdict.mid{background:#FFF4E0;color:#C88A1E}\n.q-inner .datachip{display:inline-block;background:var(--black);color:var(--neon);font-weight:700;font-size:13px;padding:3px 10px;border-radius:7px;margin:2px 4px 2px 0}\n\n/* INSIGHT CARDS */\n.insight{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;transition:transform .18s,box-shadow .18s}\n.insight:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(6,10,39,.1)}\n.insight .badge{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--purple);text-transform:uppercase}\n.insight h4{font-size:17px;font-weight:700;margin:8px 0 8px;line-height:1.25}\n.insight p{font-size:14.5px;color:#4A4A5C;margin:0}\n.insight .stat{font-size:13px;color:var(--black);font-weight:600;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}\n\n/* MATURITY */\n.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}\n.rung{border-radius:16px;padding:24px;color:#fff}\n.rung.manage{background:linear-gradient(160deg,#863DFF,#6A2FCC)}\n.rung.optimize{background:var(--black);border:1px solid #2A2E48}\n.rung.transform{background:var(--black)}\n.rung .st{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}\n.rung h4{font-size:19px;font-weight:800;margin:6px 0 10px}\n.rung .status{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:14px;margin-bottom:12px}\n.rung.manage .status{background:var(--neon);color:var(--black)}\n.rung.optimize .status,.rung.transform .status{background:rgba(255,255,255,.15);color:#fff}\n.rung ul{list-style:none;font-size:13.5px}\n.rung li{padding:6px 0 6px 22px;position:relative;color:#D8D6E4}\n.rung li::before{content:\"\";position:absolute;left:0;top:12px;width:7px;height:7px;border-radius:50%;background:var(--turq)}\n.rung.manage li::before{background:var(--neon)}\n\n/* TABLE */\ntable{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}\nth{background:var(--black);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:12.5px}\nth:first-child{border-radius:9px 0 0 0}th:last-child{border-radius:0 9px 0 0}\ntd{padding:10px 14px;border-bottom:1px solid var(--border)}\ntr:hover td{background:#FAFAFE}\n.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700}\n.pill.bad{background:#FFECEC;color:#D64545}\n.pill.mid{background:#FFF4E0;color:#C88A1E}\n.pill.good{background:#E6F9F3;color:#1B9B7A}\n\n/* RECOS */\n.reco{display:flex;gap:18px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:12px;padding:22px 24px;margin-bottom:14px}\n.reco .pr{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--purple);height:fit-content;padding:4px 11px;border-radius:14px}\n.reco.p2{border-left-color:var(--turq)}.reco.p2 .pr{background:var(--turq);color:var(--black)}\n.reco.p3{border-left-color:var(--grey)}.reco.p3 .pr{background:var(--grey)}\n.reco h4{font-size:16px;font-weight:700;margin-bottom:6px}\n.reco p{font-size:14px;margin:0;color:#4A4A5C}\n.reco .mods{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}\n.reco .mod{font-size:11.5px;font-weight:600;background:var(--lilac);color:var(--purple);padding:3px 10px;border-radius:12px}\n\n.wow{background:var(--black);border-radius:18px;padding:38px 40px;margin:30px 0;position:relative;overflow:hidden}\n.wow::after{content:\"\";position:absolute;left:-60px;bottom:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(203,255,46,.14),transparent 70%)}\n.wow .q1{font-size:24px;font-weight:800;color:#fff;line-height:1.3;letter-spacing:-.5px;position:relative;z-index:2;max-width:760px}\n.wow .q1 em{font-style:normal;color:var(--neon)}\n.wow .attr{color:var(--grey);font-size:13px;margin-top:14px;position:relative;z-index:2}\n\nfooter{background:var(--black);color:var(--grey);padding:40px 0;font-size:12.5px}\nfooter .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}\nfooter strong{color:#fff}\n\n.note{font-size:12.5px;color:var(--grey);margin-top:8px}\n.hl{background:linear-gradient(transparent 60%,var(--lav) 60%);font-weight:700}\n\n@media(max-width:820px){\n  .grid2,.grid3,.ladder{grid-template-columns:1fr}\n  .cover h1{font-size:32px}\n  h2{font-size:24px}\n  .q-inner{padding-left:24px}\n}\n<\u002Fstyle>\n<style>\n.src{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin:0 8px 8px 0;vertical-align:middle}\n.src.mov{background:var(--lilac);color:var(--purple)}\n.src.spe{background:rgba(123,225,201,.30);color:#127a5e}\n.src.amb{background:#ECE6FF;color:#6A2FCC}\n.src.est{background:#FDEBCB;color:#9A5B00}\n.insight .src{margin-bottom:4px}\n.chart-box>.src{margin-bottom:4px}\n.cover .tag{background:rgba(203,255,46,.08)}\n.q-title .src,.verdict+.src{vertical-align:middle}\n.srckey{display:flex;gap:14px 26px;flex-wrap:wrap;align-items:center}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<!--\n╔══════════════════════════════════════════════════════════════════════════╗\n║  PLANTILLA-MOLDE · INFORME ESTRATÉGICO NUMIA                               ║\n║  Este archivo ES el diseño estándar. Para un cliente nuevo NO se           ║\n║  reconstruye de cero: se parte SIEMPRE de este molde y se reemplaza        ║\n║  únicamente el conten ass=\"sub\">Prueba de concepto de Numia en la Sucursal Centro, con dos lecturas sobre la misma operación: la fila y la conversación. Los primeros resultados muestran una sucursal que ya atiende bien y que, semana a semana, resuelve mejor, escucha más y detecta a tiempo lo que antes no dejaba rastro.<\u002Fp>\n  <div class=\"meta\">\n    <div><div class=\"k\">Período<\u002Fdiv><div class=\"v\">8 jun al 14 jul 2026<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"k\">Turnos analizados<\u002Fdiv><div class=\"v\">2.093<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"k\">Colas<\u002Fdiv><div class=\"v\">2 · Caja y SAC<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"k\">Conversaciones<\u002Fdiv><div class=\"v\">868 analizadas<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"k\">Ejecutivos<\u002Fdiv><div class=\"v\">4<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fheader>\n\n<!-- RESUMEN -->\n<section id=\"resumen\"><div class=\"wrap\">\n  <div class=\"sec-label\">Resumen ejecutivo<\u002Fdiv>\n  <h2>El POC en números: la herramienta ya opera y suma resultados<\u002Fh2>\n  <p class=\"lead\">La sucursal parte de una base sólida: <strong>92% de los turnos se resuelven<\u002Fstrong> y la mitad de los clientes casi no espera. Sobre esa base, la herramienta ya está en marcha y aportando: escucha cada conversación, evalúa la calidad y, en pocas semanas, la operación empezó a mejorar de forma medible.<\u002Fp>\n  <div class=\"card\" style=\"margin:0 0 22px;padding:18px 22px\"><div class=\"srckey\">\n    <span style=\"font-weight:700;font-size:13px;color:var(--black)\">Dos fuentes, marcadas en todo el informe:<\u002Fspan>\n    <span><span class=\"src mov\">Movimientos<\u002Fspan> la fila y los turnos, del sistema de gestión de filas<\u002Fspan>\n    <span><span class=\"src spe\">Speech Analytics<\u002Fspan> la conversación, de las grabaciones de atención analizadas por IA<\u002Fspan>\n    <span><span class=\"src est\">Estados<\u002Fspan> cómo usa su tiempo el equipo, de los estados de los agentes<\u002Fspan>\n  <\u002Fdiv><\u002Fdiv>\n  <div class=\"kpis\" id=\"kpiGrid\"><\u002Fdiv>\n  <div class=\"grid2\" style=\"margin-top:8px\">\n    <div class=\"card dark\">\n      <span class=\"src mov\">Movimientos<\u002Fspan><h3 style=\"color:#fff;margin-top:0\">El promedio esconde la buena noticia<\u002Fh3>\n      <p>La espera <strong style=\"color:#fff\">media es 5,2 min<\u002Fstrong>, pero la mediana es 0,6 min: la mitad de los clientes se atiende casi sin cola. <span class=\"hl\" style=\"color:var(--neon);background:none\">El percentil 90 es 16 min y solo casos aislados llegan más lejos<\u002Fspan>. La experiencia típica es muy buena; el trabajo fino está en acortar esa cola corta de casos extremos.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card dark\">\n      <span class=\"src spe\">Speech Analytics<\u002Fspan><h3 style=\"color:#fff;margin-top:0\">La otra mitad de la foto, por primera vez<\u002Fh3>\n      <p>Además de la fila, el POC sumó la conversación: <strong style=\"color:var(--neon)\">868 atenciones escuchadas, transcritas y evaluadas<\u002Fstrong>, sin costo humano por interacción. Calidad, resolución, sentimiento y reclamos que antes se evaporaban al colgar hoy quedan registrados. Es visibilidad que ninguna auditoría manual alcanza.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- EVOLUCION -->\n<section id=\"evolucion\" style=\"background:#F4F4F9\"><div class=\"wrap\">\n  <div class=\"sec-label\">Trayectoria semanal · 5 semanas de prueba<\u002Fdiv>\n  <h2>Semana a semana: la sucursal resuelve mejor con la adopción<\u002Fh2>\n  <p class=\"lead\">Cinco semanas de datos alcanzan para ver una película, no una foto. La operación se mantuvo sólida casi todo el POC, tuvo un bache puntual a mediados de julio por un pico de volumen, y cerró en su mejor semana. La conversación, en paralelo, mejoró en la segunda mitad.<\u002Fp>\n\n  <div class=\"kpis\" id=\"evoKpiGrid\"><\u002Fdiv>\n\n  <div class=\"chart-box\" style=\"margin-top:26px\">\n    <span class=\"src mov\">Movimientos<\u002Fspan><h4>Seis semanas: la espera y su pico de mediados de julio<\u002Fh4>\n    <div class=\"cap\">Espera semanal, promedio y percentil 90 (min). La última semana es parcial (menos días de datos).<\u002Fdiv>\n    <div class=\"chart-wrap tall\"><canvas id=\"chEvoSemanal\"><\u002Fcanvas><\u002Fdiv>\n    <p class=\"note\">La espera se mantuvo baja y estable casi todo el período <span class=\"datachip\">p90 entre 13 y 16 min<\u002Fspan>. La semana del 6 de julio marcó el único bache <span class=\"datachip\">p90 22,2 min<\u002Fspan>, por un pico de demanda puntual, y la semana siguiente fue la mejor de toda la prueba <span class=\"datachip\">p90 9,9 min<\u002Fspan>. La tendencia de fondo es buena; lo valioso es que ahora el bache se ve mientras ocurre.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"chart-box\">\n    <span class=\"src mov\">Movimientos<\u002Fspan><h4>Cumplimiento y resolución, por cola<\u002Fh4>\n    <div class=\"cap\">Cumplimiento del objetivo de espera (10 min) y resolución en primer contacto, por cola de atención.<\u002Fdiv>\n    <div class=\"chart-wrap tall\"><canvas id=\"chEvoSlaSede\"><\u002Fcanvas><\u002Fdiv>\n    <p class=\"note\">Las dos colas cumplen bien el objetivo de espera <span class=\"datachip\">Caja 85%<\u002Fspan> <span class=\"datachip\">SAC 79%<\u002Fspan> y resuelven muy alto a la primera <span class=\"datachip\">Caja 94%<\u002Fspan> <span class=\"datachip\">SAC 87%<\u002Fspan>. Servicio al cliente queda algo por debajo en ambas: es la cola de mayor valor y la que más margen de mejora tiene.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"grid2\" id=\"evoInsightGrid\" style=\"gap:16px;margin-top:8px\"><\u002Fdiv>\n\n  <div class=\"card\" style=\"margin-top:20px;background:var(--lilac);border:none\">\n    <span class=\"src spe\">Speech Analytics<\u002Fspan><h3 style=\"margin-top:0;color:var(--black)\">Lo que mejoró en la segunda mitad del POC<\u002Fh3>\n    <p style=\"color:#33333F;margin-bottom:0\">La conversación, que es lo que la herramienta coachea, mejoró de forma medible entre la primera y la segunda mitad: la resolución en primer contacto pasó de <strong>68% a 73%<\u002Fstrong>, la información exacta de <span class=\"datachip\">77% a 80%<\u002Fspan> y la promoción del canal digital de <span class=\"datachip\">4,5% a 5,4%<\u002Fspan>. La calidad del score subió de 4,33 a 4,41. Es la señal más importante: cuando la atención se mide, se mueve en la dirección correcta.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- PREGUNTAS DIRECTORIO -->\n<section id=\"directorio\" style=\"background:#fff\"><div class=\"wrap\">\n  <div class=\"sec-label\">La conversación de directorio<\u002Fdiv>\n  <h2>Seis preguntas que el directorio debería poder responder con datos<\u002Fh2>\n  <p class=\"lead\">Cada pregunta es de negocio, no de sistema. La respuesta ya no depende de la percepción: la resuelve la operación medida en estas cinco semanas, en la fila y en la conversación.<\u002Fp>\n  <div id=\"qList\"><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- INSIGHTS -->\n<section id=\"insights\"><div class=\"wrap\">\n  <div class=\"sec-label\">Hallazgos<\u002Fdiv>\n  <h2>Los hallazgos que cambian la conversación<\u002Fh2>\n  <p class=\"lead\">No son observaciones sueltas: cada una tiene una implicancia directa sobre la experiencia del cliente, la eficiencia de la sucursal o su potencial comercial.<\u002Fp>\n  <div class=\"grid2\" id=\"insightGrid\" style=\"gap:16px\"><\u002Fdiv>\n\n  <div class=\"chart-box\" style=\"margin-top:26px\">\n    <span class=\"src mov\">Movimientos<\u002Fspan><h4>La espera empuja la fuga, y no es aleatoria<\u002Fh4>\n    <div class=\"cap\">Espera promedio según desenlace del turno. Quien abandona esperó casi el triple que quien fue atendido.<\u002Fdiv>\n    <div class=\"chart-wrap\"><canvas id=\"chDesenlace\"><\u002Fcanvas><\u002Fdiv>\n    <p class=\"note\">Además, el <strong>93% de los abandonos son \"no-show\"<\u002Fstrong>: la persona ya estaba en la fila y no respondió cuando la llamaron. No se fue por no querer el trámite; se cansó de esperar.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"grid2\">\n    <div class=\"chart-box\">\n      <span class=\"src mov\">Movimientos<\u002Fspan><h4>Servicio al cliente: la cola con más margen de mejora<\u002Fh4>\n      <div class=\"cap\">Cumplimiento del objetivo de espera (10 min) por cola. Servicio al cliente queda por debajo de Caja.<\u002Fdiv>\n      <div class=\"chart-wrap tall\"><canvas id=\"chSlaSede\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chart-box\">\n      <span class=\"src mov\">Movimientos<\u002Fspan><h4>El pico y la fuga no coinciden<\u002Fh4>\n      <div class=\"cap\">Cola promedio (personas) y abandono por hora. La cola casi nunca supera una persona; el abandono repunta en la tarde.<\u002Fdiv>\n      <div class=\"chart-wrap tall\"><canvas id=\"chHora\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"chart-box\">\n    <span class=\"src mov\">Movimientos<\u002Fspan><h4>Pocos trámites concentran el grueso del volumen<\u002Fh4>\n    <div class=\"cap\">Espera y tiempo de atención por tipo de gestión (top por volumen). Pago de tarjeta y depósito mueven casi la mitad del volumen.<\u002Fdiv>\n    <div class=\"chart-wrap tall\"><canvas id=\"chTramite\"><\u002Fcanvas><\u002Fdiv>\n    <p class=\"note\"><strong>Pago de tarjeta<\u002Fstrong> (600 turnos) y <strong>depósito<\u002Fstrong> (424) suman más de mil turnos: son rápidos y estandarizados, candidatos naturales a autogestión. <strong>Gestiones<\u002Fstrong> de Servicio al cliente es la atención más larga (casi 11 min): ahí el tiempo del ejecutivo es el que más vale.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"chart-box\">\n    <span class=\"src mov\">Movimientos<\u002Fspan><h4>La operación resiste bien, salvo en el pico de julio<\u002Fh4>\n    <div class=\"cap\">Espera semanal, promedio y percentil 90 (min).<\u002Fdiv>\n    <div class=\"chart-wrap\"><canvas id=\"chWeekly\"><\u002Fcanvas><\u002Fdiv>\n    <p class=\"note\">En la semana del 6 de julio, un pico de volumen llevó la espera p90 a <strong>22,2 min<\u002Fstrong> y el abandono a 13%. Fue puntual: la semana siguiente cerró en el mejor registro del período. La lección es de planificación de capacidad, y ahora el pico se detecta a tiempo.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"chart-box\">\n    <span class=\"src spe\">Speech Analytics<\u002Fspan>\n    <h4>Cada conversación deja un registro escrito: la sucursal tiene memoria<\u002Fh4>\n    <div class=\"cap\">Resúmenes que la herramienta redacta sola. Dos de cada tres grabaciones ya tienen su relato en lenguaje claro (87% de las interpretables). Ejemplos reales, anonimizados.<\u002Fdiv>\n    <div style=\"background:var(--lilac);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14px;color:#33333F;line-height:1.55\">\n      <b style=\"color:var(--purple);font-size:11px;letter-spacing:.05em;text-transform:uppercase\">Atención resuelta · clima positivo<\u002Fb><br>\n      \"La clienta realizó un pago a su tarjeta de crédito. La ejecutiva procesó la operación, confirmó el monto tras algunas correcciones de conteo y completó el pago exitosamente.\"\n    <\u002Fdiv>\n    <div style=\"background:#FFECEC;border-radius:12px;padding:14px 16px;font-size:14px;color:#33333F;line-height:1.55\">\n      <b style=\"color:#D64545;font-size:11px;letter-spacing:.05em;text-transform:uppercase\">Reclamo detectado · derivado a jefatura<\u002Fb><br>\n      \"La clienta solicitó gestión de sobregiro y aclaración de cargos. El ejecutivo explicó que la gestión fue rechazada por límite de tiempo y la derivó a gerencia; quedó en espera de respuesta de jefatura.\"\n    <\u002Fdiv>\n    <p class=\"note\">Y las lecturas entienden el contexto: los pagos y depósitos salen positivos, mientras los reclamos se marcan negativos en 6 de cada 10 casos. La IA lee significado, no palabras sueltas.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section id=\"estados\"><div class=\"wrap\">\n  <div class=\"sec-label\">La tercera lente · Estados de agentes <span class=\"src est\">Estados<\u002Fspan><\u002Fdiv>\n  <h2>El tiempo del equipo: capacidad disponible y cada vez mejor aprovechada<\u002Fh2>\n  <p class=\"lead\">Esta lente mira el tiempo del equipo: cuánto atienden, cuánto quedan disponibles y cómo se distribuye la jornada. La foto es buena y, además, mejora: la sucursal está bien dotada, casi siempre hay alguien libre para atender, y el tiempo productivo del equipo creció a medida que avanzó la prueba.<\u002Fp>\n  <div class=\"kpis\">\n    <div class=\"kpi\"><div class=\"n\">45<small>%<\u002Fsmall><\u002Fdiv><div class=\"l\">Ocupación del equipo (tiempo en atención)<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi\"><div class=\"n\">46<small>%<\u002Fsmall><\u002Fdiv><div class=\"l\">Tiempo disponible, listo para atender<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi\"><div class=\"n\">6,3<small>h<\u002Fsmall><\u002Fdiv><div class=\"l\">Jornada efectiva por agente<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi alt\"><div class=\"n\">39→53<small>%<\u002Fsmall><\u002Fdiv><div class=\"l\">Ocupación 1ª vs 2ª mitad del POC<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"chart-box\">\n    <span class=\"src est\">Estados<\u002Fspan>\n    <h4>El equipo aprovecha mejor su tiempo con cada semana de uso<\u002Fh4>\n    <div class=\"cap\">Ocupación promedio semanal del equipo (tiempo en atención sobre tiempo conectado).<\u002Fdiv>\n    <div class=\"chart-wrap\" style=\"height:auto\"><svg viewBox=\"0 0 610 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><line x1=\"55\" y1=\"200.0\" x2=\"590\" y2=\"200.0\" stroke=\"#EFEFF5\" stroke-width=\"1\"><\u002Fline><text x=\"48\" y=\"204.0\" font-size=\"10\" fill=\"#9593A1\" text-anchor=\"end\">0%<\u002Ftext><line x1=\"55\" y1=\"143.3\" x2=\"590\" y2=\"143.3\" stroke=\"#EFEFF5\" stroke-width=\"1\"><\u002Fline><text x=\"48\" y=\"147.3\" font-size=\"10\" fill=\"#9593A1\" text-anchor=\"end\">20%<\u002Ftext><line x1=\"55\" y1=\"86.7\" x2=\"590\" y2=\"86.7\" stroke=\"#EFEFF5\" stroke-width=\"1\"><\u002Fline><text x=\"48\" y=\"90.7\" font-size=\"10\" fill=\"#9593A1\" text-anchor=\"end\">40%<\u002Ftext><line x1=\"55\" y1=\"30.0\" x2=\"590\" y2=\"30.0\" stroke=\"#EFEFF5\" stroke-width=\"1\"><\u002Fline><text x=\"48\" y=\"34.0\" font-size=\"10\" fill=\"#9593A1\" text-anchor=\"end\">60%<\u002Ftext><polygon points=\"70,200 70,87.2 170,74.5 270,107.6 370,44.7 470,56.3 570,52.1 570,200\" fill=\"#E8952E\" opacity=\"0.10\"><\u002Fpolygon><polyline points=\"70,87.2 170,74.5 270,107.6 370,44.7 470,56.3 570,52.1\" fill=\"none\" stroke=\"#E8952E\" stroke-width=\"2.5\"><\u002Fpolyline><circle cx=\"70\" cy=\"87.2\" r=\"4.5\" fill=\"#E8952E\"><\u002Fcircle><circle cx=\"170\" cy=\"74.5\" r=\"4.5\" fill=\"#E8952E\"><\u002Fcircle><circle cx=\"270\" cy=\"107.6\" r=\"4.5\" fill=\"#E8952E\"><\u002Fcircle><circle cx=\"370\" cy=\"44.7\" r=\"4.5\" fill=\"#E8952E\"><\u002Fcircle><circle cx=\"470\" cy=\"56.3\" r=\"4.5\" fill=\"#E8952E\"><\u002Fcircle><circle cx=\"570\" cy=\"52.1\" r=\"4.5\" fill=\"#E8952E\"><\u002Fcircle><text x=\"70\" y=\"78.2\" font-size=\"11\" font-weight=\"700\" fill=\"#9A5B00\" text-anchor=\"middle\">39,8<\u002Ftext><text x=\"170\" y=\"65.5\" font-size=\"11\" font-weight=\"700\" fill=\"#9A5B00\" text-anchor=\"middle\">44,3<\u002Ftext><text x=\"270\" y=\"98.6\" font-size=\"11\" font-weight=\"700\" fill=\"#9A5B00\" text-anchor=\"middle\">32,6<\u002Ftext><text x=\"370\" y=\"35.7\" font-size=\"11\" font-weight=\"700\" fill=\"#9A5B00\" text-anchor=\"middle\">54,8<\u002Ftext><text x=\"470\" y=\"47.3\" font-size=\"11\" font-weight=\"700\" fill=\"#9A5B00\" text-anchor=\"middle\">50,7<\u002Ftext><text x=\"570\" y=\"43.1\" font-size=\"11\" font-weight=\"700\" fill=\"#9A5B00\" text-anchor=\"middle\">52,2<\u002Ftext><text x=\"70\" y=\"222\" font-size=\"11\" fill=\"#9593A1\" text-anchor=\"middle\">Sem 1<\u002Ftext><text x=\"170\" y=\"222\" font-size=\"11\" fill=\"#9593A1\" text-anchor=\"middle\">Sem 2<\u002Ftext><text x=\"270\" y=\"222\" font-size=\"11\" fill=\"#9593A1\" text-anchor=\"middle\">Sem 3<\u002Ftext><text x=\"370\" y=\"222\" font-size=\"11\" fill=\"#9593A1\" text-anchor=\"middle\">Sem 4<\u002Ftext><text x=\"470\" y=\"222\" font-size=\"11\" fill=\"#9593A1\" text-anchor=\"middle\">Sem 5<\u002Ftext><text x=\"570\" y=\"222\" font-size=\"11\" fill=\"#9593A1\" text-anchor=\"middle\">Sem 6<\u002Ftext><\u002Fsvg><\u002Fdiv>\n    <p class=\"note\">La ocupación pasó de <strong>39% en la primera mitad a 53% en la segunda<\u002Fstrong>. La sucursal empezó a aprovechar mejor la capacidad instalada a medida que la operación se hizo visible, sin sumar personal.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"chart-box\" style=\"margin:0\">\n      <span class=\"src est\">Estados<\u002Fspan>\n      <h4>Ocupación pareja entre los ejecutivos<\u002Fh4>\n      <div class=\"cap\">% del tiempo conectado en atención, por ejecutivo.<\u002Fdiv>\n      <div class=\"chart-wrap\" style=\"height:auto\"><svg viewBox=\"0 0 600 178\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><text x=\"6\" y=\"36\" font-size=\"12\" fill=\"#33333F\">Daring · Caja<\u002Ftext><rect x=\"150\" y=\"18\" width=\"430\" height=\"26\" rx=\"5\" fill=\"#F4F1EC\"><\u002Frect><rect x=\"150\" y=\"18\" width=\"369.8\" height=\"26\" rx=\"5\" fill=\"#E8952E\"><\u002Frect><text x=\"511.79999999999995\" y=\"36\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"end\">51,6%<\u002Ftext><text x=\"6\" y=\"76\" font-size=\"12\" fill=\"#33333F\">J. Mishelle · Caja<\u002Ftext><rect x=\"150\" y=\"58\" width=\"430\" height=\"26\" rx=\"5\" fill=\"#F4F1EC\"><\u002Frect><rect x=\"150\" y=\"58\" width=\"315.3\" height=\"26\" rx=\"5\" fill=\"#E8952E\"><\u002Frect><text x=\"457.3\" y=\"76\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"end\">44,0%<\u002Ftext><text x=\"6\" y=\"116\" font-size=\"12\" fill=\"#33333F\">Dulce · SAC<\u002Ftext><rect x=\"150\" y=\"98\" width=\"430\" height=\"26\" rx=\"5\" fill=\"#F4F1EC\"><\u002Frect><rect x=\"150\" y=\"98\" width=\"319.6\" height=\"26\" rx=\"5\" fill=\"#E8952E\"><\u002Frect><text x=\"461.6\" y=\"116\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"end\">44,6%<\u002Ftext><text x=\"6\" y=\"156\" font-size=\"12\" fill=\"#33333F\">J. Barillas · SAC<\u002Ftext><rect x=\"150\" y=\"138\" width=\"430\" height=\"26\" rx=\"5\" fill=\"#F4F1EC\"><\u002Frect><rect x=\"150\" y=\"138\" width=\"311.8\" height=\"26\" rx=\"5\" fill=\"#E8952E\"><\u002Frect><text x=\"453.8\" y=\"156\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"end\">43,5%<\u002Ftext><\u002Fsvg><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;justify-content:center\">\n      <span class=\"src est\">Estados<\u002Fspan>\n      <h3 style=\"margin-top:0\">Hay capacidad para crecer<\u002Fh3>\n      <p>Con la ocupación en 45% y casi la mitad del tiempo disponible, y una cola que casi nunca supera una persona, la dotación está <strong>bien dimensionada y con margen<\u002Fstrong>. Hay espacio para absorber más demanda o para reinvertir tiempo en atención de valor, sin sumar personal.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid3\" style=\"margin-top:16px\">\n    <div class=\"insight\"><span class=\"src est\">Estados<\u002Fspan><span class=\"badge\">Servicio<\u002Fspan><h4>Siempre hay alguien libre para atender<\u002Fh4><p>En las horas pico hay unos 3 agentes conectados y alrededor de 1,4 en atención: casi siempre queda al menos uno disponible. Nadie espera en la fila por falta de un agente.<\u002Fp><div class=\"stat\">→ El buen servicio de la fila tiene respaldo en la dotación.<\u002Fdiv><\u002Fdiv>\n    <div class=\"insight\"><span class=\"src est\">Estados<\u002Fspan><span class=\"src mov\">Movimientos<\u002Fspan><span class=\"badge\">Oportunidad<\u002Fspan><h4>Las pausas se pueden correr al valle<\u002Fh4><p>El 52% de las pausas caen en las ventanas de mayor demanda (10-11h y 15-16h). Moverlas hacia el valle de las 12-13h mantiene la cobertura justo en las crestas, con la misma cantidad de pausas.<\u002Fp><div class=\"stat\">→ Cruce de estados con la curva de demanda.<\u002Fdiv><\u002Fdiv>\n    <div class=\"insight\"><span class=\"src est\">Estados<\u002Fspan><span class=\"badge\">Disciplina<\u002Fspan><h4>Horarios consistentes en caja<\u002Fh4><p>Las ejecutivas de caja entran a la misma hora casi todos los días, con una variación de apenas 20 minutos. Es una base de disciplina operativa sobre la que se puede planificar con confianza.<\u002Fp><div class=\"stat\">→ Predecible, ideal para dimensionar turnos.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- SEGMENTOS SENSIBLES -->\n<section style=\"background:#fff\"><div class=\"wrap\">\n  <div class=\"sec-label\">Prioridad, colas y cobertura<\u002Fdiv>\n  <h2>La prioridad funciona, y aún queda inteligencia por capturar<\u002Fh2>\n  <p class=\"lead\">La regla de prioridad opera como debería: el turno prioritario espera menos que el normal. Y hay una oportunidad clara, de bajo costo, para capturar la mitad de la inteligencia que hoy se cae antes de analizarse.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"chart-box\" style=\"margin:0\">\n      <span class=\"src mov\">Movimientos<\u002Fspan><h4>Espera: turno normal vs prioritario<\u002Fh4>\n      <div class=\"cap\">Promedio y p90 en minutos.<\u002Fdiv>\n      <div class=\"chart-wrap\"><canvas id=\"chTipo\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;justify-content:center\">\n      <span class=\"src mov\">Movimientos<\u002Fspan><h3 style=\"margin-top:0\">La prioridad reduce la espera, como debe ser<\u002Fh3>\n      <p>El turno <strong>prioritario espera 3,8 min en promedio contra 5,2 del normal<\u002Fstrong>, y su percentil 90 es 10,1 min contra 16,4. La regla está bien configurada y protege a quien tiene que proteger.<\u002Fp>\n      <p>Es una base sólida: sobre una priorización que ya funciona se puede orquestar por valor de cliente, por tipo de gestión o por segmento, cuando el banco quiera dar el siguiente paso.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"margin-top:44px\"><span class=\"src spe\" style=\"display:block;margin-bottom:7px\">Speech Analytics<\u002Fspan>Oportunidad: la otra mitad de las conversaciones, a un ajuste de audio<\u002Fh3>\n  <p style=\"max-width:820px;color:#4A4A5C\">De las 1.692 grabaciones del período, la herramienta interpreta y evalúa completo el <strong>51%<\u002Fstrong>. La otra mitad no se pierde por el análisis: se pierde en la <strong>captura del audio<\u002Fstrong>, y está concentrada en dos puestos puntuales. Es la mejor clase de hallazgo, porque se arregla con hardware, no con esfuerzo.<\u002Fp>\n  <div class=\"grid2\" style=\"margin-top:20px\">\n    <div class=\"chart-box\" style=\"margin:0\">\n      <span class=\"src mov\">Movimientos<\u002Fspan><h4>Espera por cola de atención<\u002Fh4>\n      <div class=\"cap\">Promedio y p90 (min) por cola. Servicio al cliente espera más que Caja, sobre todo en la cola larga.<\u002Fdiv>\n      <div class=\"chart-wrap\"><canvas id=\"chEmbarazada\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;justify-content:center\">\n      <span class=\"src spe\">Speech Analytics<\u002Fspan><h3 style=\"margin-top:0\">La captura, no el análisis, es lo que falta<\u002Fh3>\n      <p>Cuando el audio llega limpio, la IA lo interpreta y lo evalúa completo. La cobertura no está repartida: en Caja se aprovecha el <strong>56%<\u002Fstrong> de las charlas, pero en la <strong>Posición 5 solo el 35% y en la Posición 7 el 44%<\u002Fstrong>. La diferencia es de micrófono y captura, no de conversación.<\u002Fp>\n      <p>Llevar esos dos puestos al nivel de Caja recupera inteligencia que <em>ya estamos generando<\u002Fem> y hoy se cae antes de analizarse. Casi duplica la vista con un ajuste operativo simple, sin sumar un solo turno ni una hora de trabajo.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px;background:var(--lilac);border:none;display:flex;gap:20px;align-items:center;flex-wrap:wrap\">\n    <div style=\"flex:0 0 auto\"><span class=\"src spe\">Speech Analytics<\u002Fspan><div style=\"font-size:44px;font-weight:800;color:var(--purple);line-height:1\">51%<\u002Fdiv><div style=\"font-size:12px;color:#5a5a6c;font-weight:600;max-width:120px\">de las conversaciones ya se aprovecha hoy<\u002Fdiv><\u002Fdiv>\n    <p style=\"flex:1;min-width:260px;margin:0;color:#33333F\">Con la mitad de las charlas ya se detectan reclamos, se mide calidad y se ve la oportunidad comercial. Recuperar la otra mitad es un ajuste de captura en dos puestos. Es exactamente el salto que habilita pasar de <strong>Manage<\u002Fstrong> (ordenar la fila) a <strong>Optimize<\u002Fstrong> (entender y orquestar la conversación).<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- MADUREZ -->\n<section id=\"madurez\"><div class=\"wrap\">\n  <div class=\"sec-label\">Ruta de valor<\u002Fdiv>\n  <h2>Dónde está la sucursal hoy, y qué habilita cada paso<\u002Fh2>\n  <p class=\"lead\">Numia no se implementa \"a la carta\": el camino es secuencial. La sucursal tiene resuelto <strong>Manage<\u002Fstrong> (orden y visibilidad de la fila) y este POC ya puso a prueba <strong>Optimize<\u002Fstrong> (la conversación). Los datos muestran dónde cada paso genera valor.<\u002Fp>\n  <div class=\"ladder\">\n    <div class=\"rung manage\">\n      <div class=\"st\">Estadío actual<\u002Fdiv>\n      <h4>Manage<\u002Fh4>\n      <div class=\"status\">✓ Activo hoy<\u002Fdiv>\n      <p style=\"color:#EDEBFA;font-size:14px\">Ordenar y dar visibilidad de la fila. Ya sostiene la operación: 92% atendidos, media atención de la sucursal y el pico conocido de las 12h.<\u002Fp>\n      <ul><li>Queue Management<\u002Fli><li>Smart Signage<\u002Fli><li>Appointments<\u002Fli><\u002Ful>\n    <\u002Fdiv>\n    <div class=\"rung optimize\">\n      <div class=\"st\">En prueba ahora<\u002Fdiv>\n      <h4>Optimize<\u002Fh4>\n      <div class=\"status\">En prueba en este POC<\u002Fdiv>\n      <p style=\"color:#C9C7D6;font-size:14px\">Ya activo en la prueba: Speech Analytics escucha y evalúa cada conversación. El siguiente paso es cerrar el bucle en tiempo real y sobre toda la red.<\u002Fp>\n      <ul><li>Speech Analytics, evaluando el 100% de las charlas<\u002Fli><li>Workforce Management, dotación contra la curva de demanda<\u002Fli><li>Coaching por evidencia, del referente al resto<\u002Fli><li>Detección de reclamos y clima en tiempo real<\u002Fli><\u002Ful>\n    <\u002Fdiv>\n    <div class=\"rung transform\">\n      <div class=\"st\">El salto que sigue<\u002Fdiv>\n      <h4>Transform<\u002Fh4>\n      <div class=\"status\">Escala sin sede física<\u002Fdiv>\n      <p style=\"color:#C9C7D6;font-size:14px\">Cuando la sucursal deje de ser solo operativa, la conversación se vuelve motor de ingresos y la atención escala sin sumar metros cuadrados.<\u002Fp>\n      <ul><li>AI Workflows<\u002Fli><li>Virtual Branch<\u002Fli><li>AI Copilot para trámites complejos<\u002Fli><li>Journey Builder para rutas de derivación<\u002Fli><\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"wow\">\n    <div class=\"q1\">Su sistema de turnos organiza la fila. <em>Numia sabe quién está en ella<\u002Fem>, y ahora también qué se le dijo, si se resolvió y cómo se fue.<\u002Fdiv>\n    <div class=\"attr\">El paso de Manage a Optimize es pasar de <strong style=\"color:#fff\">ordenar la fila<\u002Fstrong> a <strong style=\"color:#fff\">entender y mejorar cada conversación<\u002Fstrong>.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- DETALLE SEDES -->\n<section style=\"background:#fff\"><div class=\"wrap\">\n  <div class=\"sec-label\">Anexo · Detalle por cola<\u002Fdiv>\n  <h2>La sucursal, cola por cola<\u002Fh2>\n  <p class=\"lead\">Las dos colas de la sucursal, con su volumen, espera y cumplimiento. Caja es la más cargada y la más rápida; Servicio al cliente es la de mayor valor y la que más margen de mejora tiene.<\u002Fp>\n  <div style=\"overflow-x:auto\"><table id=\"tblSedes\"><\u002Ftable><\u002Fdiv>\n  <p class=\"note\">Agentes y ocupación se comparten entre ambas colas, por eso se muestran a nivel de sucursal. Los ejecutivos trabajaron con una ocupación de entre 22% y 41%: hay capacidad instalada disponible.<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ACCIONES -->\n<section id=\"acciones\"><div class=\"wrap\">\n  <div class=\"sec-label\">Recomendaciones<\u002Fdiv>\n  <h2>Tres movimientos, priorizados por impacto<\u002Fh2>\n  <p class=\"lead\">Ordenados por relación impacto/esfuerzo sobre los datos del POC. Ninguno requiere obra ni personal nuevo: todos actúan sobre la visibilidad que la prueba ya dejó instalada.<\u002Fp>\n\n  <div class=\"reco\">\n    <div class=\"pr\">Prioridad 1<\u002Fdiv>\n    <div>\n      <h4>Reforzar Servicio al cliente y alinear la dotación a la demanda<\u002Fh4>\n      <p>Servicio al cliente abandona 13,3% contra 6,4% de Caja, empujado por una espera mayor (p90 24 min). La demanda sigue un patrón conocido (picos a las 10 y 15h) y hay capacidad ociosa: reforzar los picos con la holgura del valle reduce la fuga sin sumar personal.<\u002Fp>\n      <div class=\"mods\"><span class=\"mod\">Workforce Management<\u002Fspan><span class=\"mod\">Queue Management<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"reco p2\">\n    <div class=\"pr\">Prioridad 2<\u002Fdiv>\n    <div>\n      <h4>Recuperar la otra mitad de la inteligencia<\u002Fh4>\n      <p>La mitad de las conversaciones aún no se aprovecha por captura de audio en las Posiciones 5 y 7. Es un arreglo de hardware simple y de bajo costo que casi duplica la cobertura de Speech Analytics, sin sumar trámites ni horas. La inteligencia ya se genera; hoy se cae antes de analizarse.<\u002Fp>\n      <div class=\"mods\"><span class=\"mod\">Speech Analytics<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"reco p3\">\n    <div class=\"pr\">Prioridad 3<\u002Fdiv>\n    <div>\n      <h4>Activar el momento comercial del box<\u002Fh4>\n      <p>Hoy se cierra venta en 1,2% de las charlas y se promueve el canal digital en 5%. Es el mayor upside disponible, y la conducta ya existe adentro: dos ejecutivas promueven el canal digital cerca del 18%. Con la conversación ahora visible, ese momento se puede medir, entrenar y escalar con coaching por evidencia.<\u002Fp>\n      <div class=\"mods\"><span class=\"mod\">Speech Analytics<\u002Fspan><span class=\"mod\">AI Copilot<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\" style=\"margin-top:26px;background:var(--lilac);border:none\">\n    <h3 style=\"margin-top:0;color:var(--black)\">La síntesis para el directorio<\u002Fh3>\n    <p style=\"color:#33333F;margin-bottom:0\">En cinco semanas de uso, Numia pasó de no ver nada dentro del box a medir cada conversación, y la sucursal ya muestra mejoras concretas: la resolución en primer contacto de las charlas subió de 68% a 73%, la información exacta de 77% a 80% y la última semana fue la de mejor cumplimiento de todo el período. La fila ya funcionaba; la herramienta suma la otra mitad de la foto y, con ella, un radar de reclamos, un estándar de calidad que ya vive en el equipo y un potencial comercial por primera vez cuantificable. La adopción no solo dio visibilidad: empezó a mover los resultados, y la base es replicable a toda la red.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<footer><div class=\"wrap\">\n  <div>Información confidencial, todos los derechos reservados · <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAB7CAYAAAACAjjRAAAQAElEQVR4AezdCby961g38LVxTlJSMhUvSmSo egra?',\n  v:'si',vl:'Sí, por primera vez',src:'<span class=\"src spe\">Speech Analytics<\u002Fspan>',\n  b:`Hasta este POC, el canal físico era una caja negra: se sabía cuántos turnos, no qué se conversaba. Hoy la herramienta escuchó, transcribió y evaluó <span class=\"datachip\">868 conversaciones<\u002Fspan> sin costo humano por interacción, algo que una auditoría manual apenas toca por muestreo. Se pasó de auditar por muestra a auditar por totalidad.`},\n {t:'¿Estamos perdiendo clientes sin enterarnos, y sabemos dónde?',\n  v:'mid',vl:'Sí ocurre, y ahora sabemos dónde',src:'<span class=\"src mov\">Movimientos<\u002Fspan>',\n  b:`Quien abandona no es aleatorio: esperó 7,4 min en la mediana contra 0,5 de quien se queda <span class=\"datachip\">abandonado p90 33,5 min<\u002Fspan>. La fuga se concentra en la cola de mayor valor: Servicio al cliente abandona 13,3% contra 6,4% de Caja. La palanca está localizada, no repartida por toda la operación.`},\n {t:'¿El estándar de atención de calidad existe en casa, o hay que traerlo de afuera?',\n  v:'si',vl:'Existe adentro: es coaching, no contratación',src:'<span class=\"src spe\">Speech Analytics<\u002Fspan>',\n  b:`La mejor ejecutiva sostiene 86% de resolución en primer contacto e información exacta en 9 de cada 10 interacciones <span class=\"datachip\">score 4,9 / 8<\u002Fspan>, y cerró en su mejor semana. Que una persona del equipo llegue a ese nivel prueba que el estándar es alcanzable. La distancia con el resto marca, con evidencia, dónde el coaching rinde más.`},\n {t:'¿La sucursal es solo un centro de costos, o puede ser motor de ingresos?',\n  v:'mid',vl:'El potencial está intacto y ya es medible',src:'<span class=\"src spe\">Speech Analytics<\u002Fspan>',\n  b:`Hoy el box es casi puramente operativo: se cerró venta en 1,2% de las charlas y se promovió el canal digital en 5% <span class=\"datachip\">venta 1,2%<\u002Fspan>. Es el mayor upside disponible. Y la conducta ya existe: dos ejecutivas promueven el canal digital en cerca del 18% de sus atenciones. No hay que crearla; hay que escalarla.`},\n {t:'¿Estamos listos para escalar la red con esta base de visibilidad?',\n  v:'mid',vl:'La base está: falta pasar de ordenar a orquestar',src:'<span class=\"src amb\">Fila + Conversación<\u002Fspan>',\n  b:`El POC probó, sobre una sola sucursal, que las dos lecturas (la fila y la conversación) funcionan y se sincronizan. La mitad de las charlas aún no se aprovecha por captura de audio en dos puestos <span class=\"datachip\">interpretables 51%<\u002Fspan>: un ajuste simple que casi duplica la cobertura. Resuelto eso, la base es replicable a toda la red.`},\n];\ndocument.getElementById('qList').innerHTML = Q.map((q,i)=>`\n <div class=\"q\" data-i=\"${i}\">\n   <div class=\"q-head\" onclick=\"toggleQ(${i})\">\n     <div class=\"q-num\">${i+1}<\u002Fdiv>\n     <div class=\"q-title\">${q.t}<\u002Fdiv>\n     <div class=\"q-toggle\">+<\u002Fdiv>\n   <\u002Fdiv>\n   <div class=\"q-body\"><div class=\"q-inner\">\n     <span class=\"verdict ${q.v}\">${q.vl}<\u002Fspan> ${q.src||''}\n     <p>${q.b}<\u002Fp>\n   <\u002Fdiv><\u002Fdiv>\n <\u002Fdiv>`).join('');\nfunction toggleQ(i){\n  const el=document.querySelector(`.q[data-i=\"${i}\"]`);\n  const body=el.querySelector('.q-body');\n  const open=el.classList.contains('open');\n  if(open){el.classList.remove('open');body.style.maxHeight=null;}\n  else{el.classList.add('open');body.style.maxHeight=body.scrollHeight+'px';}\n}\n// open first by default\nsetTimeout(()=>toggleQ(0),100);\n\n/* INSIGHTS */\nconst INS = [\n {b:'Cobertura',src:'<span class=\"src spe\">Speech Analytics<\u002Fspan>',h:'868 conversaciones escuchadas, sin costo humano',p:'La herramienta evaluó cada interacción interpretable: calidad, guion, resolución y sentimiento. Es una cobertura que ninguna auditoría manual alcanza.',s:'→ De muestreo a cobertura total del box.'},\n {b:'Radar de riesgo',src:'<span class=\"src spe\">Speech Analytics<\u002Fspan>',h:'84 reclamos y 43 charlas an class=\"src mov\">Movimientos<\u002Fspan>',h:'La demanda es un patrón, no una marea',p:'La afluencia se repite: picos a las 10 y 15h, lunes el día más cargado. Y hay holgura, porque los ejecutivos trabajaron con una ocupación de entre 22% y 41%.',s:'→ Alinear la dotación a la curva sin sumar personal.'},\n {b:'Oportunidad',src:'<span class=\"src mov\">Movimientos<\u002Fspan>',h:'La espera larga es la palanca de la fuga',p:'Quien abandona esperó 13,4 min en promedio; quien fue atendido, 4,6. El 93% son no-show por cansancio de cola. La herramienta muestra exactamente dónde actuar.',s:'→ Bajar la cola extrema impacta directo en la retención.'},\n {b:'Recuperable',src:'<span class=\"src spe\">Speech Analytics<\u002Fspan>',h:'Hay otra mitad de inteligencia a un ajuste de audio',p:'Una de cada dos charlas aún no se aprovecha, y no por el análisis: por captura de audio en las Posiciones 5 y 7 (interpretables 35% y 44% vs 56% en Caja). Un arreglo simple casi duplica la cobertura.',s:'→ Más valor con el mismo esfuerzo.'},\n {b:'Potencial comercial',src:'<span class=\"src spe\">Speech Analytics<\u002Fspan>',h:'El mayor upside está intacto y ya es medible',p:'Venta cerrada en 1,2% y canal digital promovido en 5% de las charlas. Es el margen dormido de la sucursal; por primera vez es visible y, con coaching, escalable.',s:'→ De centro de costos a motor de ingresos.'},\n];\ndocument.getElementById('insightGrid').innerHTML = INS.map(x=>`\n <div class=\"insight\">\n   ${x.src||''}<span class=\"badge\">${x.b}<\u002Fspan>\n   <h4>${x.h}<\u002Fh4>\n   <p>${x.p}<\u002Fp>\n   <div class=\"stat\">${x.s}<\u002Fdiv>\n <\u002Fdiv>`).join('');\n\n/* CHARTS */\nconst noGrid={grid:{display:false}};\nfunction baseOpts(extra={}){return Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}},extra);}\n\n// Desenlace\nnew Chart(document.getElementById('chDesenlace'),{type:'bar',\n data:{labels:['Turno atendido','Turno abandonado'],\n  datasets:[{data:D.desenlace.map(d=>d.espera_media_min),\n   backgroundColor:[C.turq,C.red],borderRadius:10,barThickness:80}]},\n options:baseOpts({indexAxis:'y',scales:{x:{title:{display:true,text:'Espera promedio (min)'},grid:{color:'#EFEFF5'}},y:noGrid},\n  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' min de espera'}}}})});\n\n// SLA por sede\nconst sedes=[...D.branches].sort((a,b)=>a.sla-b.sla);\nnew Chart(document.getElementById('chSlaSede'),{type:'bar',\n data:{labels:sedes.map(s=>s.sede.replace('Punto de Atención ','').replace('Sede Principal ','').replace('Unidad Movil ','Móvil ').replace('Grupo de Atención  ','')),\n  datasets:[{data:sedes.map(s=>s.sla),\n   backgroundColor:sedes.map(s=>s.sla<40?C.red:s.sla<60?'#F0B24B':C.turq),borderRadius:6}]},\n options:baseOpts({indexAxis:'y',scales:{x:{max:100,title:{display:true,text:'% dentro de SLA'},grid:{color:'#EFEFF5'}},y:noGrid},\n  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+'% en SLA'}}}})});\n\n// Hora: cola + abandono\nconst H=D.hourly;\nnew Chart(document.getElementById('chHora'),{\n data:{labels:H.map(x=>x.hora+'h'),\n  datasets:[\n   {type:'bar',label:'Cola promedio',data:H.map(x=>x.cola_prom),backgroundColor:C.lav,borderRadius:5,yAxisID:'y'},\n   {type:'line',label:'Abandono %',data:H.map(x=>x.abandono_pct),borderColor:C.purple,backgroundColor:C.purple,tension:.35,yAxisID:'y1',pointRadius:3}\n  ]},\n options:baseOpts({scales:{x:noGrid,\n   y:{position:'left',title:{display:true,text:'Personas en cola'},grid:{color:'#EFEFF5'}},\n   y1:{position:'right',title:{display:true,text:'Abandono %'},grid:{display:false},max:16}},\n  plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,usePointStyle:true}}}})});\n\n// Tramites\nconst T=D.tramites;\nnew Chart(document.getElementById('chTramite'),{type:'bar',\n data:{labels:T.map(t=>t.tramite),\n  datasets:[\n   {label:'Espera prom (min)',data:T.map(t=>t.espera),backgroundColor:C.purple,borderRadius:5,yAxisID:'y'},\n   {label:'Atención prom (min)',data:T.map(t=>t.atencion_prom),type:'line',borderColor:C.neon,backgroundColor:C.black,tension:.3,pointRadius:3,pointBackgroundColor:C.black,yAxisID:'y1'}\n  ]},\n options:baseOpts({scales:{x:{ticks:{maxRotation:55,minRotation:45,font:{size:10}},grid:{display:false}},\n   y:{title:{display:true,text:'Espera (min)'},grid:{color:'#EFEFF5'}},\n   y1:{position:'right',title:{display:true,text:'Atención (min)'},grid:{display:false}}},\n  plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,usePointStyle:true}}}})});\n\n// Weekly\nconst W=D.weekly;\nnew Chart(document.getElementById('chWeekly'),{\n data:{labels:W.map(w=>w.semana+' ('+w.desde.slice(5)+')'),\n  datasets:[\n   {type:'line',label:'Espera promedio (min)',data:W.map(w=>w.global),borderColor:C.turq,backgroundColor:C.turq,tension:.3,pointRadius:4,borderWidth:2},\n   {type:'line',label:'Espera p90 (min)',data:W.map(w=>w.bogota),borderColor:C.purple,backgroundColor:C.purple,tension:.3,pointRadius:4,borderWidth:2}\n  ]},\n options:baseOpts({scales:{x:noGrid,y:{title:{display:true,text:'Espera promedio (min)'},grid:{color:'#EFEFF5'}}},\n  plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,usePointStyle:true}}}})});\n\n// Tipo cliente\nconst TC=D.tipocliente;\nnew Chart(document.getElementById('chTipo'),{type:'bar',\n data:{labels:TC.map(t=>t.tipo.replace('NO AFILIADO - ','No afil.: ').replace('AUTORIZADO O APODERADO','Apoderado').replace('BENEFICIARIO','Beneficiario')),\n  datasets:[\n   {label:'Espera prom',data:TC.map(t=>t.espera),backgroundColor:C.purple,borderRadius:5},\n   {label:'p90',data:TC.map(t=>t.p90),backgroundColor:C.lav,borderRadius:5}\n  ]},\n options:baseOpts({scales:{x:{ticks:{font:{size:10},maxRotation:30,minRotation:15},grid:{display:false}},y:{title:{display:true,text:'Minutos'},grid:{color:'#EFEFF5'}}},\n  plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,usePointStyle:true}}}})});\n\n// Segmentos priorizados: embarazada vs adulto mayor vs discapacidad\nconst SEG=[\n {seg:'Cola de Caja',prom:4.6,p90:14.4},\n {seg:'Servicio al cliente',prom:6.7,p90:24.0}\n];\nnew Chart(document.getElementById('chEmbarazada'),{type:'bar',\n data:{labels:SEG.map(s=>s.seg),\n  datasets:[\n   {label:'Espera prom',data:SEG.map(s=>s.prom),backgroundColor:SEG.map(s=>s.seg.includes('Embaraz')?C.purple:C.lav),borderRadius:5},\n   {label:'p90',data:SEG.map(s=>s.p90),backgroundColor:SEG.map(s=>s.seg.includes('Embaraz')?C.red:'#E2DFF7'),borderRadius:5}\n  ]},\n options:baseOpts({scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{title:{display:true,text:'Minutos'},grid:{color:'#EFEFF5'}}},\n  plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,usePointStyle:true}},\n   tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y+' min'}}}})});\n\n/* EVOLUCION CHARTS */\nnew Chart(document.getElementById('chEvoSemanal'),{\n data:{labels:E.semanal.map(w=>w.semana+' ('+w.desde.slice(5)+')'),\n  datasets:[\n   {type:'line',label:'Espera promedio (min)',data:E.semanal.map(w=>w.global),borderColor:C.turq,backgroundColor:C.turq,tension:.3,pointRadius:4,borderWidth:2},\n   {type:'line',label:'Espera p90 (min)',data:E.semanal.map(w=>w.bogota),borderColor:C.purple,backgroundColor:C.purple,tension:.3,pointRadius:4,borderWidth:2}\n  ]},\n options:baseOpts({scales:{x:noGrid,y:{title:{display:true,text:'Espera promedio (min)'},grid:{color:'#EFEFF5'}}},\n  plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,usePointStyle:true}},\n   tooltip:{callbacks:{afterBody:c=>{const w=E.semanal[c[0].dataIndex];return w.periodo==='mayo (parcial)'||w.periodo==='junio (parcial)' ? 'Semana parcial (menos días de datos)':'';}}}}})});\n\n// Divisor visual mayo/junio: anotación simple vía dataset de referencia\nnew Chart(document.getElementById('chEvoSlaSede'),{type:'bar',\n data:{labels:E.sla_sede.map(s=>s.sede),\n  datasets:[\n   {label:'SLA de espera %',data:E.sla_sede.map(s=>s.mayo),backgroundColor:C.lav,borderRadius:6},\n   {label:'Resolución 1er contacto %',data:E.sla_sede.map(s=>s.junio),backgroundColor:C.purple,borderRadius:6}\n  ]},\n options:baseOpts({indexAxis:'y',scales:{x:{max:100,title:{display:true,text:'% dentro de SLA'},grid:{color:'#EFEFF5'}},y:noGrid},\n  plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,usePointStyle:true}},\n   tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.x+'% en SLA'}}}})});\n\n/* TABLA SEDES */\nconst tb=D.branches;\nfunction slaCls(v){return v<40?'bad':v<60?'mid':'good';}\ndocument.getElementById('tblSedes').innerHTML =\n `<thead><tr><th>Cola de atención<\u002Fth><th>Turnos<\u002Fth><th>Espera prom<\u002Fth><th>p90<\u002Fth><th>SLA<\u002Fth><th>Agentes<\u002Fth><th>Aten/agente<\u002Fth><th>Ocupación<\u002Fth><\u002Ftr><\u002Fthead><tbody>`+\n tb.map(s=>`<tr>\n   <td><b>${s.sede}<\u002Fb><\u002Ftd>\n   <td>${s.turnos.toLocaleString('es')}<\u002Ftd>\n   <td>${s.espera_prom} min<\u002Ftd>\n   <td>${s.espera_p90} min<\u002Ftd>\n   <td><span class=\"pill ${slaCls(s.sla)}\">${s.sla}%<\u002Fspan><\u002Ftd>\n   <td>${s.agentes??'n/d'}<\u002Ftd>\n   <td>${s.atenciones_por_agente??'n/d'}<\u002Ftd>\n   <td>${s.ocupacion_pct_prom?s.ocupacion_pct_prom.toFixed(0)+'%':'n/d'}<\u002Ftd>\n <\u002Ftr>`).join('')+`<\u002Ftbody>`;\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
